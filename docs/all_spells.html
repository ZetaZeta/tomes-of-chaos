 "nm": "Bark Orders", "sc": "Enchantment", "lvl": 2, "tg": "Self", "sh": "Radius 6", "ef": "Allies in the area (not you) move up to 2 tiles toward you, free", "fl": "A sharp command: every ally within six tiles, summons included, moves up to two tiles toward you at once, without spending any movement.", "bk": "Notebook of Puppets"}, {"id": "flashing_runes", "nm": "Flashing Runes", "sc": "Evocation", "lvl": 3, "tg": "Self", "sh": "", "ef": "Flashing Runes (4 turns)", "fl": "Runes along your arms. For four turns, whenever you cast a spell, every foe beside you is blinded for a turn.", "bk": "Compendium of Pure Energy"}, {"id": "drag_under", "nm": "Drag Under", "sc": "Nature", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Depends on the ground each creature stands on (water)", "fl": "Hands of water at the ankles. A target on water takes 5 and is rooted; on dry floor it takes 1 and the ground beneath it turns to shallow water.", "bk": "Folio of the Hunt"}, {"id": "cacophonous_call", "nm": "Cacophonous Call", "sc": "Enchantment", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "Nauseated (2 turns) (foes only)", "fl": "A din that turns the stomach. For two turns the target can move or strike, never both: any step ends its attacks and spellcasting.", "bk": "Manual of Silver Tongues"}, {"id": "dwindle_to_a_speck", "nm": "Dwindle to a Speck", "sc": "Transmutation", "lvl": 5, "tg": "Enemy, range 5", "sh": "", "ef": "Tiny (4 turns)", "fl": "The target shrinks to the size of a beetle for four turns. Its attacks do no damage and it can move only one tile, and any foe may simply walk onto its tile and crush it.", "bk": "Black Grimoire of Change"}, {"id": "agitate_wounds", "nm": "Agitate Wounds", "sc": "Necromancy", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "1 necro damage, Agitated Wounds (10 turns)", "fl": "The target's wounds will not close: every hit it takes does two extra damage for ten turns, or until something heals it.", "bk": "Notebook of Whispers"}, {"id": "rip", "nm": "Rip", "sc": "Evocation", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "Tears for 1 force damage, and 1 more for every earlier Rip on the same target (up to 6)", "fl": "A tearing ray that hurts a little more each time it hits the same target: 1, then 2, then 3, up to 6.", "bk": "Pocket Guide of Havoc"}, {"id": "strength_of_one", "nm": "Strength of One", "sc": "Transmutation", "lvl": 3, "tg": "Self", "sh": "Radius 4", "ef": "Strength of One (5 turns) (allies only)", "fl": "Allies nearby share the might of the strongest among them, striking as hard as your best fighter for five turns.", "bk": "Grimoire of Flux"}, {"id": "unmaking", "nm": "Unmaking", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "2 necro damage, Unmaking (6 turns)", "fl": "A curse that undoes the dead's rest: if the target dies within six turns, its remains rise as a rampaging skeleton that attacks everyone.", "bk": "Treatise of Shades"}, {"id": "call_the_pack", "nm": "Call the Pack", "sc": "Nature", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Pack Wolf x3 (HP 2, Move 4, Attack 1 phys; Uncontrolled: fights on your side but acts on its own (you cannot command it))", "fl": "Three wolves answer the call and hunt on their own. You cannot give them orders, and they will not wait for you.", "bk": "Folio of the Hunt"}, {"id": "hornet_cloud", "nm": "Hornet Cloud", "sc": "Nature", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Hornet x5 (HP 1, Move 5, Attack 1 phys + Poisoned; Flies, Uncontrolled: fights on your side but acts on its own (you cannot command it))", "fl": "A buzzing cloud of hornets boils out and goes for the nearest foe. You cannot command them.", "bk": "Handbook of Roots"}, {"id": "raise_the_rabble", "nm": "Raise the Rabble", "sc": "Necromancy", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Shambling Dead x5 (HP 2, Move 2, Attack 1 phys; Undead, Uncontrolled: fights on your side but acts on its own (you cannot command it))", "fl": "Five shambling corpses claw out of the ground and lurch towards the enemy on their own.", "bk": "Compendium of Graves"}, {"id": "stampede_herd", "nm": "Stampede of Aurochs", "sc": "Nature", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Charging Aurochs x2 (HP 4, Move 4, Attack 2 phys; Cannot be pushed, Uncontrolled: fights on your side but acts on its own (you cannot command it))", "fl": "Two great aurochs thunder at the foe the moment they can move. They answer to no one.", "bk": "Grimoire of Claws"}, {"id": "blade_dance", "nm": "Blade Dance", "sc": "Evocation", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Dancing Blade x3 (HP 2, Move 4, Attack 2 phys; Flies, Construct, Uncontrolled: fights on your side but acts on its own (you cannot command it), Immune poison)", "fl": "Three swords whirl into the air and fight without a wielder. You cannot command them.", "bk": "Grimoire of Radiance"}, {"id": "spirit_legion", "nm": "Spirit Legion", "sc": "Divine", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Legion Spirit x4 (HP 3, Move 3, Attack 2 phys; Flies, Uncontrolled: fights on your side but acts on its own (you cannot command it), Immune holy)", "fl": "A legion of radiant spirits rises to fight for you, but takes its orders from no one.", "bk": "Opus of Light"}, {"id": "wyrmling_brood", "nm": "Wyrmling Brood", "sc": "Conjuration", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Wyrmling x3 (HP 4, Move 3, Attack 1 phys, Ranged 2 fire, range 3; Flies, Uncontrolled: fights on your side but acts on its own (you cannot command it), Immune fire)", "fl": "A brood of fire-spitting wyrmlings hatches and takes wing against your foes, uncommanded.", "bk": "Apocrypha of Contracts"}, {"id": "call_the_warhost", "nm": "Call the Warhost", "sc": "Conjuration", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Warhost Footman x7 (HP 3, Move 3, Attack 2 phys; Uncontrolled: fights on your side but acts on its own (you cannot command it))", "fl": "A full warhost of footmen marches out of nowhere and advances on its own. A great force, but one you cannot hold back.", "bk": "Apocrypha of Contracts"}, {"id": "avalanche_giant", "nm": "Unleash the Avalanche Giant", "sc": "Geomancy", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Avalanche Giant (HP 12, Move 2, Attack 3 phys; Uncontrolled: fights on your side but acts on its own (you cannot command it), Cannot be pushed, Reach 2, Resists phys)", "fl": "A giant of rock and rubble tears free of the ground and rampages towards your enemies. It fights for you, but you cannot hold it back.", "bk": "Arcanum of Sand"}, {"id": "wasting_plague", "nm": "Wasting Plague", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Wasting Pestilence (6 turns)", "fl": "A creeping weakness: the target's attacks do 1 less damage, and it spreads to everyone beside it each turn with the same time left, friend or foe.", "bk": "Treatise of Shades"}, {"id": "blackpox", "nm": "Blackpox", "sc": "Necromancy", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Blackpox (5 turns)", "fl": "Black sores that burn with 1 necrotic damage a turn and leap to every creature beside the victim, carrying the time left.", "bk": "Opus of Bones"}, {"id": "marsh_fever", "nm": "Marsh Fever", "sc": "Nature", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Marsh Fever (6 turns)", "fl": "A burning fever that halves movement and spreads to everyone beside the victim each turn with the same time left.", "bk": "Lexicon of Roots"}, {"id": "epidemic", "nm": "Epidemic", "sc": "Necromancy", "lvl": 5, "tg": "Any square, range 6", "sh": "Radius 1", "ef": "Wasting Pestilence (7 turns), Blackpox (7 turns), Marsh Fever (7 turns)", "fl": "All three pestilences at once. Every living creature caught takes them, and they run through a crowd.", "bk": "Magnum Opus of Rot"}, {"id": "lucky_page", "nm": "Lucky Page", "sc": "Divination", "lvl": 1, "tg": "Self", "sh": "", "ef": "Adds 1 random spell of level 1 to 2 from the whole library to your memory for this battle", "fl": "A stray page turns up in your robes: one random spell of level 1 or 2, from any book in the world, for this battle.", "bk": "Primer of Foresight"}, {"id": "flash_of_insight", "nm": "Flash of Insight", "sc": "Divination", "lvl": 2, "tg": "Self", "sh": "", "ef": "Adds 2 random spells of level 1 to 2 from the whole library to your memory for this battle", "fl": "Two random spells of level 1 or 2 flash into your mind for this battle, whether or not you own the books.", "bk": "Pocket Guide of Stars"}, {"id": "arcane_windfall", "nm": "Arcane Windfall", "sc": "Divination", "lvl": 3, "tg": "Self", "sh": "", "ef": "Adds 3 random spells of level 1 to 3 from the whole library to your memory for this battle", "fl": "Three random spells of level 1 to 3, from any school, are yours for this battle.", "bk": "Grimoire of Fate"}, {"id": "forbidden_page", "nm": "Forbidden Page", "sc": "Divination", "lvl": 4, "tg": "Self", "sh": "", "ef": "Adds 1 random spell of level 4 to 5 from the whole library to your memory for this battle", "fl": "A page from a book you never found: one random spell of level 4 or 5 for this battle.", "bk": "Tome of Auspices"}, {"id": "chaos_library", "nm": "Chaos Library", "sc": "Chaos", "lvl": 3, "tg": "Self", "sh": "", "ef": "Adds 2 random spells of level 1 to 4 from the whole library to your memory for this battle", "fl": "Two random spells of level 1 to 4 tumble out of the air. They may be wonderful. They may be strange.", "bk": "Treatise of Disorder"}, {"id": "fire_in_the_blood", "nm": "Fire in the Blood", "sc": "Pyromancy", "lvl": 2, "tg": "Self", "sh": "", "ef": "Adds 2 random pyromancy spells of level 1 to 3 from the whole library to your memory for this battle", "fl": "Two random fire spells of level 1 to 3 blaze up in your memory for this battle.", "bk": "Manual of Sparks"}, {"id": "thunderous_thoughts", "nm": "Thunderous Thoughts", "sc": "Storm", "lvl": 2, "tg": "Self", "sh": "", "ef": "Adds 2 random storm spells of level 1 to 3 from the whole library to your memory for this battle", "fl": "Two random storm spells of level 1 to 3 crack through your mind for this battle.", "bk": "Manual of Stormfronts"}, {"id": "grave_whispers", "nm": "Grave Whispers", "sc": "Necromancy", "lvl": 2, "tg": "Self", "sh": "", "ef": "Adds 2 random necromancy or blood spells of level 1 to 3 from the whole library to your memory for this battle", "fl": "The dead whisper two random necromancy or blood spells of level 1 to 3 to you for this battle.", "bk": "Handbook of Bones"}, {"id": "green_lessons", "nm": "Green Lessons", "sc": "Nature", "lvl": 2, "tg": "Self", "sh": "", "ef": "Adds 2 random nature spells of level 1 to 3 from the whole library to your memory for this battle", "fl": "The wood teaches you two random nature spells of level 1 to 3 for this battle.", "bk": "Pocket Guide of Thorns"}, {"id": "muses_favour", "nm": "Muse's Favour", "sc": "Divination", "lvl": 4, "tg": "Self", "sh": "", "ef": "Muse's Favour (5 turns)", "fl": "For five turns a random spell of level 1 to 3 comes to mind at the start of each of your turns.", "bk": "Black Grimoire of Stars"}, {"id": "scholars_trance", "nm": "Scholar's Trance", "sc": "Divination", "lvl": 5, "tg": "Self", "sh": "", "ef": "Scholar's Trance (4 turns)", "fl": "For four turns a random spell of level 2 to 4 comes to mind at the start of each of your turns.", "bk": "Magnum Opus of Secrets"}, {"id": "elemental_muse", "nm": "Elemental Muse", "sc": "Evocation", "lvl": 4, "tg": "Self", "sh": "", "ef": "Elemental Muse (5 turns)", "fl": "For five turns a random fire, cold, storm, force or earth spell of level 1 to 3 comes to mind at the start of each of your turns.", "bk": "Grand Codex of Raw Power"}, {"id": "surge_of_vigor", "nm": "Surge of Vigor", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Regenerating (5 turns) (allies only)", "fl": "A wave of vigor: you and allies within three tiles regenerate for five turns, wherever you wander afterwards.", "bk": "Compendium of the Wild"}, {"id": "pall_of_dread", "nm": "Pall of Dread", "sc": "Necromancy", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Weakened (4 turns) (foes only)", "fl": "A pall of dread settles: foes within three tiles do 1 less damage for four turns.", "bk": "Grimoire of the Cold Dead"}, {"id": "wave_of_lethargy", "nm": "Wave of Lethargy", "sc": "Transmutation", "lvl": 3, "tg": "Self", "sh": "Radius 2", "ef": "Slowed (4 turns) (foes only)", "fl": "A drowsy wave slows foes within two tiles for four turns.", "bk": "Compendium of Transformation"}, {"id": "withering_wave", "nm": "Withering Wave", "sc": "Necromancy", "lvl": 4, "tg": "Self", "sh": "Radius 2", "ef": "1 necro damage (foes only), Diseased (4 turns) (foes only)", "fl": "Foes within two tiles take 1 necrotic damage and cannot be healed for four turns.", "bk": "Tome of Bones"}, {"id": "word_of_silence", "nm": "Word of Silence", "sc": "Abjuration", "lvl": 4, "tg": "Self", "sh": "Radius 3", "ef": "Silenced (3 turns) (foes only)", "fl": "A hush falls: foes within three tiles cannot cast for three turns.", "bk": "Opus of Sigils"}, {"id": "burst_of_haste", "nm": "Burst of Haste", "sc": "Transmutation", "lvl": 5, "tg": "Self", "sh": "Radius 3", "ef": "Hasted (3 turns) (allies only)", "fl": "Time quickens around you: you and allies within three tiles are hasted for three turns.", "bk": "Apocrypha of Substance"}, {"id": "wave_of_flames", "nm": "Wave of Flames", "sc": "Pyromancy", "lvl": 3, "tg": "Self", "sh": "Radius 2", "ef": "1 fire damage (foes only), Warded (4 turns) (allies only)", "fl": "Flame rolls out: foes within two tiles take 1 fire damage, and allies there are warded against elemental damage for four turns.", "bk": "Codex of Ash"}, {"id": "befuddling_wave", "nm": "Befuddling Wave", "sc": "Enchantment", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Forgetful (4 turns) (foes only)", "fl": "Foes within three tiles forget anyone more than two tiles away for four turns.", "bk": "Compendium of Obedience"}, {"id": "stone_blessing", "nm": "Stone Blessing", "sc": "Geomancy", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Stoneskin (5 turns) (allies only)", "fl": "You and allies within three tiles gain stoneskin (physical damage reduced by 1) for five turns.", "bk": "Treatise of Titans"}, {"id": "clear_minds", "nm": "Clear Minds", "sc": "Divination", "lvl": 2, "tg": "Self", "sh": "Radius 4", "ef": "Clear Sight (5 turns) (allies only), True Sight (5 turns) (allies only)", "fl": "You and allies within four tiles cannot be blinded and can see invisible creatures for five turns.", "bk": "Notebook of Far Sight"}, {"id": "shared_freedom", "nm": "Shared Freedom", "sc": "Abjuration", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Free Movement (5 turns) (allies only)", "fl": "You and allies within three tiles cannot be rooted, slowed or held for five turns.", "bk": "Grimoire of Banishment"}, {"id": "soothing_shower", "nm": "Soothing Shower", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Heals 2 (allies only)", "fl": "A warm shower heals you and allies within three tiles for 2.", "bk": "Treatise of Seasons"}, {"id": "mass_dwindle", "nm": "Mass Dwindle", "sc": "Transmutation", "lvl": 5, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Tiny (3 turns) (foes only)", "fl": "Foes in a small area shrink to the size of beetles for three turns: no damage, one step of movement, and anyone may crush them.", "bk": "Black Grimoire of Change"}, {"id": "salt_the_wounds", "nm": "Salt the Wounds", "sc": "Necromancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "1 necro damage (foes only), Agitated Wounds (8 turns) (foes only)", "fl": "Foes in the area take 1 damage, and every hit they take for eight turns does 2 extra until they are healed.", "bk": "Lexicon of Dread"}, {"id": "tearing_chain", "nm": "Tearing Chain", "sc": "Evocation", "lvl": 4, "tg": "Enemy, range 6", "sh": "Chains 3 times", "ef": "Tears for 1 force damage, and 1 more for every earlier Rip on the same target (up to 6)", "fl": "A tearing force leaps between foes, hitting each one harder than the last time it hit it (1, 2, 3 ...).", "bk": "Archive of Arcane Might"}, {"id": "curse_of_restless_dead", "nm": "Curse of the Restless Dead", "sc": "Necromancy", "lvl": 4, "tg": "Any square, range 6", "sh": "Radius 1", "ef": "1 necro damage (foes only), Unmaking (6 turns) (foes only)", "fl": "Foes in the area are cursed: any that die within six turns rise as rampaging skeletons that attack everyone.", "bk": "Grand Codex of Rot"}, {"id": "inoculate", "nm": "Inoculate", "sc": "Nature", "lvl": 2, "tg": "Self", "sh": "Radius 3", "ef": "Inoculated (8 turns) (allies only)", "fl": "You and allies within three tiles become immune to spreading pestilences for eight turns.", "bk": "Handbook of Roots"}, {"id": "aegis_zone", "nm": "Aegis Zone", "sc": "Abjuration", "lvl": 4, "tg": "Any square, range 5", "sh": "", "ef": "Creates Aegis Zone (every round, within 2 tiles: Heals 1 (allies only), Warded (2 turns) (allies only), lasts 6 turns)", "fl": "A shimmering zone for six turns: allies within two tiles of it are healed 1 and warded against elemental damage every round.", "bk": "Grand Codex of Aegis"}, {"id": "punish_the_aggressor", "nm": "Punish the Aggressor", "sc": "Divine", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Backlash (4 turns)", "fl": "For four turns the target suffers half of every point of damage it deals to anyone else.", "bk": "Compendium of Dawn"}, {"id": "banish_to_astral_plane", "nm": "Banish to the Astral Plane", "sc": "Spatial", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Astral Plane (3 turns)", "fl": "The target slips out of reach for three turns: it cannot be hurt and cannot attack, but it can still move and cast.", "bk": "Great Grimoire of Gravity"}, {"id": "astral_retreat", "nm": "Astral Retreat", "sc": "Spatial", "lvl": 3, "tg": "Self", "sh": "", "ef": "Astral Plane (2 turns)", "fl": "You slip out of reach for two turns: nothing can hurt you and you cannot attack, but you can still move and cast spells.", "bk": "Lexicon of Cartography"}, {"id": "circle_of_protection", "nm": "Circle of Protection", "sc": "Abjuration", "lvl": 2, "tg": "Self", "sh": "", "ef": "Circle of Protection (6 turns)", "fl": "A circle of protection turns aside every melee and missile attack, until you move, attack, or cast at anyone but yourself.", "bk": "Notebook of Aegis"}, {"id": "flaming_strikes", "nm": "Flaming Strikes", "sc": "Pyromancy", "lvl": 1, "tg": "Self", "sh": "", "ef": "Flaming Strikes (5 turns)", "fl": "For five turns each of your attacks also burns the target: 1 fire damage and burning.", "bk": "Folio of Flame"}, {"id": "freezing_strikes", "nm": "Freezing Strikes", "sc": "Cryomancy", "lvl": 1, "tg": "Self", "sh": "", "ef": "Freezing Strikes (5 turns)", "fl": "For five turns each of your attacks also chills the target: 1 cold damage and slowed for a turn.", "bk": "Scrap of Frost"}, {"id": "sunlit_strikes", "nm": "Sunlit Strikes", "sc": "Divine", "lvl": 1, "tg": "Self", "sh": "", "ef": "Sunlit Strikes (5 turns)", "fl": "For five turns each of your attacks also deals 2 holy damage, which hurts only undead and fiends.", "bk": "Notebook of Blessings"}, {"id": "arcane_armament", "nm": "Arcane Armament", "sc": "Transmutation", "lvl": 1, "tg": "Self", "sh": "", "ef": "Each creature hit gets one at random: Flaming Strikes (6 turns) / Freezing Strikes (6 turns) / Storm Aspect (6 turns) / Stone Echo (6 turns) / Sunlit Strikes (6 turns)", "fl": "Your weapon takes a random elemental enchantment for six turns: fire, frost, storm, stone or sun.", "bk": "Scrap of Change"}, {"id": "mountain_stance", "nm": "Mountain Stance", "sc": "Geomancy", "lvl": 2, "tg": "Self", "sh": "", "ef": "Mountain Stance (6 turns)", "fl": "For six turns, any turn you do not move your spells do +1 damage and you take 1 less physical damage.", "bk": "Pocket Guide of Iron"}, {"id": "fueled_by_flame", "nm": "Fuelled by Flame", "sc": "Pyromancy", "lvl": 1, "tg": "Self", "sh": "", "ef": "Fuelled by Flame (8 turns)", "fl": "For eight turns, every time you take fire damage your next damaging spell does +1 (up to +3).", "bk": "Folio of Flame"}, {"id": "photosynthesis", "nm": "Photosynthesis", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "Photosynthesis (8 turns)", "fl": "For eight turns you heal 1 at the start of each turn while it is day and neither raining nor foggy.", "bk": "Codex of Beasts"}, {"id": "healing_baths", "nm": "Healing Baths", "sc": "Nature", "lvl": 4, "tg": "Self", "sh": "", "ef": "Healing Baths (8 turns)", "fl": "For eight turns you heal 1 at the start of each turn while standing in water.", "bk": "Great Grimoire of Moss"}, {"id": "channel_spirits", "nm": "Channel Spirits", "sc": "Necromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Channelling Spirits (5 turns)", "fl": "For five turns a spirit joins you at the start of each turn, as long as you stay put. The spirits fight on their own.", "bk": "Codex of Dread"}, {"id": "ghost_conscriptor", "nm": "Ghost Conscriptor", "sc": "Necromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Ghost Conscriptor (6 turns)", "fl": "For six turns every creature that dies leaves a ghost behind that fights for you on its own.", "bk": "Tome of Graves"}, {"id": "undead_repellent", "nm": "Undead Repellent", "sc": "Necromancy", "lvl": 1, "tg": "Ally, range 5", "sh": "", "ef": "Grave Scent (6 turns)", "fl": "The target smells of the grave: undead ignore it for six turns, unless it harms one.", "bk": "Notebook of Whispers"}, {"id": "faithful_smite", "nm": "Faithful Smite", "sc": "Divine", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "force damage equal to 1 + your living allies (at most 4)", "fl": "A blast of faith that deals 1 force damage plus 1 for every living ally you have (at most 4).", "bk": "Pocket Guide of Dawn"}, {"id": "absorb_flame", "nm": "Absorb Flame", "sc": "Pyromancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Absorbs fires in the area; each one returns a spent fire spell to your mind (at most 2)", "fl": "Draw the fires in the area into yourself: each one puts out and returns a spent fire spell to your mind (up to 2).", "bk": "Grimoire of Brimstone"}, {"id": "amygdala_hijack", "nm": "Amygdala Hijack", "sc": "Enchantment", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "Each creature hit gets one at random: Terrified (2 turns) / Maddened (2 turns) / Stunned (1 turn)", "fl": "A surge of adrenaline: the target randomly flees in terror, goes into a mad rage, or freezes.", "bk": "Scrap of Wills"}, {"id": "mass_hysteria", "nm": "Mass Hysteria", "sc": "Enchantment", "lvl": 4, "tg": "Self", "sh": "Everything in sight", "ef": "Each creature hit gets one at random: Terrified (2 turns) / Maddened (2 turns) / Stunned (1 turn)", "fl": "Every foe you can see randomly flees, rages, or freezes.", "bk": "Great Grimoire of Compulsion"}, {"id": "mass_blinding", "nm": "Mass Blinding", "sc": "Divine", "lvl": 3, "tg": "Self", "sh": "Everything in sight", "ef": "Blind (5 turns) (foes only)", "fl": "A flash of sunlight blinds every foe you can see for five turns.", "bk": "Grimoire of Litany"}, {"id": "mass_freeze", "nm": "Mass Freeze", "sc": "Cryomancy", "lvl": 4, "tg": "Self", "sh": "Everything in sight", "ef": "Frozen (1 turn) (foes only), Slowed (3 turns) (foes only)", "fl": "Every foe you can see is frozen for a turn and slowed for three more.", "bk": "Grand Codex of Winter"}, {"id": "circle_of_binding", "nm": "Circle of Binding", "sc": "Divine", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Rooted (4 turns) (magical only), Pacified (4 turns) (magical only)", "fl": "A binding circle holds an undead, fiend, elemental, spirit or construct in place for four turns; it cannot attack until hurt.", "bk": "Manual of Litany"}, {"id": "banish_otherworldly", "nm": "Banish Otherworldly", "sc": "Divine", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Teleports randomly", "fl": "An undead, fiend, elemental, spirit or construct is flung to a random spot on the field.", "bk": "Compendium of Radiance"}, {"id": "grind_to_a_halt", "nm": "Grind to a Halt", "sc": "Geomancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Stunned (2 turns) (construct only), Rooted (3 turns) (construct only)", "fl": "The joints and gears of a construct seize for two turns.", "bk": "Notebook of Titans"}, {"id": "carcinization", "nm": "Carcinization", "sc": "Transmutation", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Become a Giant Crab for 5 turns: 3 HP (+ your bonus HP), 2 move, 1 damage, swim. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "The target becomes a giant crab for five turns.", "bk": "Compendium of Substance"}, {"id": "ant_form", "nm": "Ant Form", "sc": "Transmutation", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Become a Giant Ant for 6 turns: 2 HP (+ your bonus HP), 3 move, 1 damage. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "An ally becomes a giant ant for six turns.", "bk": "Grimoire of Metamorphosis"}, {"id": "enter_the_dragon", "nm": "Enter the Dragon", "sc": "Pyromancy", "lvl": 5, "tg": "Ally, range 5", "sh": "", "ef": "Become a Red Dragon for 4 turns: 10 HP (+ your bonus HP), 3 move, 2 damage, fly, reach, ranged 5. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "An ally becomes a red dragon for four turns.", "bk": "Magnum Opus of Ash"}, {"id": "dilution", "nm": "Dilution", "sc": "Alchemy", "lvl": 2, "tg": "Ally, range 5", "sh": "", "ef": "Removes Poisoned, Oiled, Powdered, Gummed, Mudcaked, Diseased, Nauseated", "fl": "Washes poison, oil, powder, pitch, mud and disease off an ally.", "bk": "Pocket Guide of Residue"}, {"id": "warming_campfire", "nm": "Warming Campfire", "sc": "Pyromancy", "lvl": 3, "tg": "Any square, range 5", "sh": "", "ef": "Creates Warming Campfire (every round, within 2 tiles: Heals 1 (including you), lasts 8 turns)", "fl": "A cheerful campfire for eight turns: everyone within two tiles is healed 1 each round.", "bk": "Codex of Ash"}, {"id": "whirling_rock_aura", "nm": "Whirling Rock Aura", "sc": "Geomancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Whirling Rocks (8 turns)", "fl": "For eight turns spinning rocks batter every foe next to you for 2 damage each round.", "bk": "Magnum Opus of Crystal"}, {"id": "night_terror", "nm": "Night Terror", "sc": "Enchantment", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "3 psychic damage (asleep only), Terrified (3 turns) (asleep only)", "fl": "A terrible dream: a sleeping target takes 3 psychic damage and wakes in terror.", "bk": "Handbook of Whispers"}, {"id": "creeping_ooze", "nm": "Creeping Ooze", "sc": "Chaos", "lvl": 3, "tg": "Any square, range 5", "sh": "", "ef": "Creates Creeping Ooze (HP 2, can be attacked, anything entering it: Rooted (2 turns), 1 acid damage, each turn, to anything in it: 1 acid damage, Rooted (1 turn), each turn 50% chance to spread to a neighbouring square, up to 4 times along a chain (about 14 pieces at most), lasts 8 turns)", "fl": "A glob of living slime that creeps across the floor, gripping and scalding anything it touches. Friend or foe.", "bk": "Grimoire of the Unwritten"}, {"id": "strangling_vines", "nm": "Strangling Vines", "sc": "Nature", "lvl": 3, "tg": "Any square, range 5", "sh": "", "ef": "Creates Strangling Vines (HP 1, can be attacked, anything entering it: Rooted (2 turns) (foes only), each turn, to anything in it: 1 phys damage (foes only), each turn 45% chance to spread to a neighbouring square, up to 4 times along a chain (about 14 pieces at most), lasts 9 turns)", "fl": "Vines that grip your enemies and spread, slowly, along the ground. They leave your allies alone.", "bk": "Compendium of the Wild"}, {"id": "spreading_briars", "nm": "Spreading Briars", "sc": "Nature", "lvl": 4, "tg": "Any square, range 5", "sh": "", "ef": "Creates Spreading Briars (blocks movement, HP 2, can be attacked, each turn 35% chance to spread to a neighbouring square, up to 3 times along a chain (about 12 pieces at most), lasts 10 turns)", "fl": "A hedge of briars that grows square by square, blocking the way. It burns.", "bk": "Tome of Thorns"}, {"id": "rolling_blaze", "nm": "Rolling Blaze", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 5", "sh": "", "ef": "Creates Rolling Blaze (anything entering it: Burning (2 turns), each turn, to anything in it: 1 fire damage, Burning (2 turns), each turn 55% chance to spread to a neighbouring square, up to 3 times along a chain (about 14 pieces at most), lasts 5 turns)", "fl": "A hungry fire that leaps from square to square whether or not there is anything to burn. It makes no distinction between friends and foes.", "bk": "Great Grimoire of Sparks"}, {"id": "spreading_rime", "nm": "Spreading Rime", "sc": "Cryomancy", "lvl": 3, "tg": "Any square, range 5", "sh": "", "ef": "Creates Spreading Rime (anything entering it: Slowed (2 turns), Each creature has a 50% chance to be knocked prone (not fliers or anchored), each turn, to anything in it: 1 cold damage, each turn 50% chance to spread to a neighbouring square, up to 4 times along a chain (about 14 pieces at most), lasts 8 turns)", "fl": "A creeping frost that slows and trips those on it, and spreads across the floor.", "bk": "Compendium of the Long Night"}, {"id": "spreading_mire", "nm": "Spreading Mire", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 5", "sh": "", "ef": "Creates Mire Seep (turns the ground here and the squares next to it into Mud, then the Mud spreads one or two squares a turn in wandering directions, when it ends the ground goes back to normal, lasts 10 turns)", "fl": "The ground softens to mud around the target, and the mud keeps spreading, slowing everyone who wades through it.", "bk": "Treatise of Titans"}, {"id": "creeping_bog", "nm": "Creeping Bog", "sc": "Nature", "lvl": 4, "tg": "Any square, range 5", "sh": "", "ef": "Creates Bog Seep (turns the ground here and the squares next to it into Poison Bog, then the Poison Bog spreads one or two squares a turn in wandering directions, when it ends the ground goes back to normal, lasts 9 turns)", "fl": "A poisonous bog wells up and spreads outward, a square or two at a time. Anyone entering it is poisoned.", "bk": "Great Grimoire of Moss"}, {"id": "widening_rift", "nm": "Widening Rift", "sc": "Geomancy", "lvl": 5, "tg": "Any square, range 5", "sh": "", "ef": "Creates Widening Rift (turns the ground here into Chasm, then the Chasm spreads one square a turn in wandering directions, when it ends the ground goes back to normal, lasts 8 turns)", "fl": "The ground splits and the crack keeps widening, one square a turn. Only fliers cross it. It closes when the spell ends.", "bk": "Apocrypha of Iron"}, {"id": "sprouting_grove", "nm": "Sprouting Grove", "sc": "Nature", "lvl": 5, "tg": "Any square, range 5", "sh": "", "ef": "Creates Grove Seed (turns the ground here into Tree, then the Tree spreads one square a turn in wandering directions, when it ends the ground goes back to normal, lasts 10 turns)", "fl": "A seed that grows a tree where it falls and keeps raising more, one at a time. Trees block movement and sight; the grove withers when the spell ends.", "bk": "Forbidden Tome of Seasons"}, {"id": "lava_seep", "nm": "Lava Seep", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 5", "sh": "", "ef": "Creates Lava Seep (turns the ground here into Lava, then the Lava spreads one square a turn in wandering directions, when it ends the ground becomes Scorched Earth, lasts 7 turns)", "fl": "Molten rock oozes up and flows, one square a turn, in whatever direction it likes. It cools to scorched earth when the spell ends.", "bk": "Archive of Flame"}, {"id": "hotfoot", "nm": "Hotfoot", "sc": "Pyromancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Hotfoot (4 turns)", "fl": "The target's feet burn: 1 fire damage for every square it walks, for four turns. Standing still is safe.", "bk": "Pocket Guide of the Pyre"}, {"id": "frostbitten_feet", "nm": "Frostbitten Feet", "sc": "Cryomancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Frostbitten Feet (4 turns)", "fl": "Every step costs the target 1 cold damage for four turns.", "bk": "Manual of Icicles"}, {"id": "walking_on_glass", "nm": "Walking on Glass", "sc": "Geomancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Glass Soles (4 turns)", "fl": "The ground cuts like broken glass: 1 damage for every square the target walks, for four turns.", "bk": "Treatise of Faults"}, {"id": "soul_anchor", "nm": "Soul Anchor", "sc": "Abjuration", "lvl": 3, "tg": "Ally, range 6", "sh": "", "ef": "Soul Anchor (6 turns)", "fl": "For six turns magical damage cannot take the target below 3 HP. Physical blows still can.", "bk": "Grimoire of Banishment"}, {"id": "flamethrower", "nm": "Flamethrower", "sc": "Pyromancy", "lvl": 3, "tg": "Any square, range 6", "sh": "Line, length 6", "ef": "4 fire damage, 1 less for each square beyond the first", "fl": "A jet of fire along a line: 4 damage point-blank, one less for every square further out.", "bk": "Grimoire of Sparks"}, {"id": "bonechill_cone", "nm": "Bone-Chilling Cone", "sc": "Cryomancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Cone, length 5", "ef": "4 cold damage, 1 less for each square beyond the first", "fl": "A cone of killing frost, strongest near you and fading with distance.", "bk": "Lexicon of Snowfall"}, {"id": "quarter_turn", "nm": "Quarter Turn", "sc": "Spatial", "lvl": 3, "tg": "Any square, range 6", "sh": "", "ef": "Turns the 3x3 square around the target a quarter turn clockwise: terrain, objects and creatures together", "fl": "The 3x3 square around the target turns a quarter turn: ground, objects and creatures together. Flanks become fronts.", "bk": "Compendium of Thresholds"}, {"id": "revolution", "nm": "Revolution", "sc": "Spatial", "lvl": 5, "tg": "Any square, range 6", "sh": "", "ef": "Turns the 7x7 square around the target a quarter turn clockwise: terrain, objects and creatures together", "fl": "A whole 7x7 patch of the battlefield swings a quarter turn clockwise, taking everything on it along.", "bk": "Black Grimoire of Gates"}, {"id": "time_warp", "nm": "Time Warp", "sc": "Spatial", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Every temporary status on creatures affected advances 2 turns (good and bad alike)", "fl": "Time rushes forward for everyone in the area: every temporary status, good or bad, loses two turns.", "bk": "Grand Codex of Elsewhere"}, {"id": "time_draft", "nm": "Time Draft", "sc": "Divination", "lvl": 5, "tg": "Self", "sh": "Radius 5", "ef": "Every temporary status on creatures affected advances 99 turns (good and bad alike)", "fl": "Everyone within five squares, you included, is swept to the end of their temporary statuses: buffs, curses and all.", "bk": "Magnum Opus of Secrets"}, {"id": "termites", "nm": "Termites", "sc": "Nature", "lvl": 2, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Rots wooden objects and trees away; wooden creatures take 3 damage", "fl": "A swarm eats every wooden thing in the area: briars, vines, thorn walls and trees vanish, and wooden creatures take 3 damage.", "bk": "Notebook of Seasons"}, {"id": "glass_wall", "nm": "Wall of Glass", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Place up to 4 connected squares", "ef": "Creates Wall of Glass (blocks movement, HP 4, can be attacked, lasts 10 turns)", "fl": "A transparent wall: it blocks movement but not sight. If it is broken, the shards cut everything beside it for 2 damage.", "bk": "Opus of Iron"}, {"id": "speed_bump", "nm": "Speed Bump", "sc": "Geomancy", "lvl": 1, "tg": "Any square, range 5", "sh": "", "ef": "Creates Speed Bump (anything entering it: 1 phys damage, Slowed (1 turn), lasts 8 turns)", "fl": "A ridge of stone that hurts and slows anyone who walks over it.", "bk": "Primer of Crystal"}, {"id": "meteor_strike", "nm": "Meteor Strike", "sc": "Evocation", "lvl": 5, "tg": "Any square, range 6", "sh": "", "ef": "Creates Meteor Crater (every round, within 1 tiles: 1 poison damage, Weakened (1 turn), lasts 6 turns)", "fl": "A rock from the sky: 4 fire damage to everything within one square, and the crater it leaves gives off poison and weakness for six turns.", "bk": "Black Grimoire of Invocation"}, {"id": "exploding_creature", "nm": "Exploding Creature", "sc": "Necromancy", "lvl": 4, "tg": "Enemy, range 6", "sh": "", "ef": "Target creature explodes: it dies, and everything within 2 tiles takes damage equal to its remaining life (max 8, force)", "fl": "The target creature bursts: it dies, and everything within two squares takes damage equal to the life it had left (at most 8).", "bk": "Great Grimoire of the Cold Dead"}, {"id": "kamikaze_crabs", "nm": "Kamikaze Crabs", "sc": "Chaos", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Kamikaze Crab x2 (HP 3, Move 3, Attack 1 phys; Kamikaze, Explodes, Uncontrolled: fights on your side but acts on its own (you cannot command it))", "fl": "Two crabs scuttle at the nearest creature and burst on it for 4 fire damage to everything beside them, friend or foe. You cannot call them back.", "bk": "Compendium of Mayhem"}, {"id": "troll_booth", "nm": "Troll Booth", "sc": "Conjuration", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Booth Troll (HP 6, Move 0, Attack 2 phys; Cannot move, Regenerates)", "fl": "A booth with a troll in it. The troll cannot leave, regenerates, and punches whatever comes near.", "bk": "Treatise of Bound Things"}, {"id": "alter_ego", "nm": "Alter Ego", "sc": "Illusion", "lvl": 5, "tg": "Empty square, range 3", "sh": "", "ef": "Summons Alter Ego (a double of you; casts up to 3 of your own prepared spells, chosen when it appears)", "fl": "A stationary double of you appears (8 life). While it stands it can cast up to three of your own prepared spells, chosen when it appears, from where it stands.", "bk": "Black Grimoire of Mirrors"}, {"id": "boobytraps", "nm": "Boobytraps", "sc": "Alchemy", "lvl": 3, "tg": "Any square, range 5", "sh": "Place up to 4 connected squares", "ef": "Creates Boobytrap (anything entering it: Each creature hit gets one at random: 4 fire damage (foes only) / Slowed (1 turn) (foes only) / Slowed (1 turn) (foes only), lasts 12 turns)", "fl": "Up to four hidden traps in a connected patch. Only some are real: each one that is stepped on has a one in three chance to explode for 4 fire damage; the others just slow the walker.", "bk": "Compendium of Cauldrons"}, {"id": "spell_vending_machine", "nm": "Spell Vending Machine", "sc": "Conjuration", "lvl": 4, "tg": "Any square, range 4", "sh": "", "ef": "Creates Spell Vending Machine (blocks movement, HP 4, can be attacked, every round, within 1 tiles: Muse's Favour (2 turns) (allies only), lasts 8 turns)", "fl": "A machine that dispenses magic: allies standing next to it are granted a random spell from the whole library each turn, for eight turns.", "bk": "Grand Codex of Calling"}, {"id": "pie_in_the_face", "nm": "Pie in the Face", "sc": "Chaos", "lvl": 1, "tg": "Enemy, range 4", "sh": "", "ef": "Blind (2 turns), Slowed (1 turn)", "fl": "A custard pie out of nowhere: the target is blind for two turns and slowed for one while it wipes its face.", "bk": "Folio of Chance"}, {"id": "phantom_strike", "nm": "Phantom Strike", "sc": "Illusion", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "Each creature hit gets one at random: 4 psychic damage / 1 psychic damage", "fl": "An illusory blow: half the time the target believes it and takes 4 psychic damage, otherwise only 1.", "bk": "Handbook of Shadows"}, {"id": "crossbow", "nm": "Crossbow", "sc": "Conjuration", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a crossbow. You gain a ranged attack: 3 phys, range 6. 4 uses, then it is gone", "fl": "A heavy bolt-thrower with four bolts: 3 damage at range 6.", "bk": "Pocket Guide of Pacts"}, {"id": "sticky_stick", "nm": "Sticky Stick", "sc": "Enchantment", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a sticky stick. You gain a ranged attack: 1 phys, range 5 + Slowed. 4 uses, then it is gone", "fl": "A wand with four charges: each shot slows its target for two turns.", "bk": "Folio of Dominion"}, {"id": "stumble_stick", "nm": "Stumble Stick", "sc": "Enchantment", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a stumble stick. You gain a ranged attack: 1 phys, range 5 + Prone. 3 uses, then it is gone", "fl": "A wand with three charges: each shot trips its target.", "bk": "Grimoire of Compulsion"}, {"id": "shift_stick", "nm": "Shift Stick", "sc": "Spatial", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a shift stick. You gain a ranged attack: 1 force, range 5, pushes 1. 4 uses, then it is gone", "fl": "A wand with four charges: each shot shoves its target one square away.", "bk": "Manual of Time"}, {"id": "blaster_stick", "nm": "Blaster Stick", "sc": "Evocation", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a blaster stick. You gain a ranged attack: 3 force, range 5. 3 uses, then it is gone", "fl": "A wand with three charges: each shot does 3 force damage.", "bk": "Grimoire of Radiance"}, {"id": "reckless_charge", "nm": "Reckless Charge", "sc": "Evocation", "lvl": 3, "tg": "Enemy, range 4", "sh": "", "ef": "5 force damage, You take 2 force damage as well", "fl": "Best used from a position of astonishing strength or of impending defeat: the target takes five damage and so, to a lesser degree, do you.", "bk": "Codex of Arcane Might"}, {"id": "prevent_benefice", "nm": "Prevent Benefice", "sc": "Abjuration", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Spurned (4 turns)", "fl": "The target can be neither healed nor blessed for four turns: heals fail and beneficial effects slide off.", "bk": "Handbook of Barriers"}, {"id": "restful_lullaby", "nm": "Restful Lullaby", "sc": "Enchantment", "lvl": 2, "tg": "Ally, range 5", "sh": "", "ef": "Heals 4, Removes harmful effects, Asleep (1 turn)", "fl": "A lullaby that compels a friend to take a micro-rest: four health back and every harmful effect gone, at the price of sleeping through their next turn.", "bk": "Folio of Dominion"}, {"id": "correct_hurts", "nm": "Correct Hurts", "sc": "Divine", "lvl": 1, "tg": "Ally, range 4", "sh": "", "ef": "Heals 2; any healing beyond full health becomes extra maximum HP (up to 2)", "fl": "Heals 2. Healing a creature that is already whole makes it sturdier instead, up to 2 extra maximum HP.", "bk": "Scrap of Light"}, {"id": "squared_triangle", "nm": "Squaring a Triangle's Sides", "sc": "Transmutation", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Its strength and its stride trade places for 4 turns: its damage becomes its movement (up to 4) and its movement becomes its damage plus 1 (up to 6)", "fl": "A tangle of impossible geometry: for four turns the creature's damage and movement swap places. Brutes crawl, scuttlers hit hard.", "bk": "Treatise of Quicksilver"}, {"id": "hesitation_hex", "nm": "Hesitation Hex", "sc": "Enchantment", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "1 psychic damage, Hesitant (2 turns) (foes only)", "fl": "A needling doubt: 1 damage, and the target's next attack fizzles.", "bk": "Primer of Charm"}, {"id": "personal_space", "nm": "Personal Space", "sc": "Abjuration", "lvl": 1, "tg": "Enemy, range 4", "sh": "", "ef": "Aversion (2 turns) (foes only)", "fl": "For two turns the target cannot step onto a tile beside any other creature.", "bk": "Primer of Sigils"}, {"id": "fog_of_forgetting", "nm": "Fog of Forgetting", "sc": "Enchantment", "lvl": 1, "tg": "Enemy, range 4", "sh": "", "ef": "Forgetful (2 turns) (foes only)", "fl": "One creature forgets anyone more than two tiles away for two turns and will not chase.", "bk": "Primer of Charm"}, {"id": "shove_of_chaos", "nm": "Shove of Chaos", "sc": "Chaos", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "Jostled (2 turns) (foes only)", "fl": "The target is shoved one tile in a random direction at the start of each of its next two turns.", "bk": "Folio of Chance"}, {"id": "tether_pull", "nm": "Tether Pull", "sc": "Spatial", "lvl": 1, "tg": "Enemy, range 4", "sh": "", "ef": "1 phys damage (foes only), Pulls 3", "fl": "A cord of force hauls a foe up to three tiles toward you.", "bk": "Folio of Distance"}, {"id": "counterstance", "nm": "Counterstance", "sc": "Abjuration", "lvl": 1, "tg": "Self", "sh": "", "ef": "Riposte (2 turns)", "fl": "For two turns each melee blow you survive is answered with one of your own.", "bk": "Scrap of Wards"}, {"id": "fade_from_notice", "nm": "Fade from Notice", "sc": "Illusion", "lvl": 1, "tg": "Self", "sh": "", "ef": "Overlooked (3 turns)", "fl": "Foes ignore you unless they are adjacent. It ends the moment you attack or cast.", "bk": "Primer of Smoke"}, {"id": "plant_your_feet", "nm": "Plant Your Feet", "sc": "Nature", "lvl": 1, "tg": "Self", "sh": "", "ef": "Anchored (3 turns), Stoneskin (3 turns)", "fl": "You cannot be pushed, pulled or swapped, and take a little less from every blow.", "bk": "Primer of Roots"}, {"id": "sticky_coat", "nm": "Sticky Coat", "sc": "Alchemy", "lvl": 1, "tg": "Ally, range 4", "sh": "", "ef": "Gummed (3 turns) (allies only)", "fl": "An ally is coated in glue: anyone who hits it in melee is stuck fast for a turn.", "bk": "Pamphlet of Poisons"}, {"id": "rallying_bolt", "nm": "Rallying Bolt", "sc": "Evocation", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "force damage equal to 1 + your living allies (at most 2)", "fl": "1 force damage, plus 1 for each allied creature in sight (up to 2 extra).", "bk": "Folio of Arcane Might"}, {"id": "quick_step", "nm": "Quick Step", "sc": "Spatial", "lvl": 1, "tg": "Enemy, range 3", "sh": "", "ef": "You blink to a free tile beside the target, 1 phys damage (foes only)", "fl": "Dart up beside the target and clip it.", "bk": "Scrap of Gates"}, {"id": "coup_de_grace", "nm": "Coup de Grace", "sc": "Necromancy", "lvl": 1, "tg": "Enemy, range 4", "sh": "", "ef": "Instant death if HP <= 1, else 1 damage (necro) (bosses resist)", "fl": "Ends a creature with 1 HP; anything healthier takes 1 necrotic damage.", "bk": "Scrap of Graves"}, {"id": "pebble_toss", "nm": "Pebble Toss", "sc": "Geomancy", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "Damage 1 + loose objects and corpses within 2 tiles of you (max 2), phys", "fl": "Hurls whatever loose rubble and corpses lie within two tiles of you: 1 damage plus 1 per item (up to 2).", "bk": "Scrap of Stone"}, {"id": "sunbeam", "nm": "Sunbeam", "sc": "Divine", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "1 holy damage, Depends on the light — day: Blind (2 turns) (foes only); default: Blind (1 turn) (foes only)", "fl": "A dazzling shaft of light: the target is blinded for a turn (two by day). Undead and fiends are also burned for 1 holy damage, 2 by day.", "bk": "Notebook of Blessings"}, {"id": "puddle", "nm": "Puddle", "sc": "Geomancy", "lvl": 1, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Turns ground into Shallow Water, Soaked (2 turns) (foes only)", "fl": "Turns bare floor to shallow water and soaks anyone in it. Lightning loves it; fire hates it.", "bk": "Scrap of Stone"}, {"id": "greasy_boots", "nm": "Greasy Boots", "sc": "Alchemy", "lvl": 1, "tg": "Self", "sh": "", "ef": "Slippery Footsteps (2 turns)", "fl": "For two turns you leave a slick of grease behind every step you take.", "bk": "Primer of Acids"}, {"id": "parch", "nm": "Parch", "sc": "Necromancy", "lvl": 1, "tg": "Enemy, range 4", "sh": "", "ef": "Parched (3 turns) (foes only)", "fl": "The target loses 1 HP at the start of each turn until it reaches water or three turns pass.", "bk": "Primer of Dread"}, {"id": "command_strike", "nm": "Command Strike", "sc": "Enchantment", "lvl": 1, "tg": "Self", "sh": "Entire battlefield", "ef": "Each of your allies strikes a random foe within 5 squares for 1 phys damage", "fl": "One of your allies lashes out at a random foe near it for 1 damage.", "bk": "Scrap of Wills"}];
const $=i=>document.getElementById(i);
[...new Set(D.map(x=>x.sc))].sort().forEach(x=>$('s').add(new Option(x,x)));
[...new Set(D.map(x=>x.lvl))].sort((a,b)=>a-b).forEach(x=>$('v').add(new Option('Level '+x,x)));
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function r(){const q=$('q').value.toLowerCase(),s=$('s').value,v=$('v').value,o=$('o').selectedIndex;
let L=D.filter(x=>(!s||x.sc===s)&&(!v||x.lvl==v)&&(!q||(x.nm+' '+x.ef+' '+x.fl+' '+x.tg).toLowerCase().includes(q)));
L.sort((a,b)=>o==1?a.lvl-b.lvl||a.nm.localeCompare(b.nm):o==2?a.sc.localeCompare(b.sc)||a.lvl-b.lvl||a.nm.localeCompare(b.nm):a.nm.localeCompare(b.nm));
$('n').textContent=L.length+' of '+D.length+' spells';
$('m').innerHTML=L.map(x=>`<div class="c"><span class="l">L${x.lvl}</span><b>${esc(x.nm)}</b><div class="m">${esc(x.sc)} · ${esc(x.tg)}${x.sh?' · '+esc(x.sh):''}</div><div class="e">${esc(x.ef)}</div><div class="f">${esc(x.fl)}</div></div>`).join('');}
['q','s','v','o'].forEach(i=>$(i).addEventListener('input',r));r();
</script></body></html>
