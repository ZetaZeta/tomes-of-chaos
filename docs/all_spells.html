ilver"}, {"id": "changing_armor", "nm": "Changing Armor", "sc": "Transmutation", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Adaptive Skin (5 turns)", "fl": "For five turns a hit of the same damage type as the last one the ally took does half damage. Mix your damage types.", "bk": "Compendium of Substance"}, {"id": "lingering_reprisal", "nm": "Lingering Reprisal", "sc": "Divine", "lvl": 3, "tg": "Self", "sh": "", "ef": "Reprisal (4 turns)", "fl": "For four turns whoever hurts you takes force damage: 1 for the first hit each round, 2 for the second, 3 for each after.", "bk": "Grimoire of Litany"}, {"id": "overflow_bolt", "nm": "Overflow Bolt", "sc": "Evocation", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "3 force damage; if it kills, the excess carries to the nearest other foe within 2 tiles", "fl": "3 force damage; if it kills, the unspent damage carries to the nearest other foe within two tiles.", "bk": "Manual of Impact"}, {"id": "grim_tally", "nm": "Grim Tally", "sc": "Necromancy", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "2 necro damage, or 5 if any creature has died this round", "fl": "2 necrotic damage, or 5 if any creature has died this round.", "bk": "Primer of Dread"}, {"id": "cascade_bolt", "nm": "Cascade Bolt", "sc": "Storm", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "1 elec damage plus 1 for each other spell you cast this turn (max 6)", "fl": "1 lightning damage plus 1 for each other spell you have cast this turn (max 6). Cast it last.", "bk": "Codex of Gales"}, {"id": "spreading_affliction", "nm": "Spreading Affliction", "sc": "Enchantment", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Every harmful effect on each target lasts 2 turns longer and gains a stack", "fl": "Every harmful effect on foes in the area lasts 2 turns longer and gains a stack.", "bk": "Grand Codex of Whispers"}, {"id": "kindred_smite", "nm": "Kindred Smite", "sc": "Necromancy", "lvl": 5, "tg": "Enemy, range 6", "sh": "", "ef": "4 necro damage to the target and every foe of the same kind anywhere on the board", "fl": "4 necrotic damage to the target and to every other foe of the same kind anywhere on the board.", "bk": "Forbidden Tome of the Cold Dead"}, {"id": "melee_rupture", "nm": "Melee Rupture", "sc": "Geomancy", "lvl": 3, "tg": "Self", "sh": "Radius 12", "ef": "3 phys damage to every creature, friend or foe, standing beside a creature of the other side", "fl": "The earth shudders under every duel: 3 physical damage to every creature, friend or foe, standing beside a creature of the other side.", "bk": "Lexicon of Stone"}, {"id": "dampening_field", "nm": "Dampening Field", "sc": "Abjuration", "lvl": 6, "tg": "Any square, range 6", "sh": "", "ef": "Creates Dampening Field (lasts 6 turns)", "fl": "For six turns all damage dealt to anyone within two tiles of the spot is halved, rounded down, friend and foe alike.", "bk": "Arcanum of Sanctuary"}, {"id": "ground_shudder", "nm": "Ground Shudder", "sc": "Geomancy", "lvl": 2, "tg": "Any square, range 4", "sh": "Radius 2", "ef": "Prone (1 turn) (foes only)", "fl": "The ground heaves: foes in the area are knocked prone and lose their next move getting up. Fliers and anchored creatures are unaffected.", "bk": "Manual of Sand"}, {"id": "snare_thicket", "nm": "Snare Thicket", "sc": "Nature", "lvl": 2, "tg": "Any square, range 5", "sh": "", "ef": "Creates Snare Thicket (anything entering it: Prone (1 turn) (foes only), lasts 6 turns)", "fl": "Plants knit across the spot for six turns: any foe that steps there is knocked prone.", "bk": "Notebook of Seasons"}, {"id": "skid_ice", "nm": "Skid Ice", "sc": "Cryomancy", "lvl": 2, "tg": "Any square, range 5", "sh": "", "ef": "Creates Skid Ice (anything entering it: Prone (1 turn), lasts 6 turns)", "fl": "A patch of slick ice for six turns: anyone who steps there, friend or foe, is knocked prone.", "bk": "Manual of Icicles"}, {"id": "avalanche_wave", "nm": "Avalanche Wave", "sc": "Cryomancy", "lvl": 4, "tg": "Any square, range 4", "sh": "Cone, length 4", "ef": "2 cold damage (foes only), 1 phys damage (foes only), Prone (1 turn) (foes only)", "fl": "A cone of crushing snow: 2 cold and 1 physical damage, and everything in it is knocked prone.", "bk": "Archive of Frost"}, {"id": "rolling_boulder_line", "nm": "Rolling Boulder Line", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 6", "sh": "Line, length 6", "ef": "3 phys damage (foes only), Prone (1 turn) (foes only)", "fl": "A boulder races down a line: 3 physical damage to every foe on it, and each is knocked prone.", "bk": "Codex of Crystal"}, {"id": "judo_trip", "nm": "Judo Trip", "sc": "Transmutation", "lvl": 2, "tg": "Enemy, range 1", "sh": "", "ef": "Prone (1 turn) (foes only), Pushes 2 (foes only)", "fl": "Touch a foe, throw it two tiles, and leave it prone.", "bk": "Manual of Flux"}, {"id": "cutting_guard", "nm": "Cutting Guard", "sc": "Abjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "Sentinel Stance (5 turns)", "fl": "For five turns any foe that moves while beside you provokes a free strike: 2 physical damage.", "bk": "Lexicon of Wards"}, {"id": "pincer_drill", "nm": "Pincer Drill", "sc": "Enchantment", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Pincer Drill (5 turns)", "fl": "For five turns the ally's melee hits do +1 damage whenever another of your side stands directly opposite the target.", "bk": "Grimoire of Silver Tongues"}, {"id": "anchoring_roots", "nm": "Anchoring Roots", "sc": "Nature", "lvl": 2, "tg": "Self", "sh": "", "ef": "You gain Rooted (4 turns), You gain Anchored (4 turns), You gain Regenerating (4 turns)", "fl": "You put down roots for four turns: you cannot move, and cannot be pushed, pulled, swapped or knocked prone, and you regenerate.", "bk": "Notebook of Beasts"}, {"id": "predators_frenzy", "nm": "Predator's Frenzy", "sc": "Necromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Predator's Frenzy (5 turns)", "fl": "For five turns, when a foe dies within two tiles of you, its allies within four tiles of it take 2 necrotic damage and are weakened.", "bk": "Grand Codex of Shades"}, {"id": "resonant_backlash", "nm": "Resonant Backlash", "sc": "Enchantment", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "1 psychic damage per effect on each target, good or bad (max 6)", "fl": "The target takes 1 psychic damage for every effect on it, good or bad (max 6). Best used after you have stacked curses.", "bk": "Opus of Wills"}, {"id": "fate_rebound", "nm": "Fate Rebound", "sc": "Abjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "Fate Rebound (4 turns)", "fl": "For four turns whoever damages you is slowed for two turns.", "bk": "Codex of Sigils"}, {"id": "size_siphon", "nm": "Size Siphon", "sc": "Transmutation", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Shrunken (4 turns), You gain Enlarged (4 turns)", "fl": "The target shrinks (less damage, slower) while you grow (more damage, longer reach) for four turns.", "bk": "Great Grimoire of Metamorphosis"}, {"id": "grasping_wall", "nm": "Grasping Wall", "sc": "Conjuration", "lvl": 4, "tg": "Any square, range 3", "sh": "Line, length 3", "ef": "Creates Grasping Hands (blocks movement, HP 3, can be attacked, every round, within 1 tiles: Rooted (2 turns) (foes only), lasts 8 turns)", "fl": "A line of stone hands rises for eight turns: it blocks movement, and each round it roots foes beside it for two turns. The hands can be destroyed.", "bk": "Opus of Pacts"}, {"id": "brief_exile", "nm": "Brief Exile", "sc": "Spatial", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Removes the target from the field for 2 rounds (it cannot act or be hit, but foes held away still stop a victory); it returns where it stood", "fl": "Send a foe out of the world for two rounds. It cannot act or be hit, and it returns where it stood. Foes held away still stop you winning.", "bk": "Lexicon of Cartography"}, {"id": "cloud_refuge", "nm": "Cloud Refuge", "sc": "Divine", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Removes the target from the field for 2 rounds (it cannot act or be hit, but foes held away still stop a victory); it returns healed 5", "fl": "Spirit an ally into a bank of cloud for two rounds. It comes back healed for 5.", "bk": "Lexicon of Light"}, {"id": "skip_ahead", "nm": "Skip Ahead", "sc": "Spatial", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Removes the target from the field for 1 round (it cannot act or be hit, but foes held away still stop a victory); it returns with hasted (2)", "fl": "An ally slips out of time for a round and returns hasted.", "bk": "Compendium of Thresholds"}, {"id": "humble_the_mighty", "nm": "Humble the Mighty", "sc": "Enchantment", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Removes the target from the field for 1 round (it cannot act or be hit, but foes held away still stop a victory); it returns with weakened (4)", "fl": "A foe is cast out for a round and comes back weakened for four turns.", "bk": "Grand Codex of Dominion"}, {"id": "oubliette", "nm": "Oubliette", "sc": "Spatial", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Removes the target from the field for 2 rounds (it cannot act or be hit, but foes held away still stop a victory); it returns taking 9 force damage", "fl": "Drop a foe into a lightless pocket for two rounds. It returns to where it stood and takes 9 force damage.", "bk": "Opus of Cartography"}, {"id": "scatter_gate", "nm": "Scatter Gate", "sc": "Spatial", "lvl": 5, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Removes the target from the field for 1 round (it cannot act or be hit, but foes held away still stop a victory); it returns at a random nearby tile", "fl": "Everything in the area (friend and foe, except you) is flung out of the world for a round and drops back at random places nearby.", "bk": "Black Grimoire of Gates"}, {"id": "pocket_dimension", "nm": "Pocket Dimension", "sc": "Conjuration", "lvl": 4, "tg": "Any square, range 4", "sh": "Radius 1", "ef": "Removes the target from the field for 2 rounds (it cannot act or be hit, but foes held away still stop a victory); it returns healed 3, cleansed of afflictions", "fl": "Allies in the area rest in a folded pocket for two rounds and return healed for 3 and cleansed of every affliction.", "bk": "Archive of Summoning"}, {"id": "frost_shell", "nm": "Frost Shell", "sc": "Cryomancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Frosted (4 turns) (foes only)", "fl": "Rime crusts over a foe for four turns. Cold freezes it solid for a turn; a physical, force or sonic blow does +3 and shatters the shell; fire melts it.", "bk": "Notebook of Hoarfrost"}, {"id": "mudcake", "nm": "Mudcake", "sc": "Nature", "lvl": 2, "tg": "Ally, range 4", "sh": "", "ef": "Mudcaked (5 turns) (allies only)", "fl": "Cake an ally in wet clay for five turns: lightning does nothing to it and fire does 2 less (the heat bakes the mud off).", "bk": "Folio of Beasts"}, {"id": "mud_splash", "nm": "Mud Splash", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 4", "sh": "Radius 2", "ef": "Mudcaked (5 turns) (allies only)", "fl": "A wave of thick mud washes over allies in the area, grounding them against lightning and fire for five turns.", "bk": "Lexicon of Stone"}, {"id": "pitch_smear", "nm": "Pitch Smear", "sc": "Alchemy", "lvl": 2, "tg": "Enemy, range 4", "sh": "", "ef": "Gummed (4 turns) (foes only)", "fl": "Black pitch coats a foe for four turns: anyone who hits it in melee sticks fast and is rooted for a turn.", "bk": "Folio of Elixirs"}, {"id": "phantom_lure", "nm": "Phantom Lure", "sc": "Illusion", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Phantom (HP 1, Move 3, Attack 1 phys; Phantom, Phased). Leaves after 6 turns", "fl": "A convincing phantom soldier appears for six turns. Foes rate it as a prime target and waste attacks on it; it dies in one hit.", "bk": "Handbook of Shadows"}, {"id": "phantom_host", "nm": "Phantom Host", "sc": "Illusion", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Phantom x3 (HP 1, Move 3, Attack 1 phys; Phantom, Phased). Leaves after 6 turns", "fl": "Three phantom soldiers fan out for six turns. Foes chase them first; each dissolves in one hit.", "bk": "Archive of Shadows"}, {"id": "nothing_to_see", "nm": "Nothing to See Here", "sc": "Illusion", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Overlooked (4 turns)", "fl": "For four turns foes ignore you unless they are adjacent. Attacking or casting ends it.", "bk": "Lexicon of Mirrors"}, {"id": "beneath_notice", "nm": "Beneath Notice", "sc": "Illusion", "lvl": 2, "tg": "Ally, range 4", "sh": "", "ef": "Overlooked (4 turns) (allies only)", "fl": "An ally slips from the enemy's attention for four turns: foes ignore it unless adjacent. Its first attack or spell ends the effect.", "bk": "Notebook of Phantasms"}, {"id": "shroud_of_obscurity", "nm": "Shroud of Obscurity", "sc": "Illusion", "lvl": 4, "tg": "Any square, range 4", "sh": "Radius 2", "ef": "Overlooked (2 turns) (allies only)", "fl": "A drifting haze makes allies in the area forgettable for two turns.", "bk": "Tome of Masks"}, {"id": "goad_foe", "nm": "Goad", "sc": "Enchantment", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "The target thinks only of you for 2 turns: it will attack no one else if it can reach you", "fl": "A foe can think only of you for two turns and will attack no one else while it can reach you.", "bk": "Pocket Guide of Moods"}, {"id": "fog_of_memory", "nm": "Fog of Memory", "sc": "Enchantment", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Forgetful (3 turns) (foes only)", "fl": "Foes in the area forget anyone more than two tiles away for three turns and will not chase.", "bk": "Codex of Charm"}, {"id": "phantom_wounds", "nm": "Phantom Wounds", "sc": "Illusion", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Phantom Wounds (4 turns) (foes only)", "fl": "The target is convinced it is bleeding: 2 psychic damage a turn for four turns. Any real injury shatters the delusion.", "bk": "Lexicon of Mirrors"}, {"id": "false_floor", "nm": "False Floor", "sc": "Illusion", "lvl": 2, "tg": "Empty square, range 4", "sh": "", "ef": "Creates False Floor (anything entering it: 4 phys damage (foes only), Rooted (2 turns) (foes only), Prone (1 turn) (foes only))", "fl": "A seeming stretch of solid floor over a drop. The first foe to step on it takes 4 damage, is rooted and knocked prone. Foes cannot see it coming.", "bk": "Manual of Veils"}, {"id": "true_sight", "nm": "True Sight", "sc": "Divination", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain True Sight (6 turns)", "fl": "For six turns you can target invisible and hidden creatures at any range.", "bk": "Treatise of Far Sight"}, {"id": "unmask", "nm": "Unmask", "sc": "Divination", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Phantoms in the area are dispelled; foes lose invisibility, overlooked, feigned death, mirror images and gaseous form", "fl": "Phantoms in the area are dispelled; foes lose invisibility, anonymity, feigned death, mirror images and gaseous form.", "bk": "Treatise of Far Sight"}, {"id": "spreading_sickness", "nm": "Spreading Sickness", "sc": "Nature", "lvl": 4, "tg": "Any square, range 6", "sh": "", "ef": "Creates Spreading Sickness", "fl": "In three chapters over three rounds: foes beside the spot are poisoned and diseased (they cannot be healed); the sickness spreads (radius 2, 1 poison); then it peaks for 3 poison damage in radius 3.", "bk": "Opus of Roots"}, {"id": "winters_hammer", "nm": "Winter's Hammer", "sc": "Cryomancy", "lvl": 5, "tg": "Any square, range 6", "sh": "", "ef": "Creates Winter's Hammer", "fl": "In three chapters over three rounds, radius 3: foes are soaked; frost bites (1 cold, which freezes the soaked) and crusts them; then a hammer of force lands for 4, plus 3 for each shell it shatters.", "bk": "Apocrypha of Icicles"}, {"id": "grim_harvest", "nm": "Grim Harvest", "sc": "Necromancy", "lvl": 5, "tg": "Any square, range 6", "sh": "", "ef": "Creates Grim Harvest", "fl": "In three chapters over three rounds, radius 3: foes are marked; they are drained for 2 and allies healed 1; then a final reaping does 3 necrotic damage and heals allies 3.", "bk": "Forbidden Tome of the Cold Dead"}, {"id": "slow_dawn", "nm": "Slow Dawn", "sc": "Divine", "lvl": 4, "tg": "Any square, range 6", "sh": "", "ef": "Creates Slow Dawn", "fl": "In three chapters over three rounds, radius 3: allies begin to regenerate; foes are blinded by the glare; then the sun breaks for 3 force damage to foes and 2 healing to allies.", "bk": "Opus of Light"}, {"id": "siege_engine", "nm": "Siege Engine", "sc": "Geomancy", "lvl": 5, "tg": "Any square, range 6", "sh": "", "ef": "Creates Siege Engine", "fl": "In three chapters over three rounds: the ground is churned to rubble; foes within two tiles are exposed (+2 damage taken); then the engine fires for 5 physical damage on all of them.", "bk": "Forbidden Tome of Titans"}, {"id": "totem_of_exposure", "nm": "Totem of Exposure", "sc": "Divination", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Totem of Exposure (HP 2, can be attacked, every round, within 3 tiles: Exposed (2 turns) (foes only), lasts 8 turns)", "fl": "A totem for eight turns: foes within three tiles take +1 damage from every hit. It can be destroyed.", "bk": "Treatise of Far Sight"}, {"id": "totem_of_silence", "nm": "Totem of Silence", "sc": "Abjuration", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Totem of Silence (HP 2, can be attacked, every round, within 3 tiles: Silenced (1 turn) (foes only), lasts 6 turns)", "fl": "A totem for six turns: foes within three tiles cannot cast spells. It can be destroyed.", "bk": "Tome of Wards"}, {"id": "totem_of_warding", "nm": "Totem of Warding", "sc": "Abjuration", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Totem of Warding (HP 2, can be attacked, every round, within 3 tiles: Warded (2 turns) (allies only), lasts 8 turns)", "fl": "A totem for eight turns that keeps a ward on every ally within three tiles. It can be destroyed.", "bk": "Opus of Sigils"}, {"id": "totem_of_rot", "nm": "Totem of Rot", "sc": "Necromancy", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Totem of Rot (HP 2, can be attacked, every round, within 3 tiles: Diseased (2 turns) (foes only), lasts 8 turns)", "fl": "A totem for eight turns: foes within three tiles are diseased and cannot be healed. It can be destroyed.", "bk": "Codex of Whispers"}, {"id": "ring_of_frost", "nm": "Ring of Frost", "sc": "Cryomancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Creates Ring of Frost (an expanding ring that grows one tile a turn out to 4 tiles, affecting only the tiles at its edge: 1 cold damage (foes only), Frosted (3 turns) (foes only), lasts 6 turns)", "fl": "A ring of rime expands from you for four rounds: foes it crosses take 1 cold damage and are frosted (a blow shatters the shell for +3).", "bk": "Arcanum of Hoarfrost"}, {"id": "wave_of_pitch", "nm": "Wave of Pitch", "sc": "Alchemy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Creates Wave of Pitch (an expanding ring that grows one tile a turn out to 4 tiles, affecting only the tiles at its edge: Gummed (3 turns) (foes only), Slowed (2 turns) (foes only), lasts 6 turns)", "fl": "A ring of black pitch spreads from you for four rounds: foes it crosses are gummed (melee attackers get stuck) and slowed.", "bk": "Magnum Opus of Retorts"}, {"id": "ring_of_whispers", "nm": "Ring of Whispers", "sc": "Enchantment", "lvl": 3, "tg": "Self", "sh": "", "ef": "Creates Ring of Whispers (an expanding ring that grows one tile a turn out to 4 tiles, affecting only the tiles at its edge: Forgetful (2 turns) (foes only), lasts 6 turns)", "fl": "A ring of murmurs spreads from you for four rounds: foes it crosses forget anyone more than two tiles away.", "bk": "Compendium of Moods"}, {"id": "intercept_blow", "nm": "Intercept Blow", "sc": "Abjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Interceptor (5 turns)", "fl": "For five turns, twice, you take the blow meant for an adjacent ally (if you can survive it).", "bk": "Compendium of Sanctuary"}, {"id": "bodyguard_pledge", "nm": "Bodyguard Pledge", "sc": "Abjuration", "lvl": 3, "tg": "Ally, range 4", "sh": "", "ef": "The target guards you for 5 turns: up to 2 times it takes a blow meant for you instead (if adjacent and it can survive it)", "fl": "An ally guards you for five turns: twice, it takes a blow meant for you instead, if it is adjacent and can survive it.", "bk": "Compendium of Banishment"}, {"id": "overwatch", "nm": "Overwatch", "sc": "Evocation", "lvl": 2, "tg": "Self", "sh": "", "ef": "You gain Overwatch (4 turns)", "fl": "For four turns, three times, you fire on a foe that moves in sight within six tiles: 2 physical damage.", "bk": "Manual of Impact"}, {"id": "covering_fire", "nm": "Covering Fire", "sc": "Evocation", "lvl": 4, "tg": "Any square, range 4", "sh": "Radius 2", "ef": "Overwatch x2 (4 turns) (allies only)", "fl": "Allies in the area each get two overwatch shots for four turns: a foe moving in their sight within six tiles takes 2 damage.", "bk": "Archive of Invocation"}, {"id": "disrupting_presence", "nm": "Disrupting Presence", "sc": "Enchantment", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Disrupting Presence (5 turns)", "fl": "For five turns any foe within four tiles takes 3 psychic damage whenever it casts a spell.", "bk": "Codex of Charm"}, {"id": "discordant_ward", "nm": "Discordant Ward", "sc": "Abjuration", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Disrupting Presence (5 turns) (allies only)", "fl": "An ally hums with discord for five turns: foes within four tiles of it take 3 psychic damage whenever they cast.", "bk": "Codex of Sigils"}, {"id": "sympathetic_mending", "nm": "Sympathetic Mending", "sc": "Divine", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Sympathetic Mending (6 turns)", "fl": "For six turns, whenever an ally within four tiles is healed you are healed for half as much.", "bk": "Grand Codex of Judgement"}, {"id": "curse_mirror", "nm": "Curse Mirror", "sc": "Abjuration", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Curse Mirror (6 turns)", "fl": "For six turns, twice, a harmful effect cast on you by a foe is thrown back at the foe instead.", "bk": "Tome of Sanctuary"}, {"id": "hex_bounce", "nm": "Hex Bounce", "sc": "Abjuration", "lvl": 4, "tg": "Ally, range 5", "sh": "", "ef": "Curse Mirror x2 (6 turns) (allies only)", "fl": "An ally is given a curse mirror for six turns: twice, a harmful effect a foe puts on it bounces back at the foe.", "bk": "Archive of Seals"}, {"id": "mote_of_power", "nm": "Mote of Power", "sc": "Evocation", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Mote of Power (anything entering it: A wizard who touches it gains 1 cast, lasts 12 turns)", "fl": "A mote of raw magic hangs on the spot for twelve turns. The first wizard to step on it (you or an enemy) gains an extra cast.", "bk": "Lexicon of Force"}, {"id": "memory_bloom", "nm": "Memory Bloom", "sc": "Divination", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Memory Bloom (anything entering it: A wizard who touches it gains 0 casts and 1 spent spell return, lasts 12 turns)", "fl": "A flower of recollection blooms for twelve turns. If you step on it, one spent spell returns to your mind. An enemy wizard who gets there first only wastes it.", "bk": "Tome of Auspices"}, {"id": "fruit_of_the_vale", "nm": "Fruit of the Vale", "sc": "Nature", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Healing Fruit (anything entering it: Heals 5 (including you), lasts 12 turns)", "fl": "A ripe fruit lies on the spot for twelve turns. Whoever steps on it first, friend or foe, is healed 5.", "bk": "Manual of Moss"}, {"id": "banner_of_valor", "nm": "Banner of Valor", "sc": "Divine", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Banner of Valor (anything entering it: Hasted (3 turns) (including you), Regenerating (3 turns) (including you), lasts 12 turns)", "fl": "A banner is planted for twelve turns. The first creature to take it, either side, is hasted and regenerates for three turns.", "bk": "Compendium of Radiance"}, {"id": "storm_orb", "nm": "Storm Orb", "sc": "Storm", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Storm Orb (anything entering it: Storm Aspect (4 turns) (including you), lasts 12 turns)", "fl": "A crackling orb floats on the spot for twelve turns. Whoever touches it first has lightning in every strike for four turns.", "bk": "Codex of Tempests"}, {"id": "warding_idol", "nm": "Warding Idol", "sc": "Abjuration", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Warding Idol (anything entering it: Shielded x2 (5 turns) (including you), lasts 12 turns)", "fl": "A small idol stands for twelve turns. The first creature to pick it up, either side, gets a shield that absorbs two hits.", "bk": "Notebook of Warding"}, {"id": "orchard_row", "nm": "Orchard Row", "sc": "Nature", "lvl": 4, "tg": "Any square, range 5", "sh": "Line, length 5", "ef": "Creates Healing Fruit (anything entering it: Heals 5 (including you), lasts 12 turns)", "fl": "Fruit ripens along a line of five tiles. Each can be picked once, by anyone, for 5 healing: a race to eat first.", "bk": "Tome of Thorns"}, {"id": "ricochet_bolt", "nm": "Ricochet Bolt", "sc": "Evocation", "lvl": 3, "tg": "Any square, range 8", "sh": "Line, length 8, bouncing off walls", "ef": "3 force damage (foes only)", "fl": "A bolt of force that caroms off walls and pillars for up to eight tiles, hitting every foe along its zigzag path. Aim it so the corner works for you.", "bk": "Codex of Arcane Might"}, {"id": "prism_ricochet", "nm": "Prism Ricochet", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 9", "sh": "Line, length 9, bouncing off walls", "ef": "2 fire damage (foes only), Burning (2 turns) (foes only)", "fl": "A searing beam bounces off walls for up to nine tiles, scorching and igniting each foe it crosses.", "bk": "Grand Codex of Smoke"}, {"id": "storm_carom", "nm": "Storm Carom", "sc": "Storm", "lvl": 4, "tg": "Any square, range 8", "sh": "Line, length 8, bouncing off walls", "ef": "3 elec damage (foes only)", "fl": "Lightning that rebounds off walls for up to eight tiles: 3 lightning damage to every foe on its path, even those behind cover.", "bk": "Tome of Cloudbreak"}, {"id": "phase_lance", "nm": "Phase Lance", "sc": "Spatial", "lvl": 4, "tg": "Any square, range 6", "sh": "Line, length 6, passing through walls", "ef": "4 force damage (foes only)", "fl": "A lance that ignores walls, statues and trees: 4 force damage to every foe on a line of six tiles, even behind cover.", "bk": "Opus of Cartography"}, {"id": "ghostly_spear", "nm": "Ghostly Spear", "sc": "Necromancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Line, length 5, passing through walls", "ef": "3 necro damage (foes only)", "fl": "A spear of dead light passes through stone: 3 necrotic damage to every foe on a five-tile line, walls or no walls.", "bk": "Codex of the Ossuary"}, {"id": "cross_strike", "nm": "Cross Strike", "sc": "Evocation", "lvl": 3, "tg": "Any square, range 6", "sh": "Cross, arms 3", "ef": "3 phys damage (foes only)", "fl": "Four blades of force slash out in a cross from the chosen tile, three tiles along each arm: 3 physical damage to every foe they cross. Walls stop each arm.", "bk": "Compendium of Pure Energy"}, {"id": "pillars_of_judgment", "nm": "Pillars of Judgment", "sc": "Divine", "lvl": 5, "tg": "Any square, range 6", "sh": "Cross, arms 4", "ef": "4 force damage (foes only), Marked (3 turns) (foes only)", "fl": "Four pillars of light stretch out from the chosen tile, four tiles each way: 4 force damage and marked.", "bk": "Forbidden Tome of Blessings"}, {"id": "rime_cross", "nm": "Rime Cross", "sc": "Cryomancy", "lvl": 4, "tg": "Any square, range 6", "sh": "Cross, arms 3", "ef": "2 cold damage (foes only), Slowed (3 turns) (foes only)", "fl": "A cross of freezing wind lays out from the chosen tile: 2 cold damage and slowed to every foe on its arms.", "bk": "Grand Codex of Winter"}, {"id": "saltire_burst", "nm": "Saltire Burst", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 6", "sh": "Diagonal cross, arms 3", "ef": "3 fire damage (foes only)", "fl": "Fire runs outward along the four diagonals from the chosen tile, three tiles each: 3 fire damage to every foe on them. Foes standing straight beside the centre are spared.", "bk": "Great Grimoire of Sparks"}, {"id": "hoard_power", "nm": "Hoard Power", "sc": "Divination", "lvl": 2, "tg": "Self", "sh": "", "ef": "Give up your remaining casts this turn: next turn you have 2 extra (up to 3 banked)", "fl": "Spend this turn's remaining casts to bank power: next turn you have two extra casts (up to 3 banked). Pays back one cast over.", "bk": "Manual of Auspices"}, {"id": "dammed_current", "nm": "Dammed Current", "sc": "Abjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "Give up your remaining casts this turn: next turn you have 3 extra (up to 3 banked), You gain Rooted (1 turn)", "fl": "Hold back a surge: you cannot move this turn, but next turn you have three extra casts.", "bk": "Lexicon of Wards"}, {"id": "spell_theft", "nm": "Spell Theft", "sc": "Enchantment", "lvl": 4, "tg": "Enemy, range 6", "sh": "", "ef": "Takes 1 random spell from each enemy wizard in the area into your own book", "fl": "Pluck a random spell from an enemy wizard's mind and add it to your book. It no longer has it.", "bk": "Archive of Charm"}, {"id": "pilfer_knowledge", "nm": "Pilfer Knowledge", "sc": "Divination", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Copies 1 random spell from each enemy wizard into your book (they keep them)", "fl": "Copy a random spell from an enemy wizard into your book. It keeps its own copy.", "bk": "Codex of Foresight"}, {"id": "spell_burn", "nm": "Spell Burn", "sc": "Evocation", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Burns 2 random spells out of each enemy wizard's mind", "fl": "Two random spells burn out of an enemy wizard's mind for good.", "bk": "Grimoire of Impact"}, {"id": "drain_power", "nm": "Drain Power", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Each enemy wizard hit has 1 fewer cast next turn; you bank the same", "fl": "An enemy wizard has one fewer cast next turn, and the power is banked for you.", "bk": "Lexicon of Bones"}, {"id": "library_raid", "nm": "Library Raid", "sc": "Enchantment", "lvl": 6, "tg": "Any square, range 6", "sh": "Radius 3", "ef": "Takes 1 random spell from each enemy wizard in the area into your own book", "fl": "Every enemy wizard in the area loses a random spell, and all of them are added to your book.", "bk": "Apocrypha of Moods"}, {"id": "ground_truth", "nm": "Ground Truth", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Depends on the ground each creature stands on (stone, wood, plant, earth, sand, ice, snow, water, bone, cloth)", "fl": "The earth answers according to what it is made of. Foes on stone are struck for 3; on plants they are rooted; on mud and sand they are slowed or blinded; on ice they fall; on water they take cold; on bones they wither.", "bk": "Compendium of Mountains"}, {"id": "lay_of_the_land", "nm": "Lay of the Land", "sc": "Nature", "lvl": 2, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Depends on the ground each creature stands on (plant, earth, stone, water, sand)", "fl": "Allies draw on the ground under them: plants make them regenerate, mud cakes them, stone hardens their skin, water washes them clean, sand lets them slip from sight.", "bk": "Handbook of Roots"}, {"id": "conduction", "nm": "Conduction", "sc": "Storm", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Depends on the ground each creature stands on (water, earth, ice, plant, wood, cloth)", "fl": "Lightning runs through the ground: 5 damage to foes standing in water or mud, only 1 to those on ice, plants, wood or cloth, and 2 to the rest.", "bk": "Treatise of Lightning"}, {"id": "frostbitten_soil", "nm": "Frostbitten Soil", "sc": "Cryomancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Depends on the ground each creature stands on (water, earth, plant, snow, ice)", "fl": "Frost bites up through wet or living ground: foes on water, mud, plants or snow are frosted and slowed; foes on bare ice freeze solid.", "bk": "Grimoire of Stillness"}, {"id": "scorch_the_earth", "nm": "Scorch the Earth", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Depends on the ground each creature stands on (plant, wood, cloth, stone, sand)", "fl": "Heat that feeds on fuel: foes on grass, wood or cloth take 3 fire damage and catch alight; on stone only 1; on sand they are dazzled by the glare.", "bk": "Tome of the Pyre"}, {"id": "grave_rising", "nm": "Grave Rising", "sc": "Necromancy", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Raises a Skeletal Warrior from up to 3 tiles of bones (the tile becomes floor) for 10 turns", "fl": "Up to three heaps of bones in the area knit into skeleton warriors that serve you for ten turns; the bones are used up.", "bk": "Tome of Graves"}, {"id": "awaken_grove", "nm": "Awaken Grove", "sc": "Nature", "lvl": 5, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Raises a Sapling from up to 2 tiles of tree (the tile becomes grass) for 10 turns", "fl": "Up to two trees in the area pull up their roots and walk as treant saplings for ten turns, leaving open grass behind.", "bk": "Magnum Opus of Beasts"}, {"id": "stone_sentries", "nm": "Stone Sentries", "sc": "Geomancy", "lvl": 5, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Raises a Living Statue from up to 2 tiles of statue (the tile becomes floor) for 10 turns", "fl": "Up to two statues in the area step off their plinths and fight for you for ten turns.", "bk": "Arcanum of Sand"}, {"id": "mire_men", "nm": "Mire Men", "sc": "Geomancy", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Raises a Mud Golem from up to 2 tiles of mud/bog (the tile becomes floor) for 10 turns", "fl": "Up to two patches of mud or bog in the area heave up as mud golems for ten turns, drying the ground behind them.", "bk": "Tome of Mountains"}, {"id": "hurl_foe", "nm": "Hurl Foe", "sc": "Transmutation", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Throws an adjacent foe onto the target tile: 3 damage to it, 2 to everything beside the landing, knocking them prone", "fl": "Seize the sturdiest foe beside you and throw it onto an empty tile within four: it takes 3 damage and falls prone, and everything beside the landing is hurt for 2 and knocked down. Bosses and anchored creatures cannot be thrown.", "bk": "Codex of Shapes"}, {"id": "fastball_special", "nm": "Fastball Special", "sc": "Transmutation", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Throws an adjacent ally onto the target tile: no harm to it, 3 to everything beside the landing", "fl": "Fling an adjacent ally into the fray: it lands unharmed on an empty tile within five and everything foe beside the landing takes 3 damage.", "bk": "Lexicon of Change"}, {"id": "skyward_toss", "nm": "Skyward Toss", "sc": "Transmutation", "lvl": 4, "tg": "Empty square, range 7", "sh": "", "ef": "Throws an adjacent foe onto the target tile: 5 damage to it, nothing else", "fl": "Heave an adjacent foe far across the field (range seven): it lands prone for 5 damage.", "bk": "Apocrypha of Substance"}, {"id": "boomer_toss", "nm": "Boomer Toss", "sc": "Conjuration", "lvl": 4, "tg": "Empty square, range 6", "sh": "", "ef": "Throws the strongest adjacent summoned creature of yours; it bursts on landing for fire damage equal to its HP left (max 8) around the spot", "fl": "Throw your strongest adjacent summoned creature at an empty tile within six: it bursts there, hurting every foe beside the landing for as much fire damage as it had HP left (max 8).", "bk": "Tome of Visitors"}, {"id": "call_flame_imp", "nm": "Call Flame Sprite", "sc": "Pyromancy", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Flame Sprite (HP 4, Move 3, Attack 1 phys; Flies, Immune fire). Leaves after 8 turns", "fl": "A flame sprite serves you for eight turns. Select it to cast Fire Bolt, Scorch or Smoke Screen from its own list, one spell a turn.", "bk": "Compendium of Kindling"}, {"id": "call_frost_sprite", "nm": "Call Frost Sprite", "sc": "Cryomancy", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Frost Sprite (HP 4, Move 3, Attack 1 phys; Flies, Immune cold). Leaves after 8 turns", "fl": "A frost sprite serves for eight turns and casts Frost Bolt, Frost Armor or Skid Ice at will, one a turn.", "bk": "Lexicon of Snowfall"}, {"id": "call_spark_wisp", "nm": "Call Spark Wisp", "sc": "Storm", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Spark Wisp (HP 3, Move 4, Attack 1 phys; Flies, Immune elec). Leaves after 8 turns", "fl": "A spark wisp serves for eight turns and casts Spark, Static Shield or Thunderclap at will.", "bk": "Codex of Gales"}, {"id": "call_bone_chanter", "nm": "Call Bone Chanter", "sc": "Necromancy", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Bone Chanter (HP 5, Move 2, Attack 1 phys; Undead). Leaves after 8 turns", "fl": "An undead chanter serves for eight turns and casts Chill Touch, Enfeeble or Cause Fear at will.", "bk": "Archive of the Ossuary"}, {"id": "call_mending_spirit", "nm": "Call Mending Spirit", "sc": "Divine", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Mending Spirit (HP 5, Move 3, Attack 0 phys; Flies, Phased). Leaves after 8 turns", "fl": "A healing spirit serves for eight turns and casts Minor Healing, Bless or Cleanse at will. It cannot fight.", "bk": "Compendium of Saints"}, {"id": "call_ward_keeper", "nm": "Call Ward Keeper", "sc": "Abjuration", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Ward Keeper (HP 8, Move 2, Attack 1 phys). Leaves after 8 turns", "fl": "A sturdy construct serves for eight turns and casts Shield Other, Mage Armor or Protection from Evil at will.", "bk": "Lexicon of Wards"}, {"id": "call_mirage_weaver", "nm": "Call Mirage Weaver", "sc": "Illusion", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Mirage Weaver (HP 4, Move 3, Attack 1 phys). Leaves after 8 turns", "fl": "An illusionist shade serves for eight turns and casts Blur, Dazzle, Fog Cloud or Beneath Notice at will.", "bk": "Tome of Veils"}, {"id": "call_briar_witch", "nm": "Call Briar Witch", "sc": "Nature", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Briar Witch (HP 6, Move 2, Attack 1 phys). Leaves after 8 turns", "fl": "A briar witch serves for eight turns and casts Entangle, Thorn Whip or Barkskin at will.", "bk": "Grand Codex of Greenwood"}, {"id": "call_flask_sprite", "nm": "Call Flask Sprite", "sc": "Alchemy", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Flask Sprite (HP 4, Move 3, Attack 1 phys; Flies). Leaves after 8 turns", "fl": "A flask sprite serves for eight turns and casts Acid Splash, Flask of Oil, Glue Bomb or Healing Potion at will.", "bk": "Tome of Distillation"}, {"id": "call_chaos_mote", "nm": "Call Chaos Mote", "sc": "Chaos", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Chaos Mote (HP 5, Move 3, Attack 1 phys; Flies). Leaves after 8 turns", "fl": "A chaos mote serves for eight turns and casts Wild Surge, Chaos Hop or Coin Toss at will. Results vary.", "bk": "Codex of Entropy"}, {"id": "call_blood_acolyte", "nm": "Call Blood Acolyte", "sc": "Blood", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Blood Acolyte (HP 6, Move 2, Attack 1 phys). Leaves after 8 turns", "fl": "A blood acolyte serves for eight turns and casts Bloodletting, Vampiric Bite or Wound Transfer at will.", "bk": "Great Grimoire of Hunger"}, {"id": "call_rift_scout", "nm": "Call Rift Scout", "sc": "Spatial", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Rift Scout (HP 4, Move 4, Attack 1 phys; Flies). Leaves after 8 turns", "fl": "A rift scout serves for eight turns and casts Phase Door, Void Grasp or Iron Pull at will.", "bk": "Great Grimoire of Gravity"}, {"id": "call_apprentice_shade", "nm": "Call Apprentice Shade", "sc": "Evocation", "lvl": 5, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Apprentice Shade (HP 7, Move 3, Attack 1 phys; Phased). Leaves after 8 turns", "fl": "A shade of a long-dead apprentice serves for eight turns and casts Magic Missile, Mage Slap, Force Bolt or Orb of Force at will.", "bk": "Arcanum of Impact"}, {"id": "call_stone_shaman", "nm": "Call Stone Shaman", "sc": "Geomancy", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Stone Shaman (HP 7, Move 2, Attack 1 phys). Leaves after 8 turns", "fl": "A stone shaman serves for eight turns and casts Stone Fist, Magic Stones, Granite Armor or Hurl Debris at will.", "bk": "Archive of Deep Places"}, {"id": "call_oracle_eye", "nm": "Call Oracle Eye", "sc": "Divination", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Oracle Eye (HP 4, Move 2, Attack 0 phys; Flies). Leaves after 8 turns", "fl": "A floating eye serves for eight turns and casts Hunter's Mark, Clear Sight or Good Omen at will.", "bk": "Compendium of Hidden Things"}, {"id": "dawns_call", "nm": "Dawn's Call", "sc": "Divine", "lvl": 5, "tg": "Self", "sh": "Radius 6", "ef": "Turns the field to daylight for the rest of the battle, 3 holy damage (foes only), Heals 2 (allies only)", "fl": "Turn the rest of the battle to daylight. Allies within six tiles are healed 2 and undead and fiends in range burn for 3 holy damage.", "bk": "Magnum Opus of Mercy"}, {"id": "dusk_falls", "nm": "Dusk Falls", "sc": "Illusion", "lvl": 5, "tg": "Self", "sh": "Radius 6", "ef": "Turns the field to night for the rest of the battle, Overlooked (2 turns) (allies only), Forgetful (2 turns) (foes only)", "fl": "Turn the rest of the battle to night. Allies within six tiles slip from notice for two turns and foes forget anyone more than two tiles away.", "bk": "Black Grimoire of Mirrors"}, {"id": "eclipse", "nm": "Eclipse", "sc": "Divination", "lvl": 6, "tg": "Self", "sh": "Radius 5", "ef": "Turns the field to night for 4 rounds, Blind (2 turns) (foes only)", "fl": "The sun is swallowed for four rounds, then the natural light returns. Foes within five tiles are blinded for two turns.", "bk": "Magnum Opus of Secrets"}, {"id": "noon_flare", "nm": "Noon Flare", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 6", "sh": "Radius 2", "ef": "Depends on the light — day: 5 fire damage (foes only); night: 3 fire damage (foes only); under: 2 fire damage (foes only), Blind (2 turns) (foes only)", "fl": "A pillar of fire fed by the sky: 6 damage by day, 3 by night, and underground only 2 plus a blinding flash.", "bk": "Grand Codex of Smoke"}, {"id": "moonbolt", "nm": "Moonbolt", "sc": "Cryomancy", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Depends on the light — day: 2 cold damage (foes only); night: 4 cold damage (foes only), Slowed (2 turns) (foes only); under: 4 cold damage (foes only)", "fl": "Silver cold: 2 damage by day, 5 and slowed at night, 4 underground.", "bk": "Grimoire of Stillness"}, {"id": "sunward_blessing", "nm": "Sunward Blessing", "sc": "Divine", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Depends on the light — day: Heals 5 (allies only), Removes harmful effects; night: Heals 2 (allies only); under: Heals 3 (allies only)", "fl": "A blessing that needs light: allies in the area are healed 5 and cleansed by day, 3 underground, only 2 at night.", "bk": "Lexicon of Psalms"}, {"id": "umbral_cloak", "nm": "Umbral Cloak", "sc": "Illusion", "lvl": 3, "tg": "Self", "sh": "", "ef": "Depends on the light — day: You gain Overlooked (1 turn); night: You gain Overlooked (4 turns); under: You gain Overlooked (4 turns)", "fl": "Wrap yourself in shadow: foes overlook you for four turns at night or underground, one turn by day.", "bk": "Tome of Veils"}, {"id": "deepdelvers_resonance", "nm": "Deepdelver's Resonance", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Depends on the light — day: 2 sonic damage (foes only); night: 3 sonic damage (foes only); under: 4 sonic damage (foes only), Prone (1 turn) (foes only)", "fl": "Stone-ringing sound: 2 damage under open sky, 3 at night, 5 and a fall underground where it echoes.", "bk": "Grimoire of Bedrock"}, {"id": "sunbloom", "nm": "Sunbloom", "sc": "Nature", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Depends on the light — day: Heals 3 (allies only), Regenerating (3 turns) (allies only); night: Regenerating (1 turn) (allies only)", "fl": "Flowers that follow the sun: by day allies in the area are healed 3 and regenerate; at night only a little; underground nothing grows.", "bk": "Compendium of the Wild"}, {"id": "nightfall_hunt", "nm": "Nightfall Hunt", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Depends on the light — day: 2 necro damage (foes only); night: 4 necro damage (foes only), Weakened (3 turns) (foes only); under: 5 necro damage (foes only), Weakened (3 turns) (foes only)", "fl": "The dark hunts for you: 5 necrotic damage and weakened at night or underground, only 2 by day.", "bk": "Grimoire of the Cold Dead"}, {"id": "aura_sanctity", "nm": "Aura of Sanctity", "sc": "Divine", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Aura of Sanctity (8 turns)", "fl": "Allies within 3 tiles are blessed (immune to mind-affecting magic) and warded (elemental damage -1) for as long as they stay near you. Lasts eight turns.", "bk": "Grand Codex of Judgement"}, {"id": "aura_vigor", "nm": "Aura of Vigor", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Aura of Vigor (8 turns)", "fl": "Allies within 3 tiles regenerate while they stay near you. Lasts eight turns.", "bk": "Lexicon of the Wild"}, {"id": "aura_dread", "nm": "Aura of Dread", "sc": "Necromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Aura of Dread (8 turns)", "fl": "Foes within 3 tiles are weakened (their attacks do 1 less) while they stay near you. Lasts eight turns.", "bk": "Tome of Last Breaths"}, {"id": "aura_lethargy", "nm": "Aura of Lethargy", "sc": "Transmutation", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Aura of Lethargy (8 turns)", "fl": "Foes within 2 tiles are slowed while they stay near you. Lasts eight turns.", "bk": "Archive of Becoming"}, {"id": "aura_clarity", "nm": "Aura of Clarity", "sc": "Divination", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Aura of Clarity (8 turns)", "fl": "Allies within 4 tiles cannot be blinded and can target invisible creatures while they stay near you. Lasts eight turns.", "bk": "Grimoire of Fate"}, {"id": "aura_freedom", "nm": "Aura of Freedom", "sc": "Abjuration", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Aura of Freedom (8 turns)", "fl": "Allies within 3 tiles cannot be rooted, slowed or held, and rough ground does not slow them, while they stay near you. Lasts eight turns.", "bk": "Great Grimoire of Shields"}, {"id": "aura_withering", "nm": "Aura of Withering", "sc": "Necromancy", "lvl": 5, "tg": "Self", "sh": "", "ef": "You gain Aura of Withering (8 turns)", "fl": "Foes within 2 tiles take 1 necrotic damage each round and cannot be healed. Lasts eight turns.", "bk": "Black Grimoire of the Ossuary"}, {"id": "aura_gentle_rain", "nm": "Aura of Gentle Rain", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Aura of Gentle Rain (8 turns)", "fl": "At the end of every round you and every ally within 3 tiles are healed 1. Lasts eight turns.", "bk": "Lexicon of the Wild"}, {"id": "aura_silence", "nm": "Aura of Silence", "sc": "Abjuration", st one more spell this turn. For four turns you gain a stack of Madness at the start of each; three stacks and you are Maddened.", "bk": "Black Grimoire of Marrow"}, {"id": "pallid_sigil", "nm": "Pallid Sigil", "sc": "Chaos", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Pallid Sigil (HP 2, can be attacked, every round, within 3 tiles: Madness (99 turns) (foes only), 1 psychic damage (foes only), lasts 6 turns)", "fl": "A sigil that hurts to look at. Foes within three tiles take a stack of Madness and 1 psychic damage each round it stands.", "bk": "Lexicon of Madness"}, {"id": "droning_piper", "nm": "Droning Piper", "sc": "Chaos", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Droning Piper (HP 3, can be attacked, every round, within 2 tiles: Madness (99 turns) (including you), lasts 5 turns)", "fl": "A thin, endless piping. Everyone within two tiles of it, friend or foe, gains a stack of Madness each round.", "bk": "Arcanum of the Unwritten"}, {"id": "ribbons_of_vanishing", "nm": "Ribbons of Vanishing", "sc": "Spatial", "lvl": 4, "tg": "Any square, range 3", "sh": "Cone, length 3", "ef": "1 force damage (foes only), Unravelling (6 turns) (foes only)", "fl": "Hanging threads of nothing. Foes in the cone take 1 damage and a strand; at three strands a creature is snatched away for three rounds and returns prone.", "bk": "Archive of Folds"}, {"id": "growing_clay_servant", "nm": "Growing Clay Servant", "sc": "Geomancy", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Clay Servant (HP 3, Move 3, Attack 1 phys; Construct)", "fl": "A small clay servant that gains 1 HP and 1 damage every turn. Three turns later it outgrows your hold and rampages.", "bk": "Tome of Mountains"}, {"id": "dream_door", "nm": "Dream Door", "sc": "Conjuration", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Dream Door (anything entering it: Removes the target from the field for 2 rounds (it cannot act or be hit, but foes held away still stop a victory); it returns with asleep (1), lasts 8 turns)", "fl": "A door that opens onto sleep. The first creature to step on it vanishes for two rounds and returns asleep.", "bk": "Compendium of Contracts"}, {"id": "lens_of_the_noon", "nm": "Lens of the Noon", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 6", "sh": "Line, length 6", "ef": "Depends on the light — day: 6 fire damage (foes only), Burning (2 turns) (foes only); night: 2 fire damage (foes only); under: 3 fire damage (foes only), Blind (2 turns) (foes only)", "fl": "A line of focused sunlight: 6 damage and burning by day, 3 and blinding underground, only 2 at night.", "bk": "Archive of Flame"}, {"id": "break_formation", "nm": "Break Formation", "sc": "Enchantment", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "1 psychic damage (foes only), Disordered (3 turns) (foes only)", "fl": "Foes in the area lose their nerve for three turns: no overwatch, interception, thicket or curse mirror.", "bk": "Compendium of Obedience"}, {"id": "revoke_the_ward", "nm": "Revoke the Ward", "sc": "Abjuration", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Removes Warded, Shielded, Stoneskin, Mirror Images, Unwarded (3 turns) (foes only)", "fl": "Tears away protective magic, then strips the target's natural resistances, immunities and heaviness for three turns.", "bk": "Treatise of Warding"}, {"id": "closing_crevice", "nm": "Closing Crevice", "sc": "Geomancy", "lvl": 4, "tg": "Any square, range 5", "sh": "Line, length 5", "ef": "Creates Closing Crevice (every round, within 0 tiles: 4 force damage (foes only), anything entering it: Rooted (2 turns) (foes only), lasts 2 turns)", "fl": "A line of ground splits. A foe who steps in is rooted, and anyone still standing in it when the round ends takes 4 force damage as it closes.", "bk": "Grand Codex of Faults"}, {"id": "parching_curse", "nm": "Parching Curse", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "2 necro damage (foes only), Parched (4 turns) (foes only)", "fl": "The target loses 1 HP a turn and takes extra fire damage until it reaches water or soft earth, which ends the curse.", "bk": "Grimoire of the Cold Dead"}, {"id": "circle_of_stagnation", "nm": "Circle of Stagnation", "sc": "Necromancy", "lvl": 3, "tg": "Any square, range 5", "sh": "", "ef": "Creates Stagnant Ground (lasts 8 turns)", "fl": "A still circle. No one within two tiles of it can be healed for eight rounds.", "bk": "Treatise of Whispers"}, {"id": "seed_of_mutiny", "nm": "Seed of Mutiny", "sc": "Enchantment", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "A creature summoned by a foe turns on its master and fights for you for good", "fl": "A creature that was summoned by a foe turns on its master and fights on your side for good.", "bk": "Archive of Charm"}, {"id": "strings_of_the_puppet", "nm": "Strings of the Puppet", "sc": "Enchantment", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Drags the target up to 3 tiles toward you along its own path (it provokes reactions on the way, and its movement is untouched)", "fl": "Walks the target up to three tiles toward you along its own path, springing whatever it passes.", "bk": "Grand Codex of Whispers"}, {"id": "unquenched_brand", "nm": "Unquenched Brand", "sc": "Pyromancy", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "1 fire damage (foes only), Hellfire (4 turns) (foes only)", "fl": "A brand of hell-fire burning 2 fire damage a turn for four turns; neither water nor cold puts it out.", "bk": "Black Grimoire of Cinders"}, {"id": "token_of_plating", "nm": "Token of Plating", "sc": "Abjuration", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Token of Plating (anything entering it: Stoneskin (5 turns) (including you), Shielded (5 turns) (including you), lasts 12 turns)", "fl": "A token of dull metal. Whoever steps on it first, friend or foe, gains stoneskin and a shield for five turns.", "bk": "Lexicon of Sigils"}, {"id": "kinetic_conversion", "nm": "Kinetic Conversion", "sc": "Abjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Kinetic Conversion (5 turns)", "fl": "For five turns, the next three physical blows you take also heal you 1.", "bk": "Compendium of Sanctuary"}, {"id": "featherlight_curse", "nm": "Featherlight Curse", "sc": "Transmutation", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Featherlight (4 turns) (foes only)", "fl": "The target weighs nothing: pushes and pulls move it twice as far for four turns.", "bk": "Manual of Flux"}, {"id": "leaden_body", "nm": "Leaden Body", "sc": "Geomancy", "lvl": 3, "tg": "Ally, range 4", "sh": "", "ef": "Stoneskin (4 turns), Slowed (4 turns), Anchored (4 turns)", "fl": "An ally is made of lead for four turns: stoneskin and unmovable by others, but slowed.", "bk": "Compendium of Mountains"}, {"id": "recall_to_hand", "nm": "Recall to Hand", "sc": "Conjuration", "lvl": 2, "tg": "Ally, range 8", "sh": "", "ef": "Calls the ally to a free tile beside you", "fl": "Calls an ally from anywhere in range to a free tile beside you.", "bk": "Folio of Calling"}, {"id": "borrowed_eyes", "nm": "Borrowed Eyes", "sc": "Divination", "lvl": 3, "tg": "Any creature, range 6", "sh": "", "ef": "For 3 turns your spells are cast from the target's tile (range, shape and line of sight); a foe seen this way is exposed", "fl": "For three turns your spells are cast from the target's place: its range, its sight lines. A foe seen this way is left exposed.", "bk": "Compendium of Hidden Things"}, {"id": "relay_double", "nm": "Relay Double", "sc": "Illusion", "lvl": 4, "tg": "Empty square, range 6", "sh": "", "ef": "Places a stationary double beside the target tile; for 5 turns your spells are cast from its tile. If it falls, the effect ends", "fl": "A still, faintly breathing double of you. For five turns you cast as though standing where it stands; foes find it a tempting target.", "bk": "Grand Codex of Glamours"}, {"id": "disarming_gust", "nm": "Disarming Gust", "sc": "Storm", "lvl": 1, "tg": "Enemy, range 5", "sh": "", "ef": "The target drops its weapon on a nearby tile and fights barehanded (1 damage) until it steps onto it, or 4 turns pass, Pushes 1 (foes only)", "fl": "A snap of wind that rips the weapon out of a hand. It lands nearby; until the owner walks onto it, its blows do 1 damage.", "bk": "Scrap of Thunder"}, {"id": "wrest_weapon", "nm": "Wrest Weapon", "sc": "Spatial", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "The target drops its weapon on a nearby tile and fights barehanded (1 damage) until it steps onto it, or 4 turns pass, You gain Wrested Weapon (8 turns)", "fl": "Their weapon is in your hand now. The target is disarmed, and for eight turns your own attacks do 2 more damage.", "bk": "Codex of Distance"}, {"id": "duelling_ring", "nm": "Duelling Ring", "sc": "Abjuration", "lvl": 4, "tg": "Enemy, range 4", "sh": "Ring at distance 2 (clear in the middle)", "ef": "You blink to a free tile beside the target, Creates Duelling Barrier (blocks movement, HP 3, can be attacked, lasts 4 turns)", "fl": "You step beside the target and a ring of force rises two tiles out, blocking movement and fire for four turns. Just the two of you.", "bk": "Opus of Barriers"}, {"id": "landslip", "nm": "Landslip", "sc": "Spatial", "lvl": 5, "tg": "Any square, range 8", "sh": "", "ef": "The 3x3 ground at the target swaps places with the 3x3 four tiles toward you, turning everyone on it around (bosses and anchored creatures stay put)", "fl": "The 3x3 ground at the target swaps with the 3x3 four tiles toward you, terrain and everyone on it, turned about. Bosses stay put.", "bk": "Apocrypha of Thresholds"}, {"id": "hanging_stone", "nm": "Hanging Stone", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 6", "sh": "", "ef": "Creates Hanging Stone", "fl": "A stone is lifted and held above the tile. Three rounds later it drops: 6 damage and a fall to foes beside it, and it stays as a boulder.", "bk": "Compendium of Mountains"}, {"id": "contrary_charm", "nm": "Contrary Charm", "sc": "Abjuration", "lvl": 2, "tg": "Ally, range 5", "sh": "", "ef": "Contrary Charm (8 turns)", "fl": "The first hostile spell to strike teaches the charm its school. For eight turns every spell of that school fizzles against this ally and leaves its caster hesitant.", "bk": "Manual of Shields"}, {"id": "hallowed_ground", "nm": "Hallowed Ground", "sc": "Divine", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Creates Hallowed Ground (every round, within 0 tiles: Blessed (2 turns) (allies only), Warded (2 turns) (allies only), lasts 6 turns)", "fl": "Consecrated ground for six rounds. Allies standing on it are blessed and warded; step off and it lets go.", "bk": "Treatise of Blessings"}, {"id": "benediction", "nm": "Benediction", "sc": "Divine", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Blessed (8 turns), Warded (8 turns), Heals 3", "fl": "A blessing for one ally: immune to mind-affecting magic, warded against the elements for eight turns, and healed 3.", "bk": "Compendium of Saints"}, {"id": "prayer_banner", "nm": "Prayer Banner", "sc": "Divine", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Prayer Banner (HP 3, can be attacked, every round, within 3 tiles: Empowered (2 turns) (allies only), Weakened (2 turns) (foes only), lasts 6 turns)", "fl": "A planted banner. Each round, allies within three tiles are empowered and foes weakened, for six rounds or until it is cut down.", "bk": "Folio of Judgement"}, {"id": "steadfast_oath", "nm": "Steadfast Oath", "sc": "Divine", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Status Ward x2 (10 turns), Anchored (4 turns), Heals 2", "fl": "One ally swears to hold its ground: the next two harmful effects are shrugged off, it cannot be moved by others for four turns, and it is healed 2.", "bk": "Lexicon of Psalms"}, {"id": "shroud_bank", "nm": "Shroud Bank", "sc": "Illusion", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Creates Shroud Bank (every round, within 0 tiles: Invisible (2 turns) (including you), lasts 5 turns)", "fl": "A bank of dark fog. Whoever stands in it, friend or foe, cannot be seen. Lasts five rounds.", "bk": "Codex of Smoke"}, {"id": "scarecrow_of_dread", "nm": "Scarecrow of Dread", "sc": "Enchantment", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Scarecrow of Dread (blocks movement, HP 3, can be attacked, every round, within 3 tiles: Terrified (1 turn) (foes only), lasts 8 turns)", "fl": "A grinning scarecrow. Foes within three tiles are terrified every round for eight rounds, or until it is destroyed.", "bk": "Opus of Wills"}, {"id": "imperial_edict", "nm": "Imperial Edict", "sc": "Divine", "lvl": 4, "tg": "Any square, range 5", "sh": "Line, length 5", "ef": "1 force damage (foes only), Stunned (1 turn) (foes only)", "fl": "A proclamation along a line: everything it names stops where it stands. Foes in a straight line take 1 damage and are stunned for a turn.", "bk": "Tome of Saints"}, {"id": "null_stone", "nm": "Null Stone", "sc": "Abjuration", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Null Stone (blocks movement, HP 4, can be attacked, every round, within 2 tiles: Silenced (1 turn) (including you), lasts 6 turns)", "fl": "A dull grey stone that swallows magic. Everyone within two tiles, friend or foe, is silenced each round for six rounds.", "bk": "Grand Codex of Warding"}, {"id": "siphon_chain", "nm": "Siphon Chain", "sc": "Necromancy", "lvl": 4, "tg": "Enemy, range 5", "sh": "Chains 3 times", "ef": "Drains 2 (heals you) (foes only)", "fl": "A thread of life that jumps from foe to foe, drawing 2 HP from each, up to three jumps.", "bk": "Great Grimoire of Last Breaths"}, {"id": "rebuke_the_risen", "nm": "Rebuke the Risen", "sc": "Divine", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "5 holy damage (foes only), Terrified (3 turns) (undead only)", "fl": "A single, ringing rebuke. Undead and fiends take 5 holy damage; the undead also flee.", "bk": "Folio of Judgement"}, {"id": "layered_ward", "nm": "Layered Ward", "sc": "Abjuration", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Layered Ward x3 (10 turns)", "fl": "Three layers of force. Each hit tears off one layer and absorbs up to 2 of its damage, then the rest gets through.", "bk": "Lexicon of Barriers"}, {"id": "gathering_fury", "nm": "Gathering Fury", "sc": "Necromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Gathering Fury (8 turns)", "fl": "For eight turns every creature you kill makes your attacks hit 1 harder, up to +4.", "bk": "Tome of Graves"}, {"id": "last_toll", "nm": "Last Toll", "sc": "Necromancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Executes a target at or below 3 HP (you are healed 3 and empowered); anything healthier takes 2 necrotic damage", "fl": "A bell for the nearly dead. A target at 3 HP or less dies and you are healed 3 and empowered; a healthier one only takes 2.", "bk": "Folio of the Ossuary"}, {"id": "hunger_of_ashes", "nm": "Hunger of Ashes", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Starving (4 turns) (foes only)", "fl": "The target starves, worse each turn: 1 HP lost at its next turn, then 2, then 3, then 4.", "bk": "Treatise of Rot"}, {"id": "curse_of_the_kindling_sleeper", "nm": "Curse of the Kindling Sleeper", "sc": "Pyromancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Kindling Sleeper (8 turns) (foes only)", "fl": "Stillness will burn it. The next time the target is stunned, put to sleep, frozen, petrified, feared or otherwise locked down, it takes 4 fire damage and catches fire.", "bk": "Notebook of Smoke"}, {"id": "jolting_omen", "nm": "Jolting Omen", "sc": "Storm", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Jolting Omen x2 (6 turns) (foes only)", "fl": "Acting hurts. The next two times the target attacks or casts it takes 2 electricity damage first.", "bk": "Grimoire of Static"}, {"id": "storm_vessel", "nm": "Storm Vessel", "sc": "Storm", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Storm Vessel (6 turns)", "fl": "Electricity cannot hurt the ally; it is stored, up to 8, and added to its next attack.", "bk": "Grimoire of Stormfronts"}, {"id": "prism_lure", "nm": "Prism Lure", "sc": "Illusion", "lvl": 4, "tg": "Any square, range 6", "sh": "Radius 3", "ef": "Applies Pacified (3 turns) to creatures in the area, weakest first, until their combined HP would exceed 12", "fl": "Slow colours that draw the eye. Foes in the area are pacified, weakest first, until their combined HP passes 12.", "bk": "Grand Codex of Glamours"}, {"id": "reaping_fog", "nm": "Reaping Fog", "sc": "Alchemy", "lvl": 5, "tg": "Any square, range 6", "sh": "Radius 2", "ef": "Instantly kills creatures with 4 HP or less (not bosses, undead or constructs); the rest take 2 poison damage", "fl": "A greenish fog. Creatures with 4 HP or less simply die in it (bosses, undead and constructs are spared); the rest take 2 poison damage.", "bk": "Magnum Opus of Retorts"}, {"id": "pass_the_affliction", "nm": "Pass the Affliction", "sc": "Necromancy", "lvl": 3, "tg": "Any square, range 4", "sh": "Radius 3", "ef": "Lifts poison, disease, bleeding, burning, weakness, slowness, blindness and curses off allies; each passes to the nearest foe (up to 6 tiles, 3 turns at most)", "fl": "Allies in the area are freed of poison, disease, bleeding, burning, weakness, slowness, blindness and curses. Each affliction goes to the nearest foe.", "bk": "Compendium of Graves"}, {"id": "thief_of_mending", "nm": "Thief of Mending", "sc": "Necromancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "For 4 turns half of any healing the target receives comes to you instead", "fl": "For four turns, half of any healing the target receives comes to you instead.", "bk": "Manual of the Cold Dead"}, {"id": "surge_of_blood", "nm": "Surge of Blood", "sc": "Transmutation", "lvl": 2, "tg": "Self", "sh": "", "ef": "You gain Surge of Blood (2 turns)", "fl": "For two turns you hit 3 harder and move 2 further. Then the crash: slowed and weakened for two turns.", "bk": "Handbook of Becoming"}, {"id": "vow_of_peace", "nm": "Vow of Peace", "sc": "Abjuration", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Vow of Peace (3 turns), Stoneskin (3 turns), Warded (3 turns), Heals 3", "fl": "An ally swears off violence for three turns: it cannot attack or cast, but it is healed 3, warded and stoneskinned.", "bk": "Lexicon of Sigils"}, {"id": "wound_plating", "nm": "Wound Plating", "sc": "Transmutation", "lvl": 2, "tg": "Self", "sh": "", "ef": "You gain Wound Plating (6 turns)", "fl": "The more hurt you are, the harder you are to hurt: every hit is reduced by 1 for each 3 HP you are missing, up to 3.", "bk": "Folio of Alteration"}, {"id": "baleful_glance", "nm": "Baleful Glance", "sc": "Necromancy", "lvl": 5, "tg": "Enemy, range 5", "sh": "", "ef": "Baleful Glance (4 turns) (foes only)", "fl": "At the start of each of its turns for four turns the target is struck by a random affliction: terror, confusion, blindness or slowness.", "bk": "Black Grimoire of the Ossuary"}, {"id": "gluey_blood", "nm": "Gluey Blood", "sc": "Transmutation", "lvl": 2, "tg": "Self", "sh": "", "ef": "You gain Gluey Blood (6 turns)", "fl": "For six turns, any melee attacker who wounds you has its weapon stick in the wound: it is disarmed for two turns.", "bk": "Manual of Flux"}, {"id": "bore_tunnel", "nm": "Bore Tunnel", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 6", "sh": "Line, length 6, passing through walls", "ef": "Opens solid rock and wall on the affected tiles into open floor (the edge of the battlefield stays)", "fl": "A boring line through solid rock: walls and stone along it become open floor. The edge of the field holds.", "bk": "Treatise of Faults"}, {"id": "blinkbolt", "nm": "Blinkbolt", "sc": "Storm", "lvl": 4, "tg": "Enemy, range 6", "sh": "", "ef": "3 elec damage (foes only), You blink to a free tile beside the target", "fl": "A bolt that drags you after it: 3 electricity damage, and you arrive beside the target.", "bk": "Archive of Gales"}, {"id": "momentum_strike", "nm": "Momentum Strike", "sc": "Spatial", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "You blink to a free tile beside the target, 1 physical damage plus 1 for every 2 tiles you just travelled (max 5)", "fl": "You cross the gap and hit: the farther you travelled, the harder the blow, up to 5.", "bk": "Notebook of Gravity"}, {"id": "orbiting_sphere", "nm": "Orbiting Sphere", "sc": "Conjuration", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Orbiting Sphere (6 turns)", "fl": "A sphere circles you for six turns. After each damaging spell you cast, it strikes the foe nearest the target for 2 force damage.", "bk": "Archive of Summoning"}, {"id": "starburst", "nm": "Starburst", "sc": "Evocation", "lvl": 5, "tg": "Any square, range 5", "sh": "Eight-armed star, arms 4", "ef": "2 force damage (foes only)", "fl": "Eight beams from a point: straight and diagonal arms, four tiles each.", "bk": "Magnum Opus of Raw Power"}, {"id": "swelling_prism", "nm": "Swelling Prism", "sc": "Evocation", "lvl": 4, "tg": "Any square, range 6", "sh": "", "ef": "Creates Swelling Prism", "fl": "A prism that swells with light each round: 2 damage around it, then 3 over a wider ring, then 5 over a wider one, then it bursts.", "bk": "Opus of Force"}, {"id": "ignition", "nm": "Ignition", "sc": "Pyromancy", "lvl": 4, "tg": "Self", "sh": "Everything in sight", "ef": "Every burning creature in sight explodes: 4 fire damage to it and 2 to everything beside it, and the flames go out", "fl": "Everything already burning in sight goes up: 4 fire damage to it, 2 to those beside it, and the flames are spent.", "bk": "Opus of Embers"}, {"id": "haunt", "nm": "Haunt", "sc": "Necromancy", "lvl": 4, "tg": "Enemy, range 6", "sh": "", "ef": "3 shades of the target rise beside it and fight on your side, goaded onto it", "fl": "Three shades of the target's own kind rise around it and fight on your side, goaded onto it.", "bk": "Opus of Dread"}, {"id": "languid_power", "nm": "Languid Power", "sc": "Abjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Slowed (3 turns), You gain Stoneskin (3 turns), You gain Warded (3 turns), You gain Empowered (3 turns)", "fl": "You slow time around yourself for three turns: slowed, but warded, stoneskinned and empowered.", "bk": "Lexicon of Barriers"}, {"id": "slip_behind", "nm": "Slip Behind", "sc": "Spatial", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "You step to the tile directly behind the target, if it is free, 2 necro damage (foes only)", "fl": "You slip to the tile directly behind the target, if it is free, and cut: 2 necrotic damage.", "bk": "Manual of Time"}, {"id": "weapon_to_serpent", "nm": "Weapon to Serpent", "sc": "Transmutation", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Disarmed (6 turns) (foes only), Summons Viper (HP 1, Move 2, Attack 1 phys + Poisoned). UNCONTROLLED: attacks whatever is nearest, friend or foe", "fl": "The target's weapon writhes into a snake. The target fights barehanded for six turns, and the snake bites whatever is nearest.", "bk": "Folio of Alteration"}, {"id": "coil_of_rebirth", "nm": "Coil of Rebirth", "sc": "Necromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "You pay 4 HP, You gain Coil of Rebirth (12 turns)", "fl": "Pay 4 HP for a patron's gift. For twelve turns, if you would die you rise at once with full HP, but with 2 less maximum HP each time. Twice at most.", "bk": "Treatise of Whispers"}, {"id": "sand_vortex_form", "nm": "Sand Vortex Form", "sc": "Storm", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Sand Vortex (4 turns), You gain Hasted (4 turns), You gain Stoneskin (4 turns)", "fl": "You become a roaring vortex for four turns: hasted and hard to hurt, blinding and scouring foes within two tiles every round.", "bk": "Tome of Cloudbreak"}, {"id": "relentless_hunter", "nm": "Relentless Hunter", "sc": "Conjuration", "lvl": 4, "tg": "Enemy, range 8", "sh": "", "ef": "A relentless hunter appears beside you and goes after the target for 6 turns, seeing through invisibility and illusion, and its touch stuns", "fl": "A hunter forms beside you and goes after the target for six turns, seeing through invisibility and illusion. Its touch stuns.", "bk": "Grand Codex of Calling"}, {"id": "chain_resonance", "nm": "Chain Resonance", "sc": "Evocation", "lvl": 3, "tg": "Self", "sh": "", "ef": "You gain Chain Resonance (8 turns)", "fl": "For eight turns, each damaging spell of the same school as your last does 1 more damage than the one before (up to +3). A different school resets it.", "bk": "Grimoire of Radiance"}, {"id": "mercurial_bolt", "nm": "Mercurial Bolt", "sc": "Chaos", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "3 force damage (foes only), Each creature hit gets one at random: Pushes 2 (foes only) / Burning (3 turns) (foes only) / Frozen (1 turn) (foes only) / Blind (2 turns) (foes only) / You gain Hasted (2 turns) / You gain Regenerating (3 turns) / Slowed (2 turns) (foes only) / Asleep (1 turn) (foes only)", "fl": "3 force damage, plus one random quirk: knocked back, set alight, frozen, blinded, slowed or put to sleep, or a boon for you.", "bk": "Notebook of Coincidence"}, {"id": "mercurial_ward", "nm": "Mercurial Ward", "sc": "Chaos", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Each creature hit gets one at random: Warded (6 turns) / Shielded (6 turns) / Stoneskin (6 turns) / Hasted (3 turns) / Spell Turning (6 turns) / Regenerating (4 turns)", "fl": "A protection whose nature is not yours to choose: wards, a shield, stoneskin, haste, a spell-turning reflection, or regeneration.", "bk": "Lexicon of Madness"}, {"id": "unhallowed_ground", "nm": "Unhallowed Ground", "sc": "Necromancy", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Creates Unhallowed Ground (every round, within 0 tiles: Heals 2 (including you), Weakened (1 turn) (foes only) (living only), lasts 6 turns)", "fl": "Ground given over to the dead for six rounds. Undead standing on it are healed 2 each round; living creatures on it are weakened.", "bk": "Codex of Whispers"}, {"id": "sealed_circle", "nm": "Sealed Circle", "sc": "Abjuration", "lvl": 4, "tg": "Self", "sh": "Ring at distance 2 (clear in the middle)", "ef": "Creates Warded Threshold (lasts 8 turns)", "fl": "A ring of threshold two tiles out that foes cannot cross for eight rounds. You and your allies pass freely; missiles and spells pass too.", "bk": "Great Grimoire of Banishment"}, {"id": "call_rain", "nm": "Call Rain", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "Calls rain for 6 rounds (then it clears)", "fl": "Rain for six rounds: fire spells do 1 less damage, lightning does 1 more, and burning creatures are doused each round.", "bk": "Grimoire of Moss"}, {"id": "summon_fog", "nm": "Summon Fog", "sc": "Illusion", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Calls fog for 5 rounds (then it clears), Overlooked (2 turns) (allies only)", "fl": "A thick fog for five rounds: nobody can see more than four tiles. Allies near you slip from notice for two turns.", "bk": "Treatise of Phantasms"}, {"id": "raise_gale", "nm": "Raise Gale", "sc": "Storm", "lvl": 4, "tg": "Self", "sh": "Radius 4", "ef": "Calls gale for 5 rounds (then it clears), Pushes 1 (foes only)", "fl": "A gale for five rounds: missiles lose 2 range and every push and pull goes one tile farther. Foes near you are blown back.", "bk": "Great Grimoire of Static"}, {"id": "clear_skies", "nm": "Clear Skies", "sc": "Divine", "lvl": 2, "tg": "Self", "sh": "", "ef": "The sky clears, Heals 2 (allies only)", "fl": "The weather ends at once, whatever it was, and you are healed 2.", "bk": "Manual of Litany"}, {"id": "thunderhead", "nm": "Thunderhead", "sc": "Storm", "lvl": 5, "tg": "Any square, range 7", "sh": "Radius 2", "ef": "Depends on the weather: rain, fog, gale or clear sky", "fl": "A storm cloud answers the weather: in rain, 6 damage and a stun; in a gale, 4 and a hard shove; in fog, 3; under a clear sky it calls rain for four rounds and strikes for 3 (plus the rain).", "bk": "Magnum Opus of Tempests"}, {"id": "phantom_flesh", "nm": "Phantom Flesh", "sc": "Necromancy", "lvl": 2, "tg": "Ally, range 5", "sh": "", "ef": "A pool of 6 borrowed HP (max 10) soaks damage before the target's own HP, for up to 10 turns", "fl": "Six points of borrowed flesh around an ally. They soak damage before its own HP, and then they are gone.", "bk": "Folio of the Ossuary"}, {"id": "compelled_quarrel", "nm": "Compelled Quarrel", "sc": "Enchantment", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Compelled (5 turns) (foes only)", "fl": "A compulsion to fight: for five turns the target loses 2 HP at the end of any phase in which it did not attack.", "bk": "Lexicon of Wills"}, {"id": "searing_metal", "nm": "Searing Metal", "sc": "Pyromancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "2 fire damage (foes only), 3 fire damage (foes only) (construct only)", "fl": "Metal glowing white-hot. 2 fire damage; constructs, which are all metal and stone, take 3 more.", "bk": "Folio of Ash"}, {"id": "word_of_halting", "nm": "Word of Halting", "sc": "Enchantment", "lvl": 4, "tg": "Any square, range 6", "sh": "Radius 3", "ef": "Stunned (2 turns) on targets with 10 HP or less", "fl": "A single word of power. Foes in the area with 10 HP or less are stunned for two turns; the stronger are untouched.", "bk": "Grand Codex of Puppets"}, {"id": "gestalt", "nm": "Gestalt", "sc": "Conjuration", "lvl": 4, "tg": "Self", "sh": "Radius 3", "ef": "Your summoned creatures in the area merge into one: HP pooled, abilities combined, +1 damage for each other creature merged (up to +3)", "fl": "Your summoned creatures within three tiles merge into a single, larger being: their HP pooled, their abilities combined, and +1 damage for each other creature absorbed (up to +3). It can only be done to what you have called yourself.", "bk": "Tome of Visitors"}, {"id": "threefold_aspect", "nm": "Threefold Aspect", "sc": "Nature", "lvl": 4, "tg": "Self", "sh": "", "ef": "Threefold Aspect (6 turns), Heals 2 (allies only)", "fl": "For six turns you wear a different aspect each turn, in rotation. Maiden: +2 movement. Mother: you heal 2 and allies beside you 1. Crone: you are empowered and foes beside you weakened. You also heal 2 now.", "bk": "Opus of Roots"}, {"id": "ghostbane_dirge", "nm": "Ghostbane Dirge", "sc": "Divine", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "2 holy damage (foes only), Removes Phased, Gaseous, Invisible, Made Solid (3 turns) (foes only)", "fl": "A mournful song that hauls a ghost into the world of bone and mortar. For three turns the target cannot phase, hide, fly or shrug off ordinary weapons (and 2 holy damage if it is undead).", "bk": "Pocket Guide of Dawn"}, {"id": "expend", "nm": "Expend", "sc": "Abjuration", "lvl": 4, "tg": "Any square, range 6", "sh": "Radius 2", "ef": "Foes in the area lose their casts now and next turn, and up to 2 prepared spells", "fl": "Every spellcaster in the area spends its magic to no effect: it loses its casts this turn and next, and up to two of its prepared spells are gone for good.", "bk": "Opus of Barriers"}, {"id": "shrieking_provocation", "nm": "Shrieking Provocation", "sc": "Enchantment", "lvl": 3, "tg": "Self", "sh": "Radius 2", "ef": "Each foe in the area is struck by every one of your side adjacent to it", "fl": "A piercing shriek. Every foe within two tiles drops its guard: each of your side next to it (you included) strikes it at once.", "bk": "Compendium of Moods"}, {"id": "feed_on_fear", "nm": "Feed on Fear", "sc": "Necromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Feeding on Fear (5 turns)", "fl": "For five turns, at the start of your turn you heal 2 for each foe within five tiles that is frightened, stunned, asleep, charmed or otherwise held (up to 6).", "bk": "Codex of the Ossuary"}, {"id": "bark_orders",
