moning", "sc": "Conjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "Intensified Summoning x2 (8 turns)", "fl": "Your next two summoning spells call tougher creatures (+2 HP, +1 damage each).", "bk": "Compendium of Contracts"}, {"id": "mass_invisibility", "nm": "Mass Invisibility", "sc": "Illusion", "lvl": 4, "tg": "Any square, range 6", "sh": "Radius 2", "ef": "Invisible (3 turns) (allies only)", "fl": "Your allies in the area vanish from ranged attack.", "bk": "Opus of Deceit"}, {"id": "eagle_form", "nm": "Eagle Form", "sc": "Nature", "lvl": 2, "tg": "Self", "sh": "", "ef": "Become a Giant Eagle for 5 turns: 2 HP (+ your bonus HP), 6 move, 2 damage, fly. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Take wing: fast, flying, fragile.", "bk": "Notebook of Greenwood"}, {"id": "jaguar_form", "nm": "Jaguar Form", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "Become a Dire Tiger for 5 turns: 3 HP (+ your bonus HP), 5 move, 2 damage, stealth. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "A stalking great cat: quick, deadly, and hard to target from range.", "bk": "Compendium of Thorns"}, {"id": "crocodile_form", "nm": "Crocodile Form", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "Become a Crocodile for 5 turns: 5 HP (+ your bonus HP), 2 move, 2 damage, swim. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Thick scales and a swimmer's tail: at home in deep water.", "bk": "Grimoire of Moss"}, {"id": "mantle_of_air", "nm": "Mantle of Air", "sc": "Storm", "lvl": 4, "tg": "Self", "sh": "", "ef": "Become a Air Elemental for 5 turns: 3 HP (+ your bonus HP), 5 move, 1 damage, fly. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Become a whirling gale: swift, flying, and nearly untouched by blows.", "bk": "Great Grimoire of Static"}, {"id": "mantle_of_earth", "nm": "Mantle of Earth", "sc": "Geomancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Become a Earth Elemental for 5 turns: 5 HP (+ your bonus HP), 1 move, 2 damage, heavy. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Become living rock: slow, tough, and hard to hurt with weapons.", "bk": "Tome of Mountains"}, {"id": "mantle_of_fire", "nm": "Mantle of Fire", "sc": "Pyromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Become a Fire Elemental for 5 turns: 4 HP (+ your bonus HP), 3 move, 1 damage. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Become a pillar of flame: your blows burn and the air around you scorches.", "bk": "Grand Codex of Smoke"}, {"id": "mantle_of_water", "nm": "Mantle of Water", "sc": "Nature", "lvl": 4, "tg": "Self", "sh": "", "ef": "Become a Water Elemental for 5 turns: 4 HP (+ your bonus HP), 3 move, 1 damage, swim. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Become a living wave: a swimmer, resistant to fire.", "bk": "Tome of Thorns"}, {"id": "phoenix_form", "nm": "Phoenix Form", "sc": "Pyromancy", "lvl": 6, "tg": "Self", "sh": "", "ef": "Become a Phoenix for 5 turns: 8 HP (+ your bonus HP), 4 move, 2 damage, fly, regen. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Fire wings: flight, immunity to flame, and the phoenix's slow regeneration.", "bk": "Forbidden Tome of Brimstone"}, {"id": "heart_of_stone", "nm": "Heart of Stone", "sc": "Geomancy", "lvl": 6, "tg": "Self", "sh": "", "ef": "Become a Stone Golem for 6 turns: 8 HP (+ your bonus HP), 1 move, 2 damage, heavy. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Trade your heart for stone: weapons barely scratch you, but you crawl.", "bk": "Apocrypha of Iron"}, {"id": "giant_size", "nm": "Giant Size", "sc": "Transmutation", "lvl": 7, "tg": "Self", "sh": "", "ef": "Become a Hill Giant for 5 turns: 9 HP (+ your bonus HP), 2 move, 2 da ": "Your living allies in the area die and rise as skeletons with the same HP", "fl": "Your living allies in the area die and rise as skeletons with the same strength of body.", "bk": "Archive of the Ossuary"}, {"id": "tithe_of_souls", "nm": "Tithe of Souls", "sc": "Divine", "lvl": 5, "tg": "Enemy, range 4", "sh": "", "ef": "Deals a third of its current HP as holy damage, then a third of what is left as necrotic damage; you heal the total", "fl": "Take a third of what a creature has left, twice. You are healed by the sum.", "bk": "Apocrypha of Dawn"}, {"id": "devour_ally", "nm": "Devour Ally", "sc": "Blood", "lvl": 3, "tg": "Ally, range 1", "sh": "", "ef": "Eats an adjacent living ally, healing you for its HP", "fl": "Eat an adjacent living ally. The cost is theirs; the life is yours.", "bk": "Lexicon of Vows"}, {"id": "arc_curse", "nm": "Arc Curse", "sc": "Storm", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Arc-cursed (6 turns)", "fl": "Fire that harms the cursed creature leaps onward as lightning to two of its friends.", "bk": "Lexicon of Whirlwinds"}, {"id": "holy_scourge", "nm": "Holy Scourge", "sc": "Divine", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "1 force damage, Stunned (2 turns), Scourged (3 turns)", "fl": "A blinding lash stuns the target, and it burns everything beside it each turn.", "bk": "Handbook of Psalms"}, {"id": "death_chill", "nm": "Death Chill", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Death Chill (4 turns)", "fl": "A creeping cold: if it kills, the corpse bursts in a frost that freezes its friends.", "bk": "Compendium of Last Breaths"}, {"id": "scatter_field", "nm": "Scatter Field", "sc": "Abjuration", "lvl": 4, "tg": "Self", "sh": "", "ef": "Scatter Field (6 turns)", "fl": "Each turn two foes near you are flung to random places on the board.", "bk": "Grand Codex of Warding"}, {"id": "shrapnel_blast", "nm": "Shrapnel Blast", "sc": "Geomancy", "lvl": 3, "tg": "Any square, range 7", "sh": "", "ef": "Detonates a wall: fire for neighbours, then 4 shards of 1 damage at foes nearby", "fl": "Detonate a wall: neighbours burn and four shards fly at foes nearby.", "bk": "Codex of Crystal"}, {"id": "dream_walk", "nm": "Dream Walk", "sc": "Illusion", "lvl": 3, "tg": "Self", "sh": "", "ef": "Dream-walking (4 turns)", "fl": "Wander for four turns; then wake where you began, with the health you began with.", "bk": "Grimoire of Mirage"}, {"id": "call_of_the_wild", "nm": "Call of the Wild", "sc": "Nature", "lvl": 2, "tg": "Self", "sh": "Entire battlefield", "ef": "Each of your allies strikes a random foe in melee for its damage +1, stunning it for 1", "fl": "Every allied creature lunges at a random adjacent foe for its damage +1, stunning it.", "bk": "Handbook of the Wild"}, {"id": "hungering_eyes", "nm": "Hungering Eyes", "sc": "Blood", "lvl": 4, "tg": "Self", "sh": "Entire battlefield", "ef": "Each of your allies strikes a random foe within 5 squares for 2 necro damage, healing by the damage dealt", "fl": "Every allied creature fires a dark bolt at a random foe in sight, and heals by what it deals.", "bk": "Tome of Crimson"}, {"id": "corruption_of_unlife", "nm": "Corruption of Unlife", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Living creatures count as undead (holy hurts them), lose a quarter of their max HP and cannot heal", "fl": "A living creature is cursed to count as undead: holy hurts it, it is smaller and cannot heal.", "bk": "Grimoire of Shades"}, {"id": "gorgon_mantle", "nm": "Gorgon Mantle", "sc": "Nature", "lvl": 4, "tg": "Self", "sh": "", "ef": "Gorgon Mantle (6 turns)", "fl": "Whoever hurts you turns to stone for two turns.", "bk": "Great Grimoire of Moss"}, {"id": "gorgon_gaze", "nm": "Gorgon Gaze", "sc": "Abjuration", "lvl": 6, "tg": "Self", "sh": "", "ef": "Gorgon Gaze (4 turns)", "fl": "Each turn two foes near you are petrified for two turns.", "bk": "Arcanum of Sanctuary"}, {"id": "searing_sweep", "nm": "Searing Sweep", "sc": "Pyromancy", "lvl": 4, "tg": "Any square, range 4", "sh": "Row of 3", "ef": "2 fire damage, Destroys walls and solid objects in the area", "fl": "A wide sheet of flame that also melts down any wall in its way.", "bk": "Tome of the Pyre"}, {"id": "breach_ray", "nm": "Breach Ray", "sc": "Evocation", "lvl": 4, "tg": "Any square, range 6", "sh": "Line, length 6", "ef": "3 force damage, Destroys walls and solid objects in the area", "fl": "A beam of unmaking: it hurts what it hits and demolishes walls.", "bk": "Opus of Havoc"}, {"id": "blood_pact", "nm": "Blood Pact", "sc": "Blood", "lvl": 3, "tg": "Ally, range 3", "sh": "", "ef": "Vampiric (4 turns)", "fl": "An ally heals by every point of damage it deals.", "bk": "Compendium of Sanguinity"}, {"id": "stormstep", "nm": "Stormstep", "sc": "Storm", "lvl": 4, "tg": "Self", "sh": "", "ef": "Stormstep (5 turns)", "fl": "Each lightning spell you cast carries you to its target.", "bk": "Opus of Thunder"}, {"id": "ember_seal", "nm": "Ember Seal", "sc": "Pyromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Ember Seal (6 turns)", "fl": "Stores every point of fire damage dealt, then releases half of it on all foes in sight.", "bk": "Tome of Kindling"}, {"id": "tempest_burst", "nm": "Tempest Burst", "sc": "Storm", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Each creature hit gets one at random: 2 cold damage, Frozen (2 turns) / 2 elec damage, Stunned (2 turns)", "fl": "Each creature in the area is struck by either frost or lightning, at random.", "bk": "Opus of Thunder"}, {"id": "sentinel_stance", "nm": "Sentinel Stance", "sc": "Storm", "lvl": 4, "tg": "Self", "sh": "", "ef": "Sentinel (5 turns), You gain Rooted (5 turns), Stoneskin (5 turns)", "fl": "Root yourself as a living turret: a lightning bolt strikes a foe each turn.", "bk": "Tome of Cloudbreak"}, {"id": "wheel_of_fate", "nm": "Wheel of Fate", "sc": "Necromancy", "lvl": 6, "tg": "Self", "sh": "Everything in sight", "ef": "Instant death (bosses resist) (1 random target)", "fl": "Fate chooses one foe in sight, at random, and it dies.", "bk": "Magnum Opus of Shades"}, {"id": "nightmare_aura", "nm": "Nightmare Aura", "sc": "Enchantment", "lvl": 5, "tg": "Self", "sh": "", "ef": "Nightmares (5 turns)", "fl": "Each turn every foe near you suffers 1 psychic damage that nothing resists.", "bk": "Arcanum of Silver Tongues"}, {"id": "word_of_bones", "nm": "Word of Bones", "sc": "Necromancy", "lvl": 7, "tg": "Self", "sh": "Entire battlefield", "ef": "Every undead creature doubles its HP; every other creature except you is halved", "fl": "Every undead creature doubles in strength; every other creature but you is halved.", "bk": "Magnum Opus of Shades"}, {"id": "wild_volley", "nm": "Wild Volley", "sc": "Chaos", "lvl": 2, "tg": "Any square, range 4", "sh": "Cone, length 4", "ef": "Each creature hit gets one at random: 1 fire damage / 1 elec damage / 1 phys damage (4 random targets)", "fl": "A volley of random flame, lightning and shrapnel at four creatures in a cone.", "bk": "Pocket Guide of Folly"}, {"id": "frog_form", "nm": "Frog Form", "sc": "Nature", "lvl": 2, "tg": "Self", "sh": "", "ef": "Become a Poison Frog for 5 turns: 2 HP (+ your bonus HP), 3 move, 1 damage, swim. You cannot cast while changed; if the body falls you return to yours unharmed", "fl": "Become a swamp frog: a big leap, a long tongue and a love of the water.", "bk": "Manual of Moss"}, {"id": "rod_to_serpent", "nm": "Rod to Serpent", "sc": "Nature", "lvl": 2, "tg": "Any square, range 4", "sh": "Radius 2", "ef": "Barrels, Wall of Thornss, Magic Trees, Giant Mushrooms in the area come to life as Viper on your side", "fl": "Wood and fungus in the area writhe into vipers on your side.", "bk": "Folio of Beasts"}, {"id": "entropic_storm", "nm": "Entropic Storm", "sc": "Chaos", "lvl": 5, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Creates Entropic Storm (anything entering it: Each creature hit gets one at random: 1 fire damage / 1 cold damage / 1 elec damage / 1 acid damage / Confused (1 turn), each turn, to anything in it: Each creature hit gets one at random: 1 fire damage / 1 cold damage / 1 elec damage / 1 acid damage / Confused (1 turn), lasts 4 turns)", "fl": "A knot of unmaking: whoever stands in it is burned, chilled, shocked, corroded or confused at random.", "bk": "Apocrypha of Mayhem"}, {"id": "spore_garden", "nm": "Spore Garden", "sc": "Nature", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Creates Poison Cloud (anything entering it: Poisoned (2 turns), each turn, to anything in it: Poisoned (2 turns), lasts 3 turns), Creates Giant Mushroom (blocks movement, HP 1, can be attacked, lasts 8 turns)", "fl": "A cloud of poison spores, and in its wake a thicket of fat mushrooms that block the way.", "bk": "Grimoire of Claws"}, {"id": "divine_vengeance", "nm": "Divine Vengeance", "sc": "Divine", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "2 force damage, Each creature hit gets one at random: Blind (3 turns) / Silenced (3 turns) / Weakened (3 turns) / Slowed (3 turns) / Terrified (3 turns)", "fl": "A smiting from above, with a random affliction attached.", "bk": "Grand Codex of Judgement"}, {"id": "forest_walk", "nm": "Forest Walk", "sc": "Nature", "lvl": 2, "tg": "Free square beside a tree, range 8", "sh": "", "ef": "You step through to the chosen place", "fl": "Step through the trees to any free square beside another tree.", "bk": "Manual of Moss"}, {"id": "phoenix_pyre", "nm": "Phoenix Pyre", "sc": "Pyromancy", "lvl": 6, "tg": "Self", "sh": "", "ef": "Phoenix Pyre (10 turns)", "fl": "When you would die you burst into flame, scorching everything near, and rise again with half your HP.", "bk": "Forbidden Tome of Brimstone"}, {"id": "second_chance", "nm": "Second Chance", "sc": "Divine", "lvl": 7, "tg": "Self", "sh": "Radius 4", "ef": "Second Chance (10 turns) (allies only)", "fl": "You and your allies nearby each get to rise once more, with half HP, after falling.", "bk": "Apocrypha of Dawn"}, {"id": "wrathful_skies", "nm": "Wrathful Skies", "sc": "Storm", "lvl": 6, "tg": "Self", "sh": "", "ef": "Wrathful Skies (5 turns)", "fl": "Each turn a bolt of lightning strikes a random foe anywhere on the board.", "bk": "Forbidden Tome of the Squall"}, {"id": "arcane_bolt", "nm": "Arcane Bolt", "sc": "Evocation", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "3 force damage (magical only)", "fl": "A bolt that is deadly to undead, constructs, fiends, elementals and summoned things, and harmless to the mundane.", "bk": "Folio of Arcane Might"}, {"id": "cloudburst", "nm": "Cloudburst", "sc": "Storm", "lvl": 4, "tg": "Any square, range 6", "sh": "Radius 4", "ef": "Puts out fires and burning creatures, Conductive (4 turns) (foes only), Grounded (4 turns) (foes only)", "fl": "Rain puts out fires, grounds flyers and soaks foes so lightning hits twice as hard.", "bk": "Grand Codex of Lightning"}, {"id": "blood_price", "nm": "Blood Price", "sc": "Blood", "lvl": 5, "tg": "Enemy, range 5", "sh": "", "ef": "Your nearest allied creature is sacrificed: the target dies", "fl": "Sacrifice your nearest ally; your target dies.", "bk": "Black Grimoire of Marrow"}, {"id": "agonizing_sacrifice", "nm": "Agonizing Sacrifice", "sc": "Blood", "lvl": 4, "tg": "Self", "sh": "Everything in sight", "ef": "Your nearest allied creature is sacrificed: foes in the area take its HP (max 4) as necrotic damage", "fl": "Sacrifice your nearest ally; every foe in sight feels its pain, as much damage as it had HP (max 4).", "bk": "Grand Codex of Pacts"}, {"id": "festering_air", "nm": "Festering Air", "sc": "Necromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Festering Air (6 turns)", "fl": "For six turns any living foe that takes damage is also poisoned.", "bk": "Great Grimoire of the Cold Dead"}, {"id": "call_chaos", "nm": "Call Chaos", "sc": "Chaos", "lvl": 5, "tg": "Self", "sh": "Everything in sight", "ef": "Each creature hit gets one at random: 2 fire damage / 2 elec damage / Confused (2 turns) / Stunned (1 turn) / Heals 2 / Hasted (2 turns) / Frozen (1 turn)", "fl": "Chaos strikes every foe in sight in a different way: some are burned or shocked, and some, unluckily, are healed or quickened.", "bk": "Arcanum of the Unwritten"}, {"id": "black_channels", "nm": "Black Channels", "sc": "Necromancy", "lvl": 4, "tg": "Ally, range 4", "sh": "", "ef": "Remakes an allied creature as undead: +2 damage, +1 HP, cold resistance", "fl": "An allied creature is remade as an undead thing: stronger, tougher, and cold to the touch.", "bk": "Tome of Last Breaths"}, {"id": "chaos_channels", "nm": "Chaos Channels", "sc": "Chaos", "lvl": 3, "tg": "Ally, range 4", "sh": "", "ef": "Mutates the creature for the better (+2 damage, +3 HP, +2 move or wings, at random), permanently", "fl": "An allied creature mutates at random: claws, a thick hide, long legs or wings. Permanent.", "bk": "Codex of Entropy"}, {"id": "warp_creature", "nm": "Warp Creature", "sc": "Chaos", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Warps the creature for the worse (-1 damage, a third of its HP, or -1 move, at random), permanently", "fl": "A foe is warped: weaker, shrunken or lame. Permanent.", "bk": "Treatise of Coincidence"}, {"id": "cloak_of_fear", "nm": "Cloak of Fear", "sc": "Necromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Cloak of Fear (6 turns)", "fl": "Whoever hits you in melee is gripped by fear for two turns.", "bk": "Treatise of Whispers"}, {"id": "spell_immunity", "nm": "Spell Immunity", "sc": "Abjuration", "lvl": 5, "tg": "Ally, range 4", "sh": "", "ef": "Spell Immunity (5 turns)", "fl": "The target cannot be harmed by spells at all, friendly or hostile.", "bk": "Forbidden Tome of Shields"}, {"id": "warp_wood", "nm": "Warp Wood", "sc": "Chaos", "lvl": 3, "tg": "Any square, range 6", "sh": "Radius 2", "ef": "Foes lose their missile attacks", "fl": "Missile weapons in the area twist and split. Foes lose their ranged attacks.", "bk": "Treatise of Coincidence"}, {"id": "sunder_weapons", "nm": "Sunder Weapons", "sc": "Chaos", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Foes' weapons shatter: -1 melee damage (minimum 1)", "fl": "Blades and clubs in the area shatter: foes hit one point softer.", "bk": "Codex of Chance"}, {"id": "reckless_fury", "nm": "Reckless Fury", "sc": "Necromancy", "lvl": 2, "tg": "Ally, range 4", "sh": "", "ef": "Empowered (3 turns), Hasted (3 turns), Marked (3 turns)", "fl": "An ally fights with fury and no care for itself: it hits harder and moves faster, but takes extra damage.", "bk": "Notebook of Rot"}, {"id": "spectral_bow", "nm": "Spectral Bow", "sc": "Conjuration", "lvl": 1, "tg": "Self", "sh": "", "ef": "Conjures a spectral bow. You gain a ranged attack: 2 phys, range 5 until you conjure another ranged weapon", "fl": "A bow of pale light and arrows to match. You can now shoot.", "bk": "Primer of Gates"}, {"id": "spectral_blade", "nm": "Spectral Blade", "sc": "Conjuration", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a spectral blade. Your melee attack becomes 3 phys until you conjure another melee weapon", "fl": "A sword that was never forged. Your strikes hit harder.", "bk": "Folio of Calling"}, {"id": "spectral_spear", "nm": "Spectral Spear", "sc": "Conjuration", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a spectral spear. Your melee attack becomes 2 phys, reach 2 until you conjure another melee weapon", "fl": "A long shaft of light: strike from two tiles away.", "bk": "Notebook of the Menagerie"}, {"id": "venom_dagger", "nm": "Venom Dagger", "sc": "Alchemy", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a venom-dripping dagger. Your melee attack becomes 2 phys + Poisoned until you conjure another melee weapon", "fl": "Every cut leaves poison behind.", "bk": "Compendium of Cauldrons"}, {"id": "flame_blade", "nm": "Flame Blade", "sc": "Pyromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a blade of flame. Your melee attack becomes 3 fire + Burning until you conjure another melee weapon", "fl": "A sword of living fire.", "bk": "Treatise of Smoke"}, {"id": "frost_lance", "nm": "Frost Lance", "sc": "Cryomancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a frost lance. You gain a ranged attack: 2 cold, range 4 + Slowed until you conjure another ranged weapon", "fl": "Hurl shards of ice that slow what they strike.", "bk": "Treatise of Glaciers"}, {"id": "storm_sling", "nm": "Storm Sling", "sc": "Storm", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a sling of lightning. You gain a ranged attack: 2 elec, range 5 until you conjure another ranged weapon", "fl": "Stones wrapped in lightning.", "bk": "Treatise of the Squall"}, {"id": "thunder_hammer", "nm": "Hammer of Thunder", "sc": "Evocation", "lvl": 4, "tg": "Self", "sh": "", "ef": "Conjures a hammer of thunder. Your melee attack becomes 3 force + Stunned until you conjure another melee weapon", "fl": "Each blow rings like a bell and rattles the skull.", "bk": "Great Grimoire of Radiance"}, {"id": "unleash_menagerie", "nm": "Open the Menagerie", "sc": "Chaos", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Summons 2 random tier-2 creatures. UNCONTROLLED: they attack whatever is nearest, friend or foe", "fl": "Two cages burst open. Neither beast is grateful, or choosy.", "bk": "Notebook of Coincidence"}, {"id": "release_the_beast", "nm": "Release the Beast", "sc": "Nature", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Dire Tiger (HP 3, Move 5, Attack 2 phys; Stealthy, Can be ridden (select your wizard and click it)). UNCONTROLLED: attacks whatever is nearest, friend or foe", "fl": "A ravenous tiger, aimed in the general direction of dinner.", "bk": "Codex of Beasts"}, {"id": "chaos_seed", "nm": "Chaos Seed", "sc": "Chaos", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Chaos Spawn (HP 3, Move 3, Attack 1 phys; Splits when hurt). UNCONTROLLED: attacks whatever is nearest, friend or foe", "fl": "A spawn that splits when hurt. Everyone's problem.", "bk": "Treatise of Disorder"}, {"id": "pandemonium_gate", "nm": "Pandemonium Gate", "sc": "Chaos", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Opens a gate for 5 turns; each turn it releases 1 random tier-4 creature. UNCONTROLLED: each strikes your foes first, then whatever is nearest, friend or foe", "fl": "A door to somewhere much worse. For five turns it spits out one hungry, unbound big creature a turn. Each strikes your foes first, then anything nearest.", "bk": "Archive of Entropy"}, {"id": "unbound_fiend", "nm": "Unbind the Fiend", "sc": "Necromancy", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Pit Fiend (HP 8, Move 3, Attack 2 fire; Fiend, Immune fire, Flies). UNCONTROLLED: attacks whatever is nearest, friend or foe", "fl": "A pit fiend with its leash cut. It will burn the nearest thing, whoever that is.", "bk": "Great Grimoire of Last Breaths"}, {"id": "lycanthropy", "nm": "Lycanthropy", "sc": "Nature", "lvl": 3, "tg": "Ally, range 4", "sh": "", "ef": "Target becomes a Werewolf for 8 turns: 9 HP, 4 move, 3 damage. If the body falls, the original returns with the HP it had", "fl": "An ally takes the form of a werewolf for a time.", "bk": "Lexicon of Roots"}, {"id": "draconic_blood", "nm": "Draconic Blood", "sc": "Transmutation", "lvl": 3, "tg": "Ally, range 4", "sh": "", "ef": "Target becomes a Dragon Whelp for 6 turns: 4 HP, 4 move, 1 damage, ranged 3. If the body falls, the original returns with the HP it had", "fl": "Scales, wings and a mouthful of flame, for a little while.", "bk": "Lexicon of Change"}, {"id": "stone_form", "nm": "Stone Form", "sc": "Geomancy", "lvl": 4, "tg": "Ally, range 4", "sh": "", "ef": "Target becomes a Stone Golem for 6 turns: 8 HP, 1 move, 2 damage. If the body falls, the original returns with the HP it had", "fl": "An ally is cast in living stone.", "bk": "Opus of Stone"}, {"id": "chimeric_graft", "nm": "Chimeric Graft", "sc": "Chaos", "lvl": 3, "tg": "Ally, range 4", "sh": "", "ef": "Target becomes a Manticore for 6 turns: 6 HP, 4 move, 2 damage, ranged 4. If the body falls, the original returns with the HP it had", "fl": "Lion, wings and a spiked tail, stitched on by sheer will.", "bk": "Grimoire of the Unwritten"}, {"id": "magic_vortex", "nm": "Magic Vortex", "sc": "Evocation", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Magic Vortex (hunts the nearest foe, 2 tiles a turn, whoever it touches: 3 force damage, lasts 6 turns)", "fl": "A whirling knot of force that hunts the nearest foe, two tiles a round.", "bk": "Tome of Pure Energy"}, {"id": "drifting_miasma", "nm": "Drifting Miasma", "sc": "Alchemy", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Drifting Miasma (drifts 1 tile a turn, whoever it touches: Poisoned (3 turns), each turn, to anything in it: 1 poison damage, lasts 8 turns)", "fl": "A poison cloud that wanders where it likes. Mind the wind.", "bk": "Pocket Guide of Residue"}, {"id": "wandering_flame", "nm": "Wandering Flame", "sc": "Pyromancy", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Wandering Flame (hunts the nearest foe, 1 tile a turn, whoever it touches: 2 fire damage, Burning (2 turns), lasts 6 turns)", "fl": "A flame that follows your enemies about.", "bk": "Codex of Ash"}, {"id": "stalking_darkness", "nm": "Stalking Darkness", "sc": "Illusion", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Stalking Darkness (hunts the nearest foe, 2 tiles a turn, whoever it touches: Blind (2 turns), 1 necro damage, lasts 6 turns)", "fl": "A patch of night that pads after the nearest foe, blinding as it goes.", "bk": "Treatise of Phantasms"}, {"id": "bone_blade", "nm": "Bone Blade", "sc": "Necromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a blade of bone. Your melee attack becomes 3 necro, heals you 1 per hit until you conjure another melee weapon", "fl": "A blade grown from something that used to be a rib. Each cut feeds you.", "bk": "Lexicon of Graves"}, {"id": "force_lash", "nm": "Force Lash", "sc": "Evocation", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a whip of force. Your melee attack becomes 2 force, reach 2, pushes 1 until you conjure another melee weapon", "fl": "A crackling whip with a reach of two tiles that shoves what it strikes.", "bk": "Notebook of Blasting"}, {"id": "whip_of_pain", "nm": "Whip of Pain", "sc": "Necromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a whip of pain. Your melee attack becomes 2 phys + Bleeding, reach 2 until you conjure another melee weapon", "fl": "Reach two, and every lash opens a wound that keeps bleeding.", "bk": "Tome of Last Breaths"}, {"id": "chromatic_blade", "nm": "Chromatic Blade", "sc": "Evocation", "lvl": 4, "tg": "Self", "sh": "", "ef": "Conjures a chromatic blade. Your melee attack becomes 3 fire, a random element each hit until you conjure another melee weapon", "fl": "A shimmering sword whose element shifts with every blow.", "bk": "Opus of Havoc"}, {"id": "flame_arrow", "nm": "Flame Arrow", "sc": "Pyromancy", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a quiver of flame arrows. You gain a ranged attack: 2 fire, range 5 + Burning. 6 uses, then it is gone", "fl": "Six arrows that burn what they hit.", "bk": "Manual of Sparks"}, {"id": "fire_seeds", "nm": "Fire Seeds", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a handful of fire seeds. You gain a ranged attack: 3 fire, range 4, splashes radius 1. 4 uses, then it is gone", "fl": "Acorns that burst into flame when thrown. Four of them, each hurting everything beside the target.", "bk": "Compendium of Thorns"}, {"id": "magic_stones", "nm": "Magic Stones", "sc": "Geomancy", "lvl": 1, "tg": "Self", "sh": "", "ef": "Conjures three stones. You gain a ranged attack: 2 force, range 5. 3 uses, then it is gone", "fl": "Three pebbles that strike far harder than they should.", "bk": "Scrap of Stone"}, {"id": "shooting_stars", "nm": "Shooting Stars", "sc": "Evocation", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjures a pouch of sling stars. You gain a ranged attack: 2 force, range 5, splashes radius 1. 4 uses, then it is gone", "fl": "Four sling stones that burst in a spray of sparks on impact.", "bk": "Treatise of Blasting"}, {"id": "confusing_touch", "nm": "Confusing Touch", "sc": "Enchantment", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a confusing touch. Your melee hits also inflict Confused until you conjure another melee weapon", "fl": "Your hands leave their victims reeling. (Your normal damage; every hit confuses.)", "bk": "Manual of Silver Tongues"}, {"id": "ghoulish_touch", "nm": "Ghoulish Touch", "sc": "Necromancy", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a ghoulish touch. Your melee hits also inflict Stunned until you conjure another melee weapon", "fl": "A paralysing touch. (Your normal damage; every hit stuns.)", "bk": "Handbook of Bones"}, {"id": "dulling_touch", "nm": "Dulling Touch", "sc": "Enchantment", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjures a dulling touch. Your melee hits also inflict Weakened until you conjure another melee weapon", "fl": "A touch that saps the strength from the victim's arm.", "bk": "Pocket Guide of Moods"}, {"id": "magic_weapon", "nm": "Magic Weapon", "sc": "Transmutation", "lvl": 1, "tg": "Self", "sh": "", "ef": "Your weapons gain +1 damage (up to +3 in all) until the fight ends or you conjure a new one", "fl": "Whatever you are holding hits +1 harder. Stacks up to +3.", "bk": "Folio of Shapes"}, {"id": "greater_magic_weapon", "nm": "Greater Magic Weapon", "sc": "Transmutation", "lvl": 4, "tg": "Self", "sh": "", "ef": "Your weapons gain +2 damage (up to +3 in all) until the fight ends or you conjure a new one", "fl": "Whatever you are holding hits +2 harder. Stacks up to +3.", "bk": "Grand Codex of Alteration"}, {"id": "weapon_dance", "nm": "Dancing Weapon", "sc": "Evocation", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "The target's ho agree to one fight.", "bk": "Arcanum of Visitors"}, {"id": "dragons_call", "nm": "Dragon's Call", "sc": "Conjuration", "lvl": 7, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Wyvern (HP 6, Move 4, Attack 1 phys + Poisoned; Flies). Leaves after 5 turns, Summons Dragon Whelp x2 (HP 4, Move 4, Attack 1 phys, Ranged 1 fire, range 3; Flies, Immune fire). Leaves after 5 turns", "fl": "A wyvern and two whelps answer. They will not stay.", "bk": "Arcanum of Visitors"}, {"id": "horrible_things", "nm": "Summon Horrible Things", "sc": "Necromancy", "lvl": 6, "tg": "Empty square, range 5", "sh": "", "ef": "Summons Black Tentacle x3 (HP 4, Move 0, Attack 1 phys + Rooted; Cannot move, Reach 2). UNCONTROLLED: attacks whatever is nearest, friend or foe. Leaves after 6 turns", "fl": "Three black tentacles with no master. They grab whatever is nearest.", "bk": "Magnum Opus of Shades"}, {"id": "planar_binding", "nm": "Planar Binding", "sc": "Conjuration", "lvl": 3, "tg": "Any creature, range 6", "sh": "", "ef": "A rampaging creature obeys you again", "fl": "Bring a rampaging summon back under your control.", "bk": "Lexicon of Servants"}, {"id": "malign_gateway", "nm": "Malign Gateway", "sc": "Necromancy", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Malign Gateway (every 2 turns within 0 tiles: Summons one of: Imp, Hell Hound, Shadow Demon. UNCONTROLLED. Leaves after 4 turns, lasts 8 turns)", "fl": "A rift to somewhere unpleasant. Every other turn something comes through, and it answers to no one.", "bk": "Arcanum of Graves"}, {"id": "twin_portals", "nm": "Twin Portals", "sc": "Spatial", "lvl": 3, "tg": "Empty square, range 6", "sh": "", "ef": "Opens two linked portals (one beside you, one there). Step into either, leave by the other. 8 turns", "fl": "Two linked doorways: one at your feet, one where you point. Anyone may use them.", "bk": "Codex of Distance"}, {"id": "barrelling_boulder", "nm": "Barrelling Boulder", "sc": "Geomancy", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Rolling Boulder (drifts 3 tiles a turn, whoever it touches: 3 force damage, Pushes 1, lasts 5 turns)", "fl": "A boulder rolls three tiles a turn in the direction you throw it, crushing everything in its path (friend or foe).", "bk": "Archive of Deep Places"}, {"id": "delayed_blast_fireball", "nm": "Delayed Blast Fireball", "sc": "Pyromancy", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Delayed Fireball (every 2 turns within 3 tiles: 4 fire damage (foes only), Burning (2 turns) (foes only), lasts 2 turns)", "fl": "A bead of fire that waits two turns, then erupts across a radius of three.", "bk": "Black Grimoire of Cinders"}, {"id": "fulminant_prism", "nm": "Fulminant Prism", "sc": "Evocation", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Fulminant Prism (every 2 turns within 2 tiles: Each creature hit gets one at random: 3 fire damage (foes only) / 3 cold damage (foes only) / 3 elec damage (foes only) / 3 acid damage (foes only), Blind (2 turns) (foes only), lasts 2 turns)", "fl": "A crystal that shatters after two turns in a random spray of fire, frost, lightning or acid, blinding all it touches.", "bk": "Grand Codex of Raw Power"}, {"id": "power_word_blind", "nm": "Power Word: Blind", "sc": "Enchantment", "lvl": 4, "tg": "Self", "sh": "Everything in sight", "ef": "Blind (5 turns) (foes only) if HP <= 12", "fl": "Foes in sight with up to 12 HP go blind.", "bk": "Tome of Obedience"}, {"id": "holy_word", "nm": "Holy Word", "sc": "Divine", "lvl": 5, "tg": "Self", "sh": "Everything in sight", "ef": "2 holy damage (foes only) (unholy only), Slowed (2 turns) (foes only), Stunned (2 turns) (foes only) if HP <= 6", "fl": "The unholy are scorched and slowed, and small foes are stunned.", "bk": "Forbidden Tome of Blessings"}, {"id": "word_of_chaos", "nm": "Word of Chaos", "sc": "Chaos", "lvl": 5, "tg": "Self", "sh": "Everything in sight", "ef": "Slowed (3 turns) (foes only), Confused (3 turns) (foes only) if HP <= 10, Stunned (2 turns) (foes only) if HP <= 5", "fl": "Everything in sight slows; the weak reel; the weakest are stunned.", "bk": "Black Grimoire of Madness"}, {"id": "blasphemy", "nm": "Blasphemy", "sc": "Necromancy", "lvl": 6, "tg": "Self", "sh": "Everything in sight", "ef": "Weakened (4 turns) (foes only), Blind (4 turns) (foes only) if HP <= 8, Instant death (living only) if HP <= 3, else 0 damage (bosses resist)", "fl": "Living foes in sight weaken; frail ones go blind; the feeblest simply die.", "bk": "Black Grimoire of Whispers"}, {"id": "undeath_to_death", "nm": "Undeath to Death", "sc": "Divine", "lvl": 5, "tg": "Any square, range 6", "sh": "Radius 3", "ef": "Instant death (undead only) if HP <= 6, else 1 damage (bosses resist)", "fl": "The restless dead in the blast with 6 HP or less fall apart.", "bk": "Apocrypha of Dawn"}, {"id": "make_whole", "nm": "Make Whole", "sc": "Transmutation", "lvl": 2, "tg": "Ally, range 5", "sh": "", "ef": "Heals 6 (allies only)", "fl": "Mend a damaged construct.", "bk": "Pocket Guide of Transformation"}, {"id": "heat_metal", "nm": "Heat Metal", "sc": "Pyromancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "3 fire damage (foes only) (construct only), Burning (3 turns) (foes only) (construct only)", "fl": "Armour and automata glow cherry-red. Works only on constructs.", "bk": "Pocket Guide of the Pyre"}, {"id": "glitterdust", "nm": "Glitterdust", "sc": "Conjuration", "lvl": 2, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Blind (3 turns) (foes only), Glowing (4 turns) (foes only)", "fl": "Golden specks blind and outline everything caught, invisible things included.", "bk": "Folio of Calling"}, {"id": "blade_barrier", "nm": "Blade Barrier", "sc": "Evocation", "lvl": 5, "tg": "Any square, range 5", "sh": "Row of 5", "ef": "Creates Blade Barrier (anything entering it: 3 force damage, each turn, to anything in it: 2 force damage, lasts 6 turns)", "fl": "A curtain of whirling blades. Stepping in or lingering hurts.", "bk": "Forbidden Tome of Blasting"}, {"id": "transformation", "nm": "Transformation", "sc": "Transmutation", "lvl": 5, "tg": "Self", "sh": "", "ef": "Conjures a battle-form's fists. Your melee attack becomes 4 phys until you conjure another melee weapon, Empowered (6 turns), +4 max HP", "fl": "You become a brawler: tougher, stronger, and hitting for 4.", "bk": "Magnum Opus of Shapes"}, {"id": "flame_ward", "nm": "Flame Ward", "sc": "Pyromancy", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Flame Ward (raises fire damage within 2 tiles by 1, every round, within 2 tiles: 1 fire damage (foes only), lasts 6 turns)", "fl": "A ring of fire: scorches foes nearby, and all fire damage within two tiles hits +1 harder (yours too).", "bk": "Grimoire of Sparks"}, {"id": "stone_ward", "nm": "Stone Ward", "sc": "Geomancy", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Stone Ward (raises force, phys damage within 2 tiles by 1, every round, within 2 tiles: Each creature hit gets one at random: Stunned (1 turn) /  / , lasts 6 turns)", "fl": "Stones hover and now and then stun a foe. Force and physical damage nearby hits +1 harder.", "bk": "Grimoire of Sand"}, {"id": "storm_ward", "nm": "Storm Ward", "sc": "Storm", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Storm Ward (raises elec damage within 2 tiles by 1, every round, within 2 tiles: Each creature hit gets one at random: 2 elec damage / , lasts 6 turns)", "fl": "Crackling air that shocks foes at random. Lightning damage nearby hits +1 harder.", "bk": "Grimoire of Stormfronts"}, {"id": "gale_ward", "nm": "Gale Ward", "sc": "Storm", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Gale Ward (raises sonic, cold damage within 2 tiles by 1, every round, within 2 tiles: Slowed (1 turn) (foes only), lasts 6 turns)", "fl": "Biting wind that slows foes. Sonic and cold damage nearby hits +1 harder.", "bk": "Grimoire of Static"}, {"id": sence", "nm": "Capture Essence", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Traps the soul of a creature with 3 HP or less in a gem (otherwise 1 necrotic damage). Release it later with a soul spell", "fl": "Draw a weakened creature's soul into a gem (HP 3 or less); anything tougher just takes 1 damage.", "bk": "Codex of Dread"}, {"id": "trap_the_soul", "nm": "Trap the Soul", "sc": "Necromancy", "lvl": 5, "tg": "Enemy, range 5", "sh": "", "ef": "Traps the soul of a creature with 7 HP or less in a gem (otherwise 3 necrotic damage). Release it later with a soul spell", "fl": "Imprison a creature's soul in a gem if it has 7 HP or less; otherwise it takes 3 damage.", "bk": "Apocrypha of Dread"}, {"id": "release_soul", "nm": "Release Soul", "sc": "Necromancy", "lvl": 2, "tg": "Empty square, range 5", "sh": "", "ef": "Releases your most recently trapped soul as an ally for 8 turns", "fl": "Free your most recently trapped soul as a servant for eight turns.", "bk": "Notebook of Rot"}, {"id": "mass_enlarge", "nm": "Mass Enlarge", "sc": "Transmutation", "lvl": 4, "tg": "Self", "sh": "Radius 3", "ef": "+2 max HP, Enlarged (5 turns) (allies only)", "fl": "Every ally within three tiles swells, including you.", "bk": "Grand Codex of Alteration"}, {"id": "animal_growth", "nm": "Animal Growth", "sc": "Nature", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "+4 max HP, Enlarged (8 turns) (animal only)", "fl": "A beast doubles in size: +4 health, +1 damage and long reach.", "bk": "Lexicon of the Wild"}, {"id": "interposing_hand", "nm": "Interposing Hand", "sc": "Evocation", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Interposing Hand (blocks movement, HP 4, can be attacked, every round, within 1 tiles: Pushes 1 (foes only), lasts 8 turns)", "fl": "A huge hand of force blocks the way, shoving away foes beside it.", "bk": "Great Grimoire of Radiance"}, {"id": "forceful_hand", "nm": "Forceful Hand", "sc": "Evocation", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Forceful Hand (hunts the nearest foe, 2 tiles a turn, whoever it touches: 1 force damage (foes only), Pushes 3 (foes only), and Stunned if it hits a wall or another unit, lasts 6 turns)", "fl": "A hand of force seeks the nearest foe and shoves it three tiles, stunning it if it hits something.", "bk": "Grand Codex of Raw Power"}, {"id": "hunting_grasp", "nm": "Hunting Grasp", "sc": "Evocation", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Grasping Hand (hunts the nearest foe, 2 tiles a turn, whoever it touches: 1 force damage (foes only), Rooted (2 turns) (foes only), lasts 6 turns)", "fl": "A hand of force seizes the nearest foe, rooting it.", "bk": "Great Grimoire of Radiance"}, {"id": "clenched_fist", "nm": "Clenched Fist", "sc": "Evocation", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Clenched Fist (hunts the nearest foe, 3 tiles a turn, whoever it touches: 4 force damage (foes only), lasts 5 turns)", "fl": "A fist of force that races at the nearest foe for 4 damage each time it hits.", "bk": "Arcanum of Impact"}, {"id": "relentless_hand", "nm": "Relentless Hand", "sc": "Evocation", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Crushing Hand (hunts the nearest foe, 2 tiles a turn, whoever it touches: 3 force damage (foes only), Stunned (1 turn) (foes only), Rooted (2 turns) (foes only), lasts 6 turns)", "fl": "A hand of force crushes the nearest foe: 3 damage, stunned and rooted.", "bk": "Black Grimoire of Invocation"}, {"id": "rope_trick", "nm": "Rope Trick", "sc": "Conjuration", "lvl": 3, "tg": "Self", "sh": "Radius 1", "ef": "Encased (2 turns) (allies only)", "fl": "You and the allies beside you vanish into a hidden space for two turns: untouchable, but unable to act.", "bk": "Codex of Gates"}, {"id": "time_skip", "nm": "Time Skip", "sc": "Spatial", "lvl": 4, "tg": "Self", "sh": "", "ef": "Return to where you stood and how healthy you were a turn ago , boar, hawk). While mounted you move as fast as it does, it soaks damage for you, and it carries you off when it falls.", "bk": "Scrap of Servants"}, {"id": "dismount", "nm": "Dismount", "sc": "Conjuration", "lvl": 0, "tg": "Self", "sh": "", "ef": "Climb down; the steed returns beside you with the health it has left", "fl": "Climb down. Your steed returns beside you with whatever health it has left.", "bk": "Scrap of Servants"}, {"id": "ghostly_charger", "nm": "Ghostly Charger", "sc": "Conjuration", "lvl": 2, "tg": "Self", "sh": "", "ef": "Conjure a Warhorse and ride it for 10 turns: its movement is yours and its 3 HP soak up blows first", "fl": "Conjure a spectral horse and ride it at once for ten turns: fast movement, and it takes blows for you.", "bk": "Handbook of Summoning"}, {"id": "skyborne_steed", "nm": "Skyborne Steed", "sc": "Conjuration", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjure a Pegasus and ride it for 10 turns: its movement is yours and its 3 HP soak up blows first", "fl": "Conjure a winged steed and ride it at once for ten turns. You fly while mounted.", "bk": "Codex of Gates"}, {"id": "unicorn_ride", "nm": "Unicorn Ride", "sc": "Nature", "lvl": 4, "tg": "Self", "sh": "", "ef": "Conjure a Unicorn and ride it for 12 turns: its movement is yours and its 4 HP soak up blows first", "fl": "A unicorn carries you for twelve turns, soaking damage in your stead.", "bk": "Magnum Opus of Beasts"}, {"id": "war_eagle", "nm": "War Eagle", "sc": "Nature", "lvl": 3, "tg": "Self", "sh": "", "ef": "Conjure a Giant Eagle and ride it for 10 turns: its movement is yours and its 2 HP soak up blows first", "fl": "Ride a giant eagle for ten turns. You fly while mounted.", "bk": "Grand Codex of Greenwood"}, {"id": "hang_spell", "nm": "Hang Spell", "sc": "Spatial", "lvl": 3, "tg": "Self", "sh": "", "ef": "Hung Spell (10 turns)", "fl": "Hold your next spell in suspension: it is cast normally but its effect is stored and released at the start of your next turn.", "bk": , "tg": "Self", "sh": "Radius 3", "ef": "Encased (3 turns) (allies only), Heals 6 (allies only)", "fl": "Allies within three tiles, you included, withdraw into a pocket mansion for three turns and are healed 6.", "bk": "Apocrypha of Thresholds"}, {"id": "volcano", "nm": "Volcano", "sc": "Geomancy", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Volcano (every 3 turns within 1 tiles: 2 fire damage, turns the ground here and the squares next to it into Lava, then the Lava spreads one or two squares a turn in wandering directions, when it ends the ground becomes Scorched Earth, lasts 10 turns)", "fl": "A vent splits the ground: the squares around it turn to lava at once, and the lava pool then flows outward a square or two a turn in wandering directions for ten turns. The vent scorches everything adjacent for 2 fire damage every third turn. The lava cools to scorched earth afterwards.", "bk": "Arcanum of Sand"}, {"id": "whirlpool", "nm": "Whirlpool", "sc": "Cryomancy", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Whirlpool (every round, within 2 tiles: Pulls 1, 1 cold damage (foes only), drifts 1 tile a turn, lasts 7 turns)", "fl": "A wandering maelstrom drags everything within two tiles toward it each round, and foes take 1 cold damage.", "bk": "Arcanum of Hoarfrost"}, {"id": "seismic_wave", "nm": "Seismic Wave", "sc": "Geomancy", "lvl": 5, "tg": "Self", "sh": "Radius 5", "ef": "The ground cracks: rubble (and sometimes chasms) appear, and everything grounded in the area takes 2 damage and is stunned", "fl": "Ground within five tiles of you splits and buckles. Non-flying units take 2 damage and are stunned; floors crack to rubble or chasms.", "bk": "Forbidden Tome of Titans"}, {"id": "coin_toss", "nm": "Toss of a Coin", "sc": "Chaos", "lvl": 2, "tg": "Self", "sh": "", "ef": "Coin Toss (6 turns)", "fl": "Your next damaging spell or attack is decided by a coin: heads, triple damage; tails, nothing at all.", "bk": "Pocket Guide of Folly"}, {"id": "revolving_chamber", "nm": "Revolving Chamber", "sc": "Chaos", "lvl": 2, "tg": "Self", "sh": "", "ef": "Lucky Number (6 turns)", "fl": "Spin the cylinder: a random number from 1 to 6 becomes your charm, and any hit that deals exactly that much damage to you is ignored.", "bk": "Manual of Wild Magic"}, {"id": "rite_of_three_sisters", "nm": "Rite of Three Sisters", "sc": "Divine", "lvl": 3, "tg": "Self", "sh": "Radius 3", "ef": "Shared Pain (6 turns) (allies only)", "fl": "You and every ally within three tiles are bonded: damage dealt to any of you is split equally between all of you.", "bk": "Compendium of Dawn"}, {"id": "fluid_body", "nm": "Body Like Still Water", "sc": "Transmutation", "lvl": 3, "tg": "Self", "sh": "", "ef": "Fluid Body (4 turns)", "fl": "Your flesh flows around blows: physical hits deal you at most a random 0 to 3 damage.", "bk": "Grimoire of Metamorphosis"}, {"id": "lonesome_lunchbox", "nm": "Lonesome Lunchbox", "sc": "Alchemy", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "Summons Clockwork Lunchbox (HP 2, Move 2, Attack 1 phys; Construct, Builds copies of itself). Leaves after 7 turns", "fl": "A scuttling clockwork pail that builds a copy of itself every turn (up to six). They vanish after seven turns.", "bk": "Opus of Residue"}, {"id": "just_a_graze", "nm": "Just a Graze", "sc": "Divination", "lvl": 2, "tg": "Ally, range 5", "sh": "", "ef": "Heals all but 1 of the last blow taken", "fl": "Redefine the last blow an ally took as a mere scratch: they heal all but 1 of its damage.", "bk": "Pocket Guide of Stars"}, {"id": "rewrite_the_wound", "nm": "Rewrite the Wound", "sc": "Divination", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Heals the HP lost since the start of the previous turn", "fl": "History is edited: an ally recovers all the HP lost since the start of their previous turn.", "bk": "Codex of Foresight"}, {"id": "borrowed_vigour", "nm": "Borrowed Vigour", "sc": "Alchemy", "lvl": 2, "tg": "Ally, range 5", "sh": "", "ef": "Heals 8 now; the health is taken back after 3 turns", "fl": "Heal up to 8 now. In three turns you pay it all back.", "bk": "Pocket Guide of Residue"}, {"id": "slapstick_riot", "nm": "Slapstick Riot", "sc": "Illusion", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Slapstick Zone (every round, within 3 tiles: Slapstick (2 turns) (including you), lasts 4 turns)", "fl": "For four turns everyone within three tiles of the spot, friend or foe, can suffer no more than 2 damage from a single hit.", "bk": "Treatise of Phantasms"}, {"id": "hex_of_three_failures", "nm": "Hex of Three Failures", "sc": "Enchantment", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Hexed x3 (8 turns)", "fl": "The target's next three attacks go wrong: the first is weaker, the second halved, the third misses.", "bk": "Treatise of Puppets"}, {"id": "boon_of_three_fortunes", "nm": "Boon of Three Fortunes", "sc": "Divine", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Boon x3 (8 turns)", "fl": "The next three attacks or damaging spells are blessed: +1 damage, then +2, then double.", "bk": "Compendium of Saints"}, {"id": "hexing_ward", "nm": "Hexing Ward", "sc": "Abjuration", "lvl": 3, "tg": "Empty square, range 4", "sh": "", "ef": "Creates Hexing Rune (anything entering it: Hexed x3 (8 turns) (within 1 tiles))", "fl": "A hidden rune: the first foe to step beside it is hexed, and its next three attacks go wrong.", "bk": "Compendium of Sanctuary"}, {"id": "mask_of_the_beast", "nm": "Mask of the Beast", "sc": "Nature", "lvl": 3, "tg": "Any creature, range 5", "sh": "", "ef": "Borrow the creature's flight, regeneration, reach and similar abilities for 8 turns", "fl": "Take on a creature's gifts (flight, regeneration, reach, thorns...) for eight turns.", "bk": "Codex of Beasts"}, {"id": "fire_of_the_red_king", "nm": "Fire of the Red King", "sc": "Pyromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Escalation (5 turns)", "fl": "For five turns each consecutive hit on the same target deals +1 damage more, up to +3.", "bk": "Codex of Flame"}, {"id": "creditors_raiment", "nm": "Creditor's Raiment", "sc": "Divine", "lvl": 3, "tg": "Self", "sh": "", "ef": "Sacred Raiment (5 turns)", "fl": "For five turns, every spell you cast makes each foe within four tiles take 1 psychic damage.", "bk": "Codex of Mercy"}, {"id": "soul_sipping", "nm": "Soul Sipping", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 2", "sh": "", "ef": "Cuts its maximum HP by 25% for the battle and adds it to yours, 1 necro damage", "fl": "Drink a creature's spirit: a quarter of its maximum HP is lost to it for the battle and added to yours.", "bk": "Codex of Whispers"}, {"id": "poltergeist_barrage", "nm": "Poltergeist Barrage", "sc": "Evocation", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "Damage 1 + loose objects and corpses within 4 tiles of you (max 5), phys", "fl": "Loose objects and corpses within four tiles of you hurl themselves at the target: 1 damage plus one per item (max 5).", "bk": "Pocket Guide of Havoc"}, {"id": "moment_eternal", "nm": "A Moment Eternal", "sc": "Spatial", "lvl": 5, "tg": "Empty square, range 4", "sh": "", "ef": "Creates Eternal Moment (every round, within 2 tiles: Hasted (1 turn) (allies only), lasts 3 turns)", "fl": "For three turns allies within two tiles of the spot move through time faster: they are hasted every round.", "bk": "Arcanum of Waypoints"}, {"id": "swarm_intrusion", "nm": "Swarm Intrusion", "sc": "Nature", "lvl": 3, "tg": "Enemy, range 4", "sh": "", "ef": "Possess a foe (not bosses) for 4 turns: it fights for you. Your own body is stunned 2 turns, and you take 3 damage if the possessed body dies", "fl": "Send a swarm into a wild beast's body for four turns: it is charmed and fights for you, but you are stunned for two turns.", "bk": "Lexicon of the Hunt"}, {"id": "pattern_of_the_sublime", "nm": "Pattern of the Sublime", "sc": "Illusion", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "You must concentrate: its lasting effects end if you are hurt, disabled or cast another spell, and last at most 5 turns, Stunned (99 turns) (foes only)", "fl": "A display of impossible beauty. Foes in it stand fascinated for as long as you keep your attention on it (five turns at most). Casting, or being hurt, breaks the spell.", "bk": "Opus of Deceit"}, {"id": "reign_of_long_nerves", "nm": "Reign of Long Nerves", "sc": "Enchantment", "lvl": 5, "tg": "Enemy, range 6", "sh": "", "ef": "You must concentrate: its lasting effects end if you are hurt, disabled or cast another spell, and last at most 6 turns, Charmed (99 turns) (foes only)", "fl": "Pull the strings of a foe's body: it fights for you while you concentrate (six turns at most).", "bk": "Apocrypha of Moods"}, {"id": "blade_of_disjection", "nm": "Blade of Disjection", "sc": "Evocation", "lvl": 5, "tg": "Empty square, range 4", "sh": "", "ef": "You must concentrate: its lasting effects end if you are hurt, disabled, and last at most 6 turns, Creates Blade of Disjection (every round, within 1 tiles: 1 force damage (foes only), hunts the nearest foe, 3 tiles a turn, whoever it touches: 4 force damage (foes only), lasts 99 turns)", "fl": "A shimmering plane of force hunts the nearest foe, cutting 4 force damage as it touches and 1 to anything beside it each turn. It vanishes if you are hurt or disabled.", "bk": "Forbidden Tome of Blasting"}, {"id": "conjure_elemental_id", "nm": "Conjure the Elemental Id", "sc": "Conjuration", "lvl": 5, "tg": "Empty square, range 4", "sh": "", "ef": "You must concentrate: its lasting effects end if you are hurt, disabled, and last at most 10 turns; summoned creatures turn wild instead of vanishing, Summons one of: Fire Elemental, Ice Elemental, Earth Elemental, Air Elemental, Water Elemental", "fl": "A raw elemental answers to you while you hold it in mind. If your grip breaks (you are hurt or disabled) it runs wild; if the ten turns simply run out, it departs.", "bk": "Apocrypha of Contracts"}, {"id": "phantom_of_doom", "nm": "Phantom of Doom", "sc": "Illusion", "lvl": 4, "tg": "Empty square, range 4", "sh": "", "ef": "You must concentrate: its lasting effects end if you are hurt, disabled, and last at most 6 turns, Creates Phantom of Doom (hunts the nearest foe, 2 tiles a turn, whoever it touches: Instant death (living only) if HP <= 5, else 5 damage (bosses resist), lasts 99 turns)", "fl": "A phantom that exists only as dread hunts the nearest foe: one touch kills a living creature of 5 HP or less, and does 5 to the rest. It dissolves if you are hurt or disabled.", "bk": "Archive of Shadows"}, {"id": "phantasmal_archers", "nm": "Phantasmal Archers", "sc": "Illusion", "lvl": 2, "tg": "Empty square, range 4", "sh": "", "ef": "You must concentrate: its lasting effects end if you are hurt, disabled or cast another spell, and last at most 6 turns, Summons Phantom Archer x2 (HP 2, Move 2, Attack 1 phys, Ranged 1 phys, range 5)", "fl": "Two bowmen of pure suggestion. They vanish the moment your attention does.", "bk": "Handbook of Shadows"}, {"id": "finding_the_center", "nm": "Finding the Center", "sc": "Abjuration", "lvl": 4, "tg": "Self", "sh": "", "ef": "Centred Mind (8 turns)", "fl": "Your unconscious mind holds on for you: for eight turns your concentration cannot be broken by damage or by casting other spells.", "bk": "Opus of Barriers"}, {"id": "reciprocal_gyre", "nm": "Reciprocal Gyre", "sc": "Abjuration", "lvl": 5, "tg": "Enemy, range 6", "sh": "", "ef": "2 force damage per beneficial effect on each foe (max 12), and stuns it", "fl": "The magic upon a creature turns against it: 2 force damage for every beneficial effect it carries (up to 12), and it is stunned a turn.", "bk": "Forbidden Tome of Shields"}, {"id": "reaving_dispel", "nm": "Reaving Dispel", "sc": "Abjuration", "lvl": 6, "tg": "Any square, range 6", "sh": "Radius 2", "ef": "Rips every beneficial effect off each foe and puts it on you", "fl": "Tear every beneficial effect off each foe in the area and wear them yourself, with their remaining time.", "bk": "Arcanum of Sanctuary"}, {"id": "absorption", "nm": "Absorption", "sc": "Abjuration", "lvl": 5, "tg": "Self", "sh": "", "ef": "Absorption x3 (8 turns)", "fl": "For eight turns the next three hostile spell hits that would damage you are swallowed whole, and each one gives you an extra spell cast.", "bk": "Magnum Opus of Aegis"}, {"id": "forlorn_encystment", "nm": "Forlorn Encystment", "sc": "Geomancy", "lvl": 6, "tg": "Enemy, range 6", "sh": "", "ef": "Sinking Into Stone (3 turns), Rooted (3 turns)", "fl": "The target sinks into the ground. If it is not freed (cleansed) within three turns it is sealed in stone for the rest of the battle. Bosses tear loose, bruised.", "bk": "Apocrypha of Iron"}, {"id": "ward_of_refusal", "nm": "Ward of Refusal", "sc": "Abjuration", "lvl": 4, "tg": "Any square, range 5", "sh": "Row of 3", "ef": "Creates Ward of Refusal (enemy spellcasters cannot step onto it, lasts 8 turns)", "fl": "An invisible line that enemy spellcasters cannot cross. Everyone else walks through as if it were not there.", "bk": "Opus of Sigils"}, {"id": "wall_of_gloom", "nm": "Wall of Gloom", "sc": "Illusion", "lvl": 3, "tg": "Any square, range 5", "sh": "Row of 3", "ef": "Creates Wall of Gloom (blocks sight, enemy creatures of 4 max HP or less cannot step onto it, lasts 8 turns)", "fl": "A curtain of shadow that blocks sight and that enemy creatures of 4 max HP or less cannot bring themselves to cross.", "bk": "Tome of Veils"}, {"id": "the_slow_hour", "nm": "The Slow Hour", "sc": "Transmutation", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Hasted (4 turns) (allies only), +-2 max HP", "fl": "Allies in the area are hasted for four turns, but the sped-up years cost each of them 2 maximum HP.", "bk": "Grimoire of Flux"}, {"id": "vile_menagerie", "nm": "Vile Menagerie", "sc": "Conjuration", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Builds 2 random creatures (random shape, speed, size, attack and quirks) for 8 turns", "fl": "Give form to two nameless things. Each is built from chance: a random shape, speed, size, attack and one or two quirks. They last eight turns.", "bk": "Tome of Visitors"}, {"id": "drench", "nm": "Drench", "sc": "Nature", "lvl": 1, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Soaked (4 turns) (foes only)", "fl": "Foes in the area are soaked for four turns: lightning hurts them +2, fire hurts 2 less and is put out, and cold freezes them for a turn.", "bk": "Primer of Roots"}, {"id": "flask_of_oil", "nm": "Flask of Oil", "sc": "Alchemy", "lvl": 1, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Oiled (5 turns) (foes only)", "fl": "Foes are slicked with oil for five turns: fire damage to them is +2 and sets them alight.", "bk": "Primer of Acids"}, {"id": "powder_cloud", "nm": "Powder Cloud", "sc": "Alchemy", "lvl": 2, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Powdered (5 turns) (foes only)", "fl": "Foes are dusted with black powder. The next fire or lightning damage sets it off: +3 damage to the target and 2 to creatures beside it.", "bk": "Folio of Elixirs"}, {"id": "storm_soak", "nm": "Storm Soak", "sc": "Storm", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Soaked (4 turns) (foes only), 2 elec damage (foes only)", "fl": "A cloudburst with lightning in it: foes are soaked, and then struck, so the bolt does +2.", "bk": "Treatise of the Squall"}, {"id": "molotov", "nm": "Molotov", "sc": "Pyromancy", "lvl": 2, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Oiled (4 turns) (foes only), 2 fire damage (foes only)", "fl": "A flask of oil and flame: foes are oiled, and then burned, so the fire does +2 and sets them alight.", "bk": "Handbook of Cinders"}, {"id": "wave_of_embers", "nm": "Wave of Embers", "sc": "Pyromancy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Creates Ring of Embers (an expanding ring that grows one tile a turn out to 4 tiles, affecting only the tiles at its edge: 2 fire damage (foes only), Burning (2 turns) (foes only), lasts 6 turns)", "fl": "A ring of burning air grows from you one tile a turn, out to four tiles. Each turn it burns only the foes standing on its edge (2 fire damage, burning).", "bk": "Black Grimoire of Cinders"}, {"id": "tide_of_acid", "nm": "Tide of Acid", "sc": "Alchemy", "lvl": 4, "tg": "Self", "sh": "", "ef": "Creates Tide of Acid (an expanding ring that grows one tile a turn out to 4 tiles, affecting only the tiles at its edge: 2 acid damage (foes only), lasts 6 turns)", "fl": "A ring of dripping acid spreads from you one tile a turn, out to four tiles, doing 2 acid damage to foes on its edge.", "bk": "Magnum Opus of Retorts"}, {"id": "ripple_of_mercy", "nm": "Ripple of Mercy", "sc": "Divine", "lvl": 4, "tg": "Self", "sh": "", "ef": "Creates Ripple of Mercy (an expanding ring that grows one tile a turn out to 4 tiles, affecting only the tiles at its edge: Heals 2 (allies only), lasts 6 turns)", "fl": "A ring of warm light spreads from you one tile a turn, out to four tiles, healing 2 to allies standing on its edge.", "bk": "Tome of Saints"}, {"id": "unwanted_pyrotechnics", "nm": "Unwanted Pyrotechnics", "sc": "Chaos", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Fire Flinger (4 turns)", "fl": "For four turns the target hurls fire at a random spot within three tiles at the start of its turn (2 damage in a small burst), burning friend and foe alike.", "bk": "Treatise of Coincidence"}, {"id": "storm_jinx", "nm": "Storm Jinx", "sc": "Storm", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Storm Flinger (4 turns)", "fl": "For four turns the target hurls lightning at a random spot within three tiles at the start of its turn (2 damage in a small burst), shocking friend and foe alike.", "bk": "Codex of Tempests"}, {"id": "time_shield", "nm": "Time Shield", "sc": "Spatial", "lvl": 3, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Time Shield (every round, within 2 tiles: Every timed effect on creatures in the area (good or bad) loses an extra turn, lasts 5 turns)", "fl": "For five turns, every timed effect on creatures within two tiles of the spot, good or bad, runs out an extra turn faster each round.", "bk": "Lexicon of Gates"}, {"id": "spell_lodestone", "nm": "Spell Lodestone", "sc": "Abjuration", "lvl": 4, "tg": "Ally, range 5", "sh": "", "ef": "Spell Lodestone (5 turns)", "fl": "For five turns ranged hits aimed at your allies within three tiles of the target are drawn to the target instead.", "bk": "Great Grimoire of Banishment"}, {"id": "sundering_bolt", "nm": "Sundering Bolt", "sc": "Storm", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "3 elec damage, Sundered (4 turns)", "fl": "A hammer of lightning that cracks the target's defences: 2 lightning damage, and for four turns every hit it takes does 1 extra.", "bk": "Grimoire of Stormfronts"}, {"id": "rotting_touch", "nm": "Rotting Touch", "sc": "Necromancy", "lvl": 2, "tg": "Enemy, range 1", "sh": "", "ef": "Diseased (5 turns)", "fl": "A touch that sets rot in the flesh: for five turns the target cannot be healed at all, and its regeneration stops.", "bk": "Notebook of Rot"}, {"id": "pestilent_ground", "nm": "Pestilent Ground", "sc": "Necromancy", "lvl": 5, "tg": "Any square, range 5", "sh": "", "ef": "Creates Pestilent Ground (every round, within 2 tiles: Diseased (3 turns) (foes only), 1 poison damage (foes only), lasts 5 turns)", "fl": "The earth turns to a fever-bed for five turns: foes within two tiles are diseased (half healing) and take 1 poison each round.", "bk": "Arcanum of Graves"}, {"id": "faltering_step_curse", "nm": "Faltering Step Curse", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Faltering Step (4 turns)", "fl": "For four turns the target takes 2 damage for every tile it walks. Standing still is safe.", "bk": "Lexicon of Bones"}, {"id": "spiteful_mark", "nm": "Spiteful Mark", "sc": "Necromancy", "lvl": 6, "tg": "Enemy, range 6", "sh": "", "ef": "Spite Mark (5 turns)", "fl": "For five turns, whenever the target attacks, it and every ally beside it take 2 damage.", "bk": "Black Grimoire of Whispers"}, {"id": "pain_echo_hex", "nm": "Pain Echo Hex", "sc": "Necromancy", "lvl": 4, "tg": "Enemy, range 6", "sh": "", "ef": "Pain Echo (6 turns)", "fl": "For six turns, whenever the target takes physical damage, the foes standing beside it take 2 necrotic damage.", "bk": "Archive of Whispers"}, {"id": "parting_gift_hex", "nm": "Parting Gift Hex", "sc": "Necromancy", "lvl": 4, "tg": "Enemy, range 6", "sh": "", "ef": "Parting Gift (8 turns)", "fl": "For eight turns, if the target dies it bursts for 4 damage to everyone beside it, and a skeleton rises from the remains on your side.", "bk": "Archive of Whispers"}, {"id": "weapons_to_snakes", "nm": "Weapons to Snakes", "sc": "Transmutation", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "Snake Hands (4 turns)", "fl": "The target's weapon writhes into a serpent: for four turns its blows do 2 less, and the snake bites it for 1 poison each turn.", "bk": "Compendium of Transformation"}, {"id": "withering_years", "nm": "Withering Years", "sc": "Necromancy", "lvl": 5, "tg": "Enemy, range 5", "sh": "", "ef": "Withered by Years (4 turns)", "fl": "The target ages in a breath: for four turns its max HP, damage and movement are halved. They return when the years do.", "bk": "Black Grimoire of Whispers"}, {"id": "rend_armor", "nm": "Rend Armor", "sc": "Transmutation", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Removes Shielded, Mirror Images, Status Ward, Spellguard, Resilient, Spell Immunity, Slapstick, Encased, Body Ward, Stoneskin, Fire Shield, Unguarded (3 turns)", "fl": "Tears every protective effect off the target, which cannot gain new ones for three turns.", "bk": "Great Grimoire of Metamorphosis"}, {"id": "wracking_pain", "nm": "Wracking Pain", "sc": "Necromancy", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Stunned (1 turn), Slowed (3 turns)", "fl": "Agony locks the target for a turn and leaves it at half speed for two more.", "bk": "Tome of Bones"}, {"id": "splinter_rider", "nm": "Splinter Rider", "sc": "Enchantment", "lvl": 4, "tg": "Ally, range 5", "sh": "", "ef": "Splinter Rider x2 (6 turns)", "fl": "An ally's next two melee hits also deal 2 force damage to every foe beside the target.", "bk": "Grand Codex of Puppets"}, {"id": "nightmare_rider", "nm": "Nightmare Rider", "sc": "Enchantment", "lvl": 3, "tg": "Ally, range 5", "sh": "", "ef": "Nightmare Rider x3 (6 turns)", "fl": "An ally's next three melee hits steal 2 life from the target and leave it weakened.", "bk": "Grimoire of Silver Tongues"}, {"id": "redirected_harm", "nm": "Redirected Harm", "sc": "Necromancy", "lvl": 5, "tg": "Self", "sh": "", "ef": "Redirected Harm (8 turns)", "fl": "For eight turns, three quarters of every hit you take is passed to your nearest summoned servant instead.", "bk": "Apocrypha of Dread"}, {"id": "totem_of_frailty", "nm": "Totem of Frailty", "sc": "Conjuration", "lvl": 4, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Totem of Frailty (HP 2, can be attacked, every round, within 3 tiles: Weakened (2 turns) (foes only), lasts 8 turns)", "fl": "A fragile spirit-post stands for eight turns, weakening every foe within three tiles each round. Destroy it to end the effect.", "bk": "Great Grimoire of the Menagerie"}, {"id": "totem_of_mending", "nm": "Totem of Mending", "sc": "Conjuration", "lvl": 5, "tg": "Empty square, range 5", "sh": "", "ef": "Creates Totem of Mending (HP 2, can be attacked, every round, within 3 tiles: Heals 2 (allies only), lasts 10 turns)", "fl": "A spirit-post stands for ten turns, healing allies within three tiles for 2 each round. Foes can destroy it.", "bk": "Arcanum of Visitors"}, {"id": "rending_darts", "nm": "Rending Darts", "sc": "Alchemy", "lvl": 3, "tg": "Enemy, range 6", "sh": "", "ef": "1 phys damage, Exposed (4 turns), Exposed (4 turns), Exposed (4 turns)", "fl": "Three barbed darts: 1 damage, and the target gains three stacks of Exposed for four turns. Each stack makes every hit it takes do 1 extra (up to 6).", "bk": "Codex of Acids"}, {"id": "jostling_curse", "nm": "Jostling Curse", "sc": "Chaos", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "2 force damage, Jostled (3 turns)", "fl": "2 force damage; for three turns the target is shoved one tile in a random direction at the start of its turn, into hazards, edges and allies alike.", "bk": "Notebook of Coincidence"}, {"id": "opening_strike", "nm": "Opening Strike", "sc": "Evocation", "lvl": 5, "tg": "Enemy, range 6", "sh": "", "ef": "3 force damage, doubled against a target at full health", "fl": "3 force damage, doubled against a target still at full health.", "bk": "Black Grimoire of Invocation"}, {"id": "radial_nova", "nm": "Radial Nova", "sc": "Evocation", "lvl": 8, "tg": "Any square, range 5", "sh": "Radius 4", "ef": "8 force damage at the centre, 2 less for each tile out (min 1); the centre is also stunned", "fl": "A shockwave that hits hardest at its centre: 8 force damage there (and the centre is stunned), 2 less for every tile outward.", "bk": "Magnum Opus of Raw Power"}, {"id": "wake_of_flame", "nm": "Wake of Flame", "sc": "Pyromancy", "lvl": 3, "tg": "Self", "sh": "", "ef": "Wake of Flame (5 turns)", "fl": "For five turns every tile you leave by walking bursts into flame for three turns, burning foes who stand in it.", "bk": "Lexicon of Cinders"}, {"id": "creeping_lava", "nm": "Creeping Lava", "sc": "Pyromancy", "lvl": 6, "tg": "Any square, range 5", "sh": "", "ef": "Creates Creeping Lava (every round, within 1 tiles: 3 fire damage (foes only), lasts 6 turns)", "fl": "A pool of lava starts small and spreads one tile outward each round, out to three tiles, doing 3 fire damage to foes in it. It lasts six turns.", "bk": "Forbidden Tome of Brimstone"}, {"id": "boon_transfusion", "nm": "Boon Transfusion", "sc": "Blood", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Copies one random beneficial effect from each target onto you (they keep it)", "fl": "Copies one random beneficial effect from the target onto you, with its remaining time. The target keeps it.", "bk": "Compendium of Sanguinity"}, {"id": "sowers_hex", "nm": "Sower's Hex", "sc": "Nature", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Spore-Bound (3 turns)", "fl": "Spores root the target in place for three turns. When they let go, a sapling sprouts on a nearby tile.", "bk": "Grimoire of Claws"}, {"id": "slumber_release", "nm": "Slumber Release", "sc": "Chaos", "lvl": 4, "tg": "Self", "sh": "", "ef": "You gain Stunned (1 turn), You gain Slumbering Storm (1 turn)", "fl": "You fall stunned for a turn. When you wake, a wave of dark force bursts out: 4 necrotic damage and a push to everything within three tiles, friends included.", "bk": "Grand Codex of Disorder"}, {"id": "leashing_chain", "nm": "Leashing Chain", "sc": "Conjuration", "lvl": 4, "tg": "Enemy, range 5", "sh": "", "ef": "Chains the target to you for 4 turns: it cannot end a step more than 3 tiles from you, and is dragged along if you pull away", "fl": "A chain binds the target to you for four turns: it cannot end a step more than three tiles from you, and is yanked along (1 damage) if you pull away.", "bk": "Archive of Summoning"}, {"id": "shadow_net", "nm": "Shadow Net", "sc": "Illusion", "lvl": 2, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "Shadow-Netted (4 turns) (foes only)", "fl": "Foes in the area see only the tile beside them for four turns: they cannot attack anything farther away.", "bk": "Treatise of Glamours"}, {"id": "aversion", "nm": "Aversion", "sc": "Abjuration", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Aversion (5 turns)", "fl": "For five turns the target cannot step onto any tile beside another creature, friend or foe.", "bk": "Notebook of Aegis"}, {"id": "shatterfloor", "nm": "Shatterfloor", "sc": "Evocation", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "2 sonic damage (foes only), Turns ground into Rubble", "fl": "A thrumming wave: 2 sonic damage to foes, and the floor in the area breaks into rubble that slows everyone crossing it.", "bk": "Treatise of Blasting"}, {"id": "boneless", "nm": "Boneless", "sc": "Transmutation", "lvl": 8, "tg": "Enemy, range 5", "sh": "", "ef": "Boneless (5 turns)", "fl": "The target collapses into a slow ooze for five turns: half movement, and it cannot attack or cast.", "bk": "Forbidden Tome of Quicksilver"}, {"id": "flooded_lungs", "nm": "Flooded Lungs", "sc": "Conjuration", "lvl": 5, "tg": "Enemy, range 5", "sh": "", "ef": "Flooded Lungs (3 turns)", "fl": "The target's lungs fill with water. If three turns pass uncured it dies; any cleansing or a healing of 3 or more saves it. Undead, constructs and bosses are immune.", "bk": "Magnum Opus of Gates"}, {"id": "returning_disc", "nm": "Returning Disc", "sc": "Evocation", "lvl": 2, "tg": "Any square, range 6", "sh": "Line, length 6", "ef": "1 force damage (foes only), 1 force damage (foes only)", "fl": "A spinning disc flies down a line and back again: everything on the line takes 1 force damage on the way out and again on the way back.", "bk": "Pocket Guide of Havoc"}, {"id": "fill_the_chasm", "nm": "Fill the Chasm", "sc": "Geomancy", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 3", "ef": "Turns ground into Floor", "fl": "Chasms and pits within three tiles are filled in and become solid floor.", "bk": "Great Grimoire of Bedrock"}, {"id": "glass_bones", "nm": "Glass Bones", "sc": "Necromancy", "lvl": 2, "tg": "Enemy, range 5", "sh": "", "ef": "Glass Bones (4 turns)", "fl": "For four turns physical, sonic and force hits do half again as much to the target, and it cannot be healed above half its max HP.", "bk": "Handbook of Bones"}, {"id": "bounty_mark", "nm": "Bounty Mark", "sc": "Divination", "lvl": 2, "tg": "Enemy, range 6", "sh": "", "ef": "Bountied (4 turns)", "fl": "Marks a foe for four turns. Foes hit it for 1 extra, and whoever slays it recovers 3 HP and gains an extra attack.", "bk": "Notebook of Far Sight"}, {"id": "booming_footsteps", "nm": "Booming Footsteps", "sc": "Storm", "lvl": 3, "tg": "Self", "sh": "", "ef": "Thunderstep (3 turns)", "fl": "For three turns each tile you walk sends out a thunderclap: 1 sonic damage and a one-tile push to adjacent foes.", "bk": "Lexicon of Whirlwinds"}, {"id": "inverted_vitality", "nm": "Inverted Vitality", "sc": "Necromancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "Inverted Vitality (3 turns)", "fl": "For three turns healing hurts the target and damage heals it for half.", "bk": "Treatise of Rot"}, {"id": "reluctant_foes", "nm": "Reluctant Foes", "sc": "Enchantment", "lvl": 4, "tg": "Any square, range 5", "sh": "Radius 2", "ef": "Hesitant (4 turns) (foes only)", "fl": "Foes in the area hesitate: the first attack each of them makes within four turns fizzles into a wasted action.", "bk": "Tome of Obedience"}, {"id": "creeping_stiffness", "nm": "Creeping Stiffness", "sc": "Cryomancy", "lvl": 3, "tg": "Enemy, range 5", "sh": "", "ef": "1 cold damage, Creeping Stiffness (6 turns)", "fl": "1 cold damage and a stack of stiffness lasting six turns. 1 stack: -1 move; 2: half movement; 3: it cannot attack; 4: frozen in place. Cast it again to add stacks.", "bk": "Codex of Rime"}, {"id": "frost_bridge", "nm": "Frost Bridge", "sc": "Cryomancy", "lvl": 2, "tg": "Any square, range 6", "sh": "Line, length 6", "ef": "Turns ground into Ice", "fl": "A line of chasm, deep water or lava freezes into a solid ice bridge that can be crossed.", "bk": "Notebook of Hoarfrost"}, {"id": "tide_slam", "nm": "Tide Slam", "sc": "Evocation", "lvl": 3, "tg": "Any square, range 5", "sh": "Radius 1", "ef": "2 force damage that cannot kill (a creature it would drop is left at 1 HP, asleep); puts out flames", "fl": "A burst of seawater: 2 damage to foes that cannot kill (a creature it would drop is left at 1 HP, asleep) and puts out flames.", "bk": "Grimoire of Impact"}, {"i
